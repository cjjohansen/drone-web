openapi: 3.1.0
info:
  title: Product Lifecycle API
  description: Write-side product master and lifecycle state management.
  version: 1.0.0
  contact:
    name: Drone Web API Team
  license:
    name: Proprietary
    url: https://example.com/terms
servers:
  - url: https://api.example.com/product-lifecycle/v1
    description: Production
security:
  - apiKey: []
  - oauth2: []
tags:
  - name: ProductLifecycle
    description: Product creation, updates, and lifecycle transitions
paths:
  /products:
    get:
      operationId: searchProductsForManagement
      summary: Query products for management workflows
      tags: [ProductLifecycle]
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: lifecycleState
          in: query
          schema: { type: string, enum: [draft, active, retired, discontinued] }
        - name: brand
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - name: sort
          in: query
          schema: { type: string, example: updatedDate }
      responses:
        '200':
          description: Paged product results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createProduct
      summary: Create product master record
      tags: [ProductLifecycle]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /products/{productId}/specifications:
    patch:
      operationId: updateProductSpecifications
      summary: Update technical specifications
      description: >-
        On a draft the values apply at once (200). On an active product every change goes through
        Catalog Governance review (CJ D3b, drone-web D-041): the request becomes a specification
        change request with all five new values (the values not in the patch keep their recorded
        value), Governance opens an approval case for it, and the operation answers 202 Accepted.
        The `Location` header and the `approvalCase` link point to that approval case; the client
        reads it (getApprovalCase) until its status is `released`, `rejected` or `expired`. The
        product keeps its values until the release, and only the values of the request take
        effect (PLC-009, PLC-012, drone-web D-039). On a discontinued product the specifications
        are frozen (PLC-010).
      tags: [ProductLifecycle]
      parameters:
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecificationPatch'
      responses:
        '200':
          description: The product is a draft; the values apply at once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '202':
          $ref: '#/components/responses/ChangeAccepted'
        '400':
          description: >-
            Invalid values, or the product is active and the request has no `reason` or
            `riskLevel`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Another change request for the product is still in review
            (request-already-in-review, PLC-006), or the product is discontinued
            (specifications-frozen, PLC-010).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /products/{productId}/lifecycle-transitions:
    post:
      operationId: setProductLifecycleState
      summary: Request a lifecycle transition for Governance review
      description: >-
        The transition is a change request. Catalog Governance opens an approval case for it, and
        the product keeps its state until Governance releases the change. A released activation
        takes effect through publishProduct, a released discontinuation through
        discontinueProduct.
      tags: [ProductLifecycle]
      parameters:
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleTransitionRequest'
      responses:
        '202':
          description: Change request accepted; the approval case is pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleChangeAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /products/{productId}:
    patch:
      operationId: updateProductAttributes
      summary: Update non-spec product attributes
      description: >-
        On a draft or a discontinued product the values apply at once (200; PLC-010, CJ D4a). On
        an active product every change goes through Catalog Governance review (CJ D3b, drone-web
        D-041): the request becomes a details change request with the new name and short
        description (a value not in the patch keeps its current value), Governance opens an
        approval case for it, and the operation answers 202 Accepted. The `Location` header and
        the `approvalCase` link point to that approval case; the client reads it (getApprovalCase)
        until its status is `released`, `rejected` or `expired`. The product keeps its details
        until the release, and only the values of the request take effect (PLC-009, PLC-012,
        drone-web D-039).
      tags: [ProductLifecycle]
      parameters:
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductAttributesPatch'
      responses:
        '200':
          description: The product is a draft or discontinued; the values apply at once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '202':
          $ref: '#/components/responses/ChangeAccepted'
        '400':
          description: >-
            Invalid values, or the product is active and the request has no `reason` or
            `riskLevel`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Another change request for the product is still in review
            (request-already-in-review, PLC-006).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /products/{productId}/publications:
    post:
      operationId: publishProduct
      summary: Apply a released activation
      description: >-
        The effect of a setProductLifecycleState request for `active`, after Catalog Governance
        released it: the product becomes active and the product-records stream carries it to the
        shop (PublishProduct in the JS1 event model, CJ D6a). Answers 409 when no released
        activation waits for the product (not-cleared-for-release, PLC-007). One release allows
        one activation.
      tags: [ProductLifecycle]
      parameters:
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '201':
          description: Product active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleTransitionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /products/{productId}/discontinuations:
    post:
      operationId: discontinueProduct
      summary: Apply a released discontinuation
      description: >-
        The effect of a setProductLifecycleState request for `discontinued`, after Catalog
        Governance released it. Answers 409 when no released discontinuation waits for the product.
      tags: [ProductLifecycle]
      parameters:
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '201':
          description: Product discontinued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleTransitionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /products/{productId}/replacement:
    put:
      operationId: linkReplacementProduct
      summary: Set replacement product
      tags: [ProductLifecycle]
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replacementProductId, reasonCode]
              properties:
                replacementProductId:
                  type: string
                  format: uuid
                reasonCode:
                  type: string
      responses:
        '200':
          description: Replacement linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductReplacementLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            product-lifecycle:write: Manage product lifecycle resources
  parameters:
    productId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ifMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
  responses:
    BadRequest:
      description: Invalid request payload or filters
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Business rule conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionFailed:
      description: If-Match does not match current version
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ChangeAccepted:
      description: >-
        The product is active, so the change is a change request in Catalog Governance review
        (drone-web D-041). The product is unchanged. Read the approval case at `Location` to learn
        the outcome.
      headers:
        Location:
          description: >-
            The approval case of the change request in the Catalog Governance API
            (getApprovalCase). The client reads it until its status is `released`, `rejected` or
            `expired`.
          required: true
          schema:
            type: string
            format: uri
            example: https://api.example.com/catalog-governance/v1/approval-cases/03724352-c0cd-4fa7-ac65-bddf8df0474d
        Retry-After:
          description: >-
            Optional. Seconds the client waits before it reads the approval case for the first
            time. The server may send it when it can estimate the review time, for example for a
            low-risk change that the review agent decides.
          schema:
            type: integer
            minimum: 1
            example: 30
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductChangeAccepted'
  schemas:
    Product:
      type: object
      required: [productId, sku, name, lifecycleState]
      properties:
        productId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        brand: { type: string }
        lifecycleState: { type: string }
        updatedDate: { type: string, format: date-time }
    ProductSearchResult:
      type: object
      required: [totalResults, products, offset, limit]
      properties:
        totalResults: { type: integer }
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        offset: { type: integer }
        limit: { type: integer }
    CreateProductRequest:
      type: object
      required: [sku, name, brand]
      properties:
        sku: { type: string }
        name: { type: string }
        brand: { type: string }
        baselineSpecifications:
          type: object
          additionalProperties: true
    SpecificationPatch:
      type: object
      description: >-
        Partial specification attributes. On an active product the request also carries `reason`
        and `riskLevel`, because it becomes a change request (drone-web D-041).
      properties:
        reason:
          type: string
          description: Why the change is asked for. Required on an active product.
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
      additionalProperties: true
    ProductAttributesPatch:
      type: object
      description: >-
        Partial product attribute update. On an active product the request also carries `reason`
        and `riskLevel`, because it becomes a change request (drone-web D-041).
      properties:
        reason:
          type: string
          description: Why the change is asked for. Required on an active product.
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
      additionalProperties: true
    RiskLevel:
      type: string
      enum: [low, medium, high, critical]
      description: >-
        The risk level the manager sees. Required on an active product. Catalog Governance may
        raise it to its policy level, never lower it.
    ProductChangeAccepted:
      type: object
      description: >-
        The status of a change request on an active product. The values apply only after the
        release, and only these values (PLC-012).
      required: [approvalCaseId, changeType, status, requestedChange, product, links]
      properties:
        approvalCaseId:
          type: string
          format: uuid
        changeType:
          type: string
          enum: [specification-change, details-change]
        status:
          type: string
          enum: [pending]
          description: The approval case status when the request was accepted.
        requestedChange:
          type: string
          description: The text the reviewer reads, made from the typed new values.
          example: maxCurrent 41.5 A to 38.0 A
        product:
          $ref: '#/components/schemas/Product'
        links:
          type: object
          required: [approvalCase]
          properties:
            approvalCase:
              $ref: '#/components/schemas/Link'
            product:
              $ref: '#/components/schemas/Link'
    Link:
      type: object
      required: [href]
      properties:
        href:
          type: string
          format: uri
        method:
          type: string
          example: GET
    LifecycleTransitionRequest:
      type: object
      required: [targetState, reason]
      properties:
        targetState:
          type: string
          enum: [active, discontinued]
          description: >-
            The typed value of the lifecycle change. The approval case shows it as the text the
            reviewer reads, and only this state is applied after the release (PLC-012).
        reason: { type: string }
    LifecycleChangeAccepted:
      type: object
      required: [approvalCaseId, status, product]
      properties:
        approvalCaseId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]
        product:
          $ref: '#/components/schemas/Product'
    LifecycleTransitionResult:
      type: object
      required: [transitionId, product]
      properties:
        transitionId:
          type: string
          format: uuid
        product:
          $ref: '#/components/schemas/Product'
    ProductReplacementLink:
      type: object
      required: [productId, replacementProductId, reasonCode]
      properties:
        productId: { type: string, format: uuid }
        replacementProductId: { type: string, format: uuid }
        reasonCode: { type: string }
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
