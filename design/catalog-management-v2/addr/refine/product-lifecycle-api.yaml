openapi: 3.1.0
info:
  title: Product Lifecycle API
  description: Write-side product master and lifecycle state management.
  version: 1.0.0
  contact:
    name: Drone Web API Team
  license:
    name: Proprietary
    url: https://example.com/terms
servers:
  - url: https://api.example.com/product-lifecycle/v1
    description: Production
security:
  - apiKey: []
  - oauth2: []
tags:
  - name: ProductLifecycle
    description: Product creation, updates, and lifecycle transitions
paths:
  /products:
    get:
      operationId: searchProductsForManagement
      summary: Query products for management workflows
      tags: [ProductLifecycle]
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: lifecycleState
          in: query
          schema: { type: string, enum: [draft, active, retired, discontinued] }
        - name: brand
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - name: sort
          in: query
          schema: { type: string, example: updatedDate }
      responses:
        '200':
          description: Paged product results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createProduct
      summary: Create product master record
      tags: [ProductLifecycle]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /products/{productId}/specifications:
    patch:
      operationId: updateProductSpecifications
      summary: Update technical specifications
      description: >-
        On a draft the values apply at once. On an active product they apply only after Catalog
        Governance released a specification change for it, and only with the values of that
        released request (PLC-012, drone-web D-039). The status code on an active product (200 or
        202) is still open.
      tags: [ProductLifecycle]
      parameters:
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecificationPatch'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The product is active and no released change of this kind waits for it
            (change-not-released), or the values differ from the new values in the released
            request (values-differ-from-the-approved-ones).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /products/{productId}/lifecycle-transitions:
    post:
      operationId: setProductLifecycleState
      summary: Request a lifecycle transition for Governance review
      description: >-
        The transition is a change request. Catalog Governance opens an approval case for it, and
        the product keeps its state until Governance releases the change. A released
        discontinuation takes effect through discontinueProduct.
      tags: [ProductLifecycle]
      parameters:
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleTransitionRequest'
      responses:
        '202':
          description: Change request accepted; the approval case is pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleChangeAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /products/{productId}:
    patch:
      operationId: updateProductAttributes
      summary: Update non-spec product attributes
      description: >-
        On a draft the values apply at once. On an active product a change of name or short
        description applies only after Catalog Governance released a details change for it, and
        only with the values of that released request (PLC-012, drone-web D-039). The status code on
        an active product (200 or 202) is still open.
      tags: [ProductLifecycle]
      parameters:
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductAttributesPatch'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The product is active and no released change of this kind waits for it
            (change-not-released), or the values differ from the new values in the released
            request (values-differ-from-the-approved-ones).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /products/{productId}/discontinuations:
    post:
      operationId: discontinueProduct
      summary: Apply a released discontinuation
      description: >-
        The effect of a setProductLifecycleState request for `discontinued`, after Catalog
        Governance released it. Answers 409 when no released discontinuation waits for the product.
      tags: [ProductLifecycle]
      parameters:
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '201':
          description: Product discontinued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleTransitionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /products/{productId}/replacement:
    put:
      operationId: linkReplacementProduct
      summary: Set replacement product
      tags: [ProductLifecycle]
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replacementProductId, reasonCode]
              properties:
                replacementProductId:
                  type: string
                  format: uuid
                reasonCode:
                  type: string
      responses:
        '200':
          description: Replacement linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductReplacementLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            product-lifecycle:write: Manage product lifecycle resources
  parameters:
    productId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ifMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
  responses:
    BadRequest:
      description: Invalid request payload or filters
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Business rule conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionFailed:
      description: If-Match does not match current version
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    Product:
      type: object
      required: [productId, sku, name, lifecycleState]
      properties:
        productId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        brand: { type: string }
        lifecycleState: { type: string }
        updatedDate: { type: string, format: date-time }
    ProductSearchResult:
      type: object
      required: [totalResults, products, offset, limit]
      properties:
        totalResults: { type: integer }
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        offset: { type: integer }
        limit: { type: integer }
    CreateProductRequest:
      type: object
      required: [sku, name, brand]
      properties:
        sku: { type: string }
        name: { type: string }
        brand: { type: string }
        baselineSpecifications:
          type: object
          additionalProperties: true
    SpecificationPatch:
      type: object
      description: Partial specification attributes
      additionalProperties: true
    ProductAttributesPatch:
      type: object
      description: Partial product attribute update
      additionalProperties: true
    LifecycleTransitionRequest:
      type: object
      required: [targetState, reason]
      properties:
        targetState:
          type: string
          enum: [active, discontinued]
          description: >-
            The typed value of the lifecycle change. The approval case shows it as the text the
            reviewer reads, and only this state is applied after the release (PLC-012).
        reason: { type: string }
    LifecycleChangeAccepted:
      type: object
      required: [approvalCaseId, status, product]
      properties:
        approvalCaseId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]
        product:
          $ref: '#/components/schemas/Product'
    LifecycleTransitionResult:
      type: object
      required: [transitionId, product]
      properties:
        transitionId:
          type: string
          format: uuid
        product:
          $ref: '#/components/schemas/Product'
    ProductReplacementLink:
      type: object
      required: [productId, replacementProductId, reasonCode]
      properties:
        productId: { type: string, format: uuid }
        replacementProductId: { type: string, format: uuid }
        reasonCode: { type: string }
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
