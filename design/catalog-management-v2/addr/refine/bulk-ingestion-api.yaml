openapi: 3.1.0
info:
  title: Bulk Ingestion API
  description: Asynchronous bulk import submission, results, and replay.
  version: 1.0.0
  contact: { name: Drone Web API Team }
  license: { name: Proprietary, url: https://droneparts.com/terms }
servers:
  - url: https://api.droneparts.com/bulk-ingestion/v1
security:
  - apiKey: []
  - oauth2: []
tags:
  - name: BulkIngestion
    description: Bulk import submission, status, and replay operations
paths:
  /import-batches:
    post:
      summary: Submit import batch
      operationId: submitImportBatch
      tags: [BulkIngestion]
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportBatchSubmission' }
      responses:
        '202':
          description: Batch queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /import-batches/{importBatchId}/results:
    get:
      summary: Retrieve import batch results
      operationId: getImportBatchResults
      tags: [BulkIngestion]
      parameters:
        - $ref: '#/components/parameters/importBatchId'
        - name: processingStatus
          in: query
          schema: { type: string, enum: [queued, processing, completed, failed] }
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Batch processing results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatchResults' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /import-batches/{importBatchId}/replay-requests:
    post:
      summary: Replay failed batch items
      operationId: replayFailedImportItems
      tags: [BulkIngestion]
      parameters:
        - $ref: '#/components/parameters/importBatchId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemKeys]
              properties:
                itemKeys:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        '202':
          description: Replay queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportReplayRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-API-Key }
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.droneparts.com/oauth/token
          scopes: { bulk-ingestion:write: Submit and replay import batches }
  parameters:
    importBatchId: { name: importBatchId, in: path, required: true, schema: { type: string, format: uuid } }
    idempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8 } }
    offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    BadRequest:
      description: Invalid request payload
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    NotFound:
      description: Resource not found
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Conflict:
      description: Business rule conflict
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    UnprocessableEntity:
      description: Semantically invalid request
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  schemas:
    ImportBatchSubmission:
      type: object
      required: [sourceSystem, submittedFileReference, submissionChecksum, totalItems]
      properties:
        sourceSystem: { type: string }
        submittedFileReference: { type: string }
        submissionChecksum: { type: string }
        totalItems: { type: integer, minimum: 1 }
    ImportBatch:
      type: object
      required: [importBatchId, status]
      properties:
        importBatchId: { type: string, format: uuid }
        status: { type: string, enum: [queued, processing, completed, failed] }
        totalItems: { type: integer }
    ImportItemResult:
      type: object
      required: [itemKey, status]
      properties:
        itemKey: { type: string }
        status: { type: string, enum: [succeeded, failed, skipped] }
        detail: { type: string }
    ImportBatchResults:
      type: object
      required: [importBatch, itemResults, offset, limit]
      properties:
        importBatch: { $ref: '#/components/schemas/ImportBatch' }
        itemResults:
          type: array
          items: { $ref: '#/components/schemas/ImportItemResult' }
        offset: { type: integer }
        limit: { type: integer }
    ImportReplayRequest:
      type: object
      required: [replayRequestId, importBatchId, status]
      properties:
        replayRequestId: { type: string, format: uuid }
        importBatchId: { type: string, format: uuid }
        status: { type: string, enum: [queued, processing, completed, failed] }
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
