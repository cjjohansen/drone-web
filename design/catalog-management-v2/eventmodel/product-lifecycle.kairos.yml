              example: draft
            review:
              type: string
              source: generated
              description: >-
                Where the latest change request stands: none, in review, cleared, refused or
                expired, with the state asked for (a lifecycle change) or the change type.
              example: "in review: active"
            latestRefusal: { type: string, source: system, from: ProductChangeRefused.rationale, optional: true, description: Why Governance refused the latest refused request. }
