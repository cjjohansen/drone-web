          - event: AgentReviewRequested
            values: { approvalCaseId: $detailsCase }
          - event: ChangeApprovedByAgent
            values: { approvalCaseId: $detailsCase, verdict: approve, findings: New description matches the datasheet; no claim about compatibility changed, assessedAt: 2026-12-01T09:31:00Z }
