            keyed: { productId: $velox }
            rows:
              - { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, brand: T-Motor, draftedAt: 2026-11-02T09:10:00Z, name: T-Motor Velox V2306 V2 1750KV, shortDescription: 2306 motor for 6S 5-inch freestyle builds, minVoltage: 11.1, maxVoltage: 25.2, maxCurrent: 38.0, mounting: 16x16-m3, weight: 33.6, lifecycleState: discontinued, review: none, latestRefusal: null, publishedAt: 2026-11-03T08:00:00Z, discontinuedReason: Replaced by the V3 1950KV, discontinuedAt: 2027-06-30T16:00:00Z, replacementProductId: $velox3, replacementReasonCode: successor-model }

  # ================================================================== Review

  RequestProductChange:
    pattern: command
    chapter: Review
    description: >-
      The manager asks for a change to a product, with a reason and the risk level they see: a
      lifecycle change (go live, or retire), or a change of the specifications or details of an
      active product (CJ D3b). A specification or details change carries its new values as typed
      fields; Product Data writes from them the requestedChange that the reviewer reads, and later
      lets the manager apply only those values (PLC-012, drone-web D-039). Product Data checks the
      product rules and publishes the request to Catalog Governance. ADDR: JS1 "Set initial
      lifecycle state" and "Mark product as discontinued"; setProductLifecycleState(targetState,
      reason), which answers 202 Accepted with the approval case (CJ D7a); the approval case of
      submitApprovalCase(). Asking Product Data rather than Governance is proposed (see the header).
    screen:
      name: ProductChangeForm
      actor: ProductLifecycleManager
      fields:
        productId: { type: uuid, source: user, description: Set by the ProductDetailPage the task starts from; else picked from the products under management., example: 6a1f3c2e-4b5d-4e8f-9a0b-1c2d3e4f5a61 }
        changeType: { type: string, source: user, description: "lifecycle-change, specification-change or details-change.", example: lifecycle-change }
        targetState: { type: string, source: user, optional: true, description: "For a lifecycle change: active or discontinued.", example: active }
        newMinVoltage: { type: decimal, source: user, optional: true, description: "For a specification change: the form starts with the recorded values, and the manager edits the ones that change.", example: 11.1 }
        newMaxVoltage: { type: decimal, source: user, optional: true, example: 25.2 }
        newMaxCurrent: { type: decimal, source: user, optional: true, example: 38.0 }
        newMounting: { type: string, source: user, optional: true, example: 16x16-m3 }
        newWeight: { type: decimal, source: user, optional: true, example: 33.6 }
        newName: { type: string, source: user, optional: true, description: "For a details change: the form starts with the current details.", example: T-Motor Velox V2306 V2 1750KV }
        newShortDescription: { type: string, source: user, optional: true, example: 2306 motor for 6S 5-inch freestyle builds }
        reason: { type: string, source: user, example: Launch with the 5-inch freestyle range }
        riskLevel: { type: string, source: user, description: "low, medium, high or critical. Governance may raise it to its policy level, never lower it.", example: medium }
        requestedBy: { type: string, source: user, description: "The signed-in manager; the manager does not type it.", example: Nora Lund }
    command:
      name: RequestProductChange
      fields:
        productId:
          type: uuid
          source: system
          from: screen.productId
          lookup: { view: ProductsUnderManagement, value: productId, label: name }
        changeType: { type: string, source: system, from: screen.changeType }
        targetState: { type: string, source: system, from: screen.targetState, optional: true }
        newMinVoltage: { type: decimal, source: system, from: screen.newMinVoltage, optional: true }
        newMaxVoltage: { type: decimal, source: system, from: screen.newMaxVoltage, optional: true }
        newMaxCurrent: { type: decimal, source: system, from: screen.newMaxCurrent, optional: true }
        newMounting: { type: string, source: system, from: screen.newMounting, optional: true }
        newWeight: { type: decimal, source: system, from: screen.newWeight, optional: true }
        newName: { type: string, source: system, from: screen.newName, optional: true }
        newShortDescription: { type: string, source: system, from: screen.newShortDescription, optional: true }
        reason: { type: string, source: system, from: screen.reason }
        riskLevel: { type: string, source: system, from: screen.riskLevel }
        requestedBy: { type: string, source: system, from: screen.requestedBy }
    emits:
      - event: ProductChangeRequested
    rules:
      PLC-003:
        title: A product goes live only with its identity and specifications recorded
        description: >-
          define/boundaries.md, Product Lifecycle invariant 1 ("required identity and baseline
          attributes before activation"). Checking it when the change is asked for, so a reviewer
          never sees an incomplete draft, is our choice.
      PLC-004:
        title: A product moves only from draft to active and from active to discontinued
        description: >-
          define/boundaries.md says transitions "follow an allowed state machine" but does not list
          them. These two moves are the ones the JS1 steps and the sequence diagram use.
        status: proposed
      PLC-005:
        title: A discontinued product does not return to active
        description: >-
          define/boundaries.md, Product Lifecycle invariant 3. CJ D9a (2026-10-29): there is no
          reactivation; to sell the product again, the manager drafts a new product.
      PLC-006:
        title: A product has at most one change request in review
        description: A request is open until it is refused, expires, or is applied.
        status: proposed
      PLC-012:
        title: A specification or details change carries its new values, and only those values are applied
        description: >-
          CJ 2026-10-29, drone-web D-039. A specification change carries all five specification
          values and a details change the name and the short description, as they are to be after
          the change. The reviewer approves the requestedChange made from those values, so the
          applied values equal the approved ones (RecordSpecifications, ReviseProductDetails).
    errors:
      ProductUnknown: { description: No product was drafted under this id. }
      SpecificationsMissing: { description: The product has no specifications yet., rule: PLC-003 }
      TransitionNotAllowed: { description: The product cannot move from its state to the state asked for., rule: PLC-004 }
      ReactivationNotAllowed: { description: The product is discontinued; draft a new product instead., rule: PLC-005 }
      RequestAlreadyInReview: { description: Another change request for this product is still open., rule: PLC-006 }
      NewValuesMissing: { description: "A specification or details change does not give all its new values.", rule: PLC-012 }
      ReviewNotNeeded: { description: "The product is a draft, or discontinued and only its details change: the manager changes it without review.", rule: PLC-009 }
      SpecificationsFrozen: { description: The product is discontinued., rule: PLC-010 }
    tests:
      AsksToPublishTheVeloxMotor:
        rules: [PLC-003, PLC-004]
        given:
          - event: ProductDrafted
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox }
        when:
          values: { productId: $velox, changeType: lifecycle-change, targetState: active, reason: Launch with the 5-inch freestyle range, riskLevel: medium, requestedBy: Nora Lund }
        then:
          - event: ProductChangeRequested
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, changeType: lifecycle-change, targetState: active, requestedChange: active, reason: Launch with the 5-inch freestyle range, riskLevel: medium, requestedBy: Nora Lund }
      AsksToCorrectTheCurrentOfTheActiveVelox:
        rules: [PLC-009, PLC-012]
        given:
          - event: ProductDrafted
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox, minVoltage: 11.1, maxVoltage: 25.2, maxCurrent: 41.5, mounting: 16x16-m3, weight: 33.6 }
          - event: ProductPublished
            values: { productId: $velox }
        when:
          values: { productId: $velox, changeType: specification-change, newMinVoltage: 11.1, newMaxVoltage: 25.2, newMaxCurrent: 38.0, newMounting: 16x16-m3, newWeight: 33.6, reason: Supplier corrected the datasheet (rev C), riskLevel: low, requestedBy: Nora Lund }
        then:
          - event: ProductChangeRequested
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, changeType: specification-change, targetState: null, newMinVoltage: 11.1, newMaxVoltage: 25.2, newMaxCurrent: 38.0, newMounting: 16x16-m3, newWeight: 33.6, newName: null, newShortDescription: null, requestedChange: "maxCurrent 41.5 A to 38.0 A", riskLevel: low }
      AsksToRenameTheActiveVelox:
        rules: [PLC-009, PLC-012]
        given:
          - event: ProductDrafted
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, name: T-Motor Velox V2306 1750KV }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox }
          - event: ProductPublished
            values: { productId: $velox }
        when:
          values: { productId: $velox, changeType: details-change, newName: T-Motor Velox V2306 V2 1750KV, newShortDescription: 2306 motor for 6S 5-inch freestyle builds, reason: Supplier renamed the motor, riskLevel: low, requestedBy: Nora Lund }
        then:
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: details-change, newName: T-Motor Velox V2306 V2 1750KV, newShortDescription: 2306 motor for 6S 5-inch freestyle builds, newMaxCurrent: null, requestedChange: "Name T-Motor Velox V2306 1750KV to T-Motor Velox V2306 V2 1750KV; short description (none) to 2306 motor for 6S 5-inch freestyle builds" }
      AsksToDiscontinueTheActiveVelox:
        rules: [PLC-004, PLC-006]
        given:
          - event: ProductDrafted
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox }
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: active, requestedChange: active }
          - event: ProductPublished
            values: { productId: $velox }
        when:
          values: { productId: $velox, changeType: lifecycle-change, targetState: discontinued, reason: Replaced by the V3 1950KV, riskLevel: high, requestedBy: Nora Lund }
        then:
          - event: ProductChangeRequested
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, changeType: lifecycle-change, targetState: discontinued, requestedChange: discontinued, reason: Replaced by the V3 1950KV, riskLevel: high }
      AsksAgainAfterARefusal:
        rules: [PLC-006]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox, maxCurrent: 38.0 }
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: active, requestedChange: active }
          - event: ProductChangeRefused
            values: { productId: $velox, changeType: lifecycle-change, requestedChange: active }
        when:
          values: { productId: $velox, changeType: lifecycle-change, targetState: active, reason: Maximum current now on the datasheet, riskLevel: medium, requestedBy: Nora Lund }
        then:
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: active, requestedChange: active }
      AsksAgainAfterTheCaseExpired:
        rules: [PLC-006]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox }
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: active, requestedChange: active }
          - event: ProductChangeExpired
            values: { productId: $velox, changeType: lifecycle-change, requestedChange: active }
        when:
          values: { productId: $velox, changeType: lifecycle-change, targetState: active, reason: Launch with the 5-inch freestyle range, riskLevel: medium, requestedBy: Nora Lund }
        then:
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: active, requestedChange: active }
      RejectsADraftWithoutSpecifications:
        rules: [PLC-003]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
        when:
          values: { productId: $velox, changeType: lifecycle-change, targetState: active }
        then:
          - error: SpecificationsMissing
      RejectsDiscontinuingADraft:
        rules: [PLC-004]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox }
        when:
          values: { productId: $velox, changeType: lifecycle-change, targetState: discontinued }
        then:
          - error: TransitionNotAllowed
      RejectsPublishingAnActiveProductAgain:
        rules: [PLC-004]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox }
          - event: ProductPublished
            values: { productId: $velox }
        when:
          values: { productId: $velox, changeType: lifecycle-change, targetState: active }
        then:
          - error: TransitionNotAllowed
      RejectsReactivatingADiscontinuedProduct:
        rules: [PLC-005]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox }
          - event: ProductPublished
            values: { productId: $velox }
          - event: ProductDiscontinued
            values: { productId: $velox }
        when:
          values: { productId: $velox, changeType: lifecycle-change, targetState: active }
        then:
          - error: ReactivationNotAllowed
      RejectsASecondRequestWhileOneIsInReview:
        rules: [PLC-006]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox }
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: active, requestedChange: active }
        when:
          values: { productId: $velox, changeType: lifecycle-change, targetState: active, reason: Please hurry }
        then:
          - error: RequestAlreadyInReview
      RejectsAChangeWithoutItsNewValues:
        rules: [PLC-012]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox }
          - event: ProductPublished
            values: { productId: $velox }
        when:
          values: { productId: $velox, changeType: <type>, newMinVoltage: null, newMaxVoltage: null, newMaxCurrent: <current>, newMounting: null, newWeight: null, newName: <name>, newShortDescription: null, reason: Supplier corrected the datasheet (rev C) }
        then:
          - error: NewValuesMissing
        examples:
          - { type: specification-change, current: 38.0, name: null }
          - { type: details-change, current: null, name: T-Motor Velox V2306 V2 1750KV }
      RejectsAReviewForADraftsDetails:
        rules: [PLC-009]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
        when:
          values: { productId: $velox, changeType: details-change, newName: T-Motor Velox V2306 V2 1750KV, newShortDescription: 2306 motor for 6S 5-inch freestyle builds }
        then:
          - error: ReviewNotNeeded
      RejectsASpecificationChangeOnADiscontinuedProduct:
        rules: [PLC-010]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox }
          - event: ProductPublished
            values: { productId: $velox }
          - event: ProductDiscontinued
            values: { productId: $velox }
        when:
          values: { productId: $velox, changeType: specification-change, newMinVoltage: 11.1, newMaxVoltage: 25.2, newMaxCurrent: 38.0, newMounting: 16x16-m3, newWeight: 33.6 }
        then:
          - error: SpecificationsFrozen
      RejectsARequestForAnUnknownProduct:
        when:
          values: { productId: $nobody, changeType: lifecycle-change, targetState: active }
        then:
          - error: ProductUnknown

  OpenApprovalCase:
    pattern: translation
    chapter: Review
    description: >-
      Catalog Governance opens a pending approval case for each change request. Its policy sets the
      risk level from the change type; the manager may raise it, never lower it. The risk level
      sets who decides (reviewRoute). ADDR: submitApprovalCase(changeType, sourceReferenceId=productId,
      riskLevel, rationale).
    message: ProductData.ChangeForReview
    processor:
      name: ChangeRequestListener
      lane: Integration
    command:
      name: SubmitApprovalCase
      fields:
        sourceReferenceId: { type: uuid, source: system, from: message.productId }
        sourceLabel: { type: string, source: system, from: message.sku }
        changeType: { type: string, source: system, from: message.changeType }
        requestedChange: { type: string, source: system, from: message.requestedChange }
        rationale: { type: string, source: system, from: message.reason }
        requestedRiskLevel: { type: string, source: system, from: message.riskLevel }
        requestedBy: { type: string, source: system, from: message.requestedBy }
    emits:
      - event: ApprovalCaseSubmitted
    rules:
      GOV-004:
        title: The Governance policy sets the lowest risk level of a case; the requester cannot lower it
        description: >-
          CJ D2a (2026-10-29). The case gets the policy level for its change type, or the level the
          requester asked for when that is higher.
      GOV-005:
        title: "The policy levels: details-change low, specification-change medium, lifecycle-change high"
        description: >-
          The exact table is our proposal. A specification change is medium because the
          compatibility rules read the specifications (the Core spec model, drone-web D-037). No
          change type in this flow is critical.
        status: proposed
    tests:
      OpensACaseToPublishTheVelox:
        rules: [GOV-004, GOV-005]
        when:
          values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, changeType: lifecycle-change, requestedChange: active, reason: Launch with the 5-inch freestyle range, riskLevel: medium, requestedBy: Nora Lund }
        then:
          - event: ApprovalCaseSubmitted
            values: { changeType: lifecycle-change, sourceReferenceId: $velox, sourceLabel: TMOTOR-VELOX-V2306-1750KV, requestedChange: active, rationale: Launch with the 5-inch freestyle range, requestedRiskLevel: medium, riskLevel: high, reviewRoute: person, requestedBy: Nora Lund }
      SetsTheRiskFromThePolicy:
        rules: [GOV-004, GOV-005]
        when:
          values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, changeType: <type>, requestedChange: <change>, reason: Keep the catalog right, riskLevel: <asked>, requestedBy: Nora Lund }
        then:
          - event: ApprovalCaseSubmitted
            values: { changeType: <type>, sourceReferenceId: $velox, requestedRiskLevel: <asked>, riskLevel: <level>, reviewRoute: <route> }
        examples:
          - { type: details-change, change: "Short description: 6S 5-inch freestyle", asked: low, level: low, route: agent }
          - { type: specification-change, change: "maxCurrent 41.5 A to 38.0 A", asked: low, level: medium, route: agent-then-person }
          - { type: lifecycle-change, change: discontinued, asked: low, level: high, route: person }
          - { type: details-change, change: "Name: add V2", asked: high, level: high, route: person }
          - { type: specification-change, change: "Mounting 16x16-m3 to 19x19-m3", asked: critical, level: critical, route: person }
      OpensANewCaseAfterARejection:
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $firstCase, sourceReferenceId: $velox, requestedChange: active }
          - event: ApprovalCaseRejected
            values: { approvalCaseId: $firstCase, sourceReferenceId: $velox, requestedChange: active }
        when:
          values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, changeType: lifecycle-change, requestedChange: active, reason: Maximum current now on the datasheet, riskLevel: medium, requestedBy: Nora Lund }
        then:
          - event: ApprovalCaseSubmitted
            values: { sourceReferenceId: $velox, requestedChange: active, rationale: Maximum current now on the datasheet }
      IgnoresARequestItAlreadyOpened:
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $firstCase, sourceReferenceId: $velox, changeType: lifecycle-change, requestedChange: active }
        when:
          values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, changeType: lifecycle-change, requestedChange: active, reason: Launch with the 5-inch freestyle range, riskLevel: medium, requestedBy: Nora Lund }
        then: []

  ReviewApprovalCases:
    pattern: query
    chapter: Review
    description: >-
      The reviewer's list of approval cases: the product (by SKU), the change asked for, the risk
      and who decides it, the rationale, the requester, the reviewer, the agent's check and the
      status. ADDR: Catalog Governance API ("expose case status"); ApprovalCase resource.
    screen:
      name: ApprovalCaseList
      actor: GovernanceReviewer
    views:
      - list-view:
          name: ApprovalCases
          identity: approvalCaseId
          reads:
            ApprovalCaseSubmitted: create
            AgentReviewRequested: update
            ChangeApprovedByAgent: update
            ChangeRecommendedByAgent: update
            ChangeEscalatedByAgent: update
            ReviewerAssigned: update
            ApprovalCaseApproved: update
            ApprovalCaseRejected: update
            ApprovalCaseExpired: update
            PublicationGateReleased: update
          fields:
            approvalCaseId: { type: uuid, source: system, from: ApprovalCaseSubmitted.approvalCaseId, example: 03724352-c0cd-4fa7-ac65-bddf8df0474d }
            changeType: { type: string, source: system, from: ApprovalCaseSubmitted.changeType }
            sourceLabel: { type: string, source: system, from: ApprovalCaseSubmitted.sourceLabel }
            requestedChange: { type: string, source: system, from: ApprovalCaseSubmitted.requestedChange }
            riskLevel: { type: string, source: system, from: ApprovalCaseSubmitted.riskLevel }
            reviewRoute: { type: string, source: system, from: ApprovalCaseSubmitted.reviewRoute }
            rationale: { type: string, source: system, from: ApprovalCaseSubmitted.rationale }
            requestedBy: { type: string, source: system, from: ApprovalCaseSubmitted.requestedBy }
            reviewer: { type: string, source: system, from: ReviewerAssigned.reviewer, optional: true }
            agentCheck:
              type: string
              source: generated
              description: "none, sent, approved, recommended or escalated: how far the review agent has come."
              example: none
            status:
              type: string
              source: generated
              description: "pending, approved, rejected, released or expired."
              example: pending
    tests:
      ShowsEachCaseWithItsRouteAndStatus:
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, changeType: lifecycle-change, sourceLabel: TMOTOR-VELOX-V2306-1750KV, requestedChange: active, riskLevel: high, reviewRoute: person, rationale: Launch with the 5-inch freestyle range, requestedBy: Nora Lund }
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $specCase, changeType: specification-change, sourceLabel: SPEEDYBEE-F405-V4, requestedChange: "Weight 9.5 g to 10.2 g", riskLevel: medium, reviewRoute: agent-then-person, rationale: Weighed with the connectors, requestedBy: Nora Lund }
          - event: AgentReviewRequested
            values: { approvalCaseId: $specCase }
          - event: ChangeRecommendedByAgent
            values: { approvalCaseId: $specCase, verdict: approve }
          - event: ReviewerAssigned
            values: { approvalCaseId: $launchCase, reviewer: Lena Holm }
          - event: ApprovalCaseApproved
            values: { approvalCaseId: $launchCase, decidedBy: Lena Holm }
        then:
          - view: ApprovalCases
            rows:
              - { approvalCaseId: $launchCase, changeType: lifecycle-change, sourceLabel: TMOTOR-VELOX-V2306-1750KV, requestedChange: active, riskLevel: high, reviewRoute: person, rationale: Launch with the 5-inch freestyle range, requestedBy: Nora Lund, reviewer: Lena Holm, agentCheck: none, status: approved }
              - { approvalCaseId: $specCase, changeType: specification-change, sourceLabel: SPEEDYBEE-F405-V4, requestedChange: "Weight 9.5 g to 10.2 g", riskLevel: medium, reviewRoute: agent-then-person, rationale: Weighed with the connectors, requestedBy: Nora Lund, reviewer: null, agentCheck: recommended, status: pending }
      ShowsReleasedRejectedAndExpiredCases:
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $detailsCase, changeType: details-change, sourceLabel: TMOTOR-VELOX-V2306-1750KV, requestedChange: "Short description: 6S 5-inch freestyle", riskLevel: low, reviewRoute: agent, rationale: Clearer for buyers, requestedBy: Nora Lund }
          - event: AgentReviewRequested
            values: { approvalCaseId: $detailsCase }
          - event: ChangeApprovedByAgent
            values: { approvalCaseId: $detailsCase, verdict: approve }
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $retireCase, changeType: lifecycle-change, sourceLabel: TMOTOR-VELOX-V2306-1750KV, requestedChange: discontinued, riskLevel: high, reviewRoute: person, rationale: Replaced by the V3 1950KV, requestedBy: Nora Lund }
          - event: ApprovalCaseRejected
            values: { approvalCaseId: $retireCase, rationale: Successor not yet in stock }
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $f405Case, changeType: lifecycle-change, sourceLabel: SPEEDYBEE-F405-V4, requestedChange: active, riskLevel: high, reviewRoute: person, rationale: New flight controller for the 5-inch kits, requestedBy: Nora Lund }
          - event: ApprovalCaseExpired
            values: { approvalCaseId: $f405Case }
        then:
          - view: ApprovalCases
            rows:
              - { approvalCaseId: $detailsCase, changeType: details-change, sourceLabel: TMOTOR-VELOX-V2306-1750KV, requestedChange: "Short description: 6S 5-inch freestyle", riskLevel: low, reviewRoute: agent, rationale: Clearer for buyers, requestedBy: Nora Lund, reviewer: null, agentCheck: approved, status: released }
              - { approvalCaseId: $retireCase, changeType: lifecycle-change, sourceLabel: TMOTOR-VELOX-V2306-1750KV, requestedChange: discontinued, riskLevel: high, reviewRoute: person, rationale: Replaced by the V3 1950KV, requestedBy: Nora Lund, reviewer: null, agentCheck: none, status: rejected }
              - { approvalCaseId: $f405Case, changeType: lifecycle-change, sourceLabel: SPEEDYBEE-F405-V4, requestedChange: active, riskLevel: high, reviewRoute: person, rationale: New flight controller for the 5-inch kits, requestedBy: Nora Lund, reviewer: null, agentCheck: none, status: expired }

  ShowApprovalCaseDetails:
    pattern: query
    chapter: Review
    description: >-
      The reviewer picks a case from the ApprovalCaseList and sees all of it on one page: the
      product and the change asked for, the risk and its route, the requester, the agent's
      findings, the reviewer, the decision and the publication gate. The gate is not an entity of
      its own here: each approval case has one gate, and the gate events carry only the
      approvalCaseId, so the gate shows as the `gate` field of its case. The page is the case's
      task menu. Its tasks are AssignReviewerForm (AssignReviewer), ApproveForm (ApproveChange),
      RejectForm (RejectChange) and ReleaseForm (ReleaseChange). Each task starts with the page's
      approvalCaseId. No field on the page is edited directly (drone-web D-038).
      ADDR: Catalog Governance API ("expose case status"), ApprovalCase and PublicationGate resources; design/api-design.md has no operation that reads one case (proposed).
    screen:
      name: ApprovalCaseDetailPage
      actor: GovernanceReviewer
    views:
      - single-view:
          name: ApprovalCaseDetails
          keyed-by: ApprovalCases.approvalCaseId
          identity: approvalCaseId
          reads:
            ApprovalCaseSubmitted: create
            AgentReviewRequested: update
            ChangeApprovedByAgent: update
            ChangeRecommendedByAgent: update
            ChangeEscalatedByAgent: update
            ReviewerAssigned: update
            ApprovalCaseApproved: update
            ApprovalCaseRejected: update
            ApprovalCaseExpired: update
            PublicationGateReleased: update
            ReviewersToldOfAgentApproval: update
          fields:
            approvalCaseId: { type: uuid, source: system, from: ApprovalCaseSubmitted.approvalCaseId, example: 03724352-c0cd-4fa7-ac65-bddf8df0474d }
            changeType: { type: string, source: system, from: ApprovalCaseSubmitted.changeType }
            sourceReferenceId: { type: uuid, source: system, from: ApprovalCaseSubmitted.sourceReferenceId }
            sourceLabel: { type: string, source: system, from: ApprovalCaseSubmitted.sourceLabel }
            requestedChange: { type: string, source: system, from: ApprovalCaseSubmitted.requestedChange }
            requestedRiskLevel: { type: string, source: system, from: ApprovalCaseSubmitted.requestedRiskLevel }
            riskLevel: { type: string, source: system, from: ApprovalCaseSubmitted.riskLevel }
            reviewRoute: { type: string, source: system, from: ApprovalCaseSubmitted.reviewRoute }
            rationale: { type: string, source: system, from: ApprovalCaseSubmitted.rationale }
            requestedBy: { type: string, source: system, from: ApprovalCaseSubmitted.requestedBy }
            submittedAt: { type: datetime, source: system, from: ApprovalCaseSubmitted.submittedAt }
            agentCheck:
              type: string
              source: generated
              description: "none, sent, approved, recommended or escalated: how far the review agent has come."
              example: none
            agentFindings:
              type: string
              source: generated
              optional: true
              description: The findings of the agent's approval, recommendation or escalation; null until the agent answers.
              example: New description matches the datasheet; no claim about compatibility changed
            reviewer: { type: string, source: system, from: ReviewerAssigned.reviewer, optional: true }
            assignedAt: { type: datetime, source: system, from: ReviewerAssigned.assignedAt, optional: true }
            status:
              type: string
              source: generated
              description: "pending, approved, rejected, released or expired. An agent approval makes the case released at once (GOV-013)."
              example: pending
            decisionRationale:
              type: string
              source: generated
              optional: true
              description: The rationale of a person's approval or rejection; null while no person decided.
              example: Specifications match the supplier datasheet
            decidedBy:
              type: string
              source: generated
              optional: true
              description: "The reviewer who approved or rejected the case, or review agent for an agent approval; null while the case is undecided."
              example: Lena Holm
            decidedAt:
              type: datetime
              source: generated
              optional: true
              description: When the case was approved or rejected; null while the case is undecided.
              example: 2026-11-02T14:30:00Z
            expiredAt: { type: datetime, source: system, from: ApprovalCaseExpired.expiredAt, optional: true }
            gate:
              type: string
              source: generated
              description: "The publication gate of the case: locked until PublicationGateReleased or an agent approval (GOV-013), then released."
              example: locked
            releasedBy:
              type: string
              source: generated
              optional: true
              description: "The reviewer who released the gate, or review agent when the agent's approval released it; null while the gate is locked."
              example: Lena Holm
            releasedAt:
              type: datetime
              source: generated
              optional: true
              description: "When the gate was released: releasedAt of PublicationGateReleased, or assessedAt of the agent's approval."
              example: 2026-11-02T15:00:00Z
            reviewersToldAt: { type: datetime, source: system, from: ReviewersToldOfAgentApproval.toldAt, optional: true, description: "When the reviewers were told of the agent's approval; null for any other case." }
    tests:
      ShowsThePendingVeloxLaunchWithItsReviewer:
        given:
          - event: ApprovalCaseSubmitted
