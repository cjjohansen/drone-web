# Drone Web catalog management: draft, review, publish, change and retire a product (JS1).
# Written with the kairos-author skill of event-model-factory.
#
# The flow in words (chosen by CJ, 2026-10-28: "JS1 Product Lifecycle"; review rules from CJ's
# answers of 2026-10-29, D1 to D10 in the README):
#
#   A Product Lifecycle Manager drafts a new product with its SKU, name and brand, and records its
#   technical specifications. While the product is a draft, the manager changes it freely. When
#   the draft is complete, the manager asks for the product to go live. Every change to a product
#   that is sold (going live, a new specification, a new name or description, the discontinuation)
#   is a change request that Catalog Governance reviews. A Governance policy sets the risk level
#   of the request from its change type; the manager may ask for a higher level, never a lower one.
#   A low-risk change is approved by a review agent (an LLM). A medium-risk change is checked by
#   the agent and confirmed by a person. A high-risk change is decided by a person. A case gets
#   an assigned reviewer, but any person who holds the reviewer role for the case's risk level may
#   decide it, never the manager who asked (four eyes). A specification or details change carries
#   its new values, and the manager can later apply only those values. A person releases an
#   approved change through its publication gate; an agent approval opens the gate by itself, and
#   the reviewers are told. A case that nobody decides expires after the review period. Product
#   Data learns of the release, the rejection or the expiry; after a release the manager applies
#   the change. To retire the product, the manager asks for its discontinuation, and after the
#   release discontinues it and links the product that replaces it. A discontinued product keeps
#   its specifications; its details may still change.
#
#   CJ's answers of 2026-10-29 to the open questions of PR #26 (typed values, agent release with a
#   notice, deciding by role) are drone-web D-039.
#
# Where the pieces come from (design/catalog-management-v2/addr/):
#
#   - align/job-stories.md JS1 and align/activity-steps.md (the JS1 rows) give the steps.
#   - align/personas.md gives the two actors: Product Lifecycle Manager and Governance Reviewer.
#   - define/api-profiles.md (Product Lifecycle API, Catalog Governance API) gives the operations;
#     each slice description names the operation it comes from.
#   - define/boundaries.md gives the invariants. Rules that cite an invariant or one of CJ's
#     answers are `active`; rules that are our assumption are `status: proposed` and wait for CJ.
#   - define/resources.md gives the fields and the states: lifecycle draft, active, discontinued;
#     approval case pending, approved, rejected, released, expired; gate locked, released.
#   - define/sequence-diagrams.md (JS1) gives the order: create, specify, submit approval case,
#     decide, release gate, set lifecycle state active, discontinue, link replacement.
#   - Decision drone-web D-037 (.ralph/agent/decisions.md in this repo) and
#     design/contracts/product-lifecycle.yaml give the published stream product-records, which the
#     ordering model reads. galaxitech-website D-038 (DECISIONS.md in the galaxitech-website repo)
#     says that approval happens before the owner publishes. The two repos number their decisions
#     separately, so every citation names its repo.
#
# Where this model departs from ADDR on purpose, all marked proposed:
#
#   - The manager asks Product Data for a change, and Product Data publishes the request to
#     Catalog Governance. In the ADDR sequence diagram the manager calls Governance directly.
#     Here the product rules (is the draft complete? is the move allowed?) stay in Product Data,
#     as define/boundaries.md section D asks ("keep strong consistency rules inside aggregate
#     boundaries").
#   - "pending-approval" is not a lifecycle state here. A product under review keeps its state
#     (draft or active) and shows its review separately, because a product under review for
#     discontinuation is still active and still sold.
#
# Left out of this flow: bulk ingestion (JS1 "Submit bulk import", Bulk Ingestion API), which is
# a flow of its own.

kairos: "0"
model: ProductLifecycle
description: A product goes from draft through Governance review to the shop, changes while it is sold only after review, and is discontinued and replaced, again after review.

automations:
  Integration:
    description: Takes in what another context publishes.
  AgentReview:
    description: Sends low- and medium-risk approval cases to the review agent.
  ReviewClock:
    description: Expires approval cases that nobody decided in time.
  Announcer:
    description: Tells the owning context of a release, and the reviewers of an agent approval.

actors:
  ProductLifecycleManager:
    description: Owns product master data and lifecycle transitions (align/personas.md).
  GovernanceReviewer:
    description: Owns approval and publication gates for catalog changes (align/personas.md).

ports:
  ChangeReviewAgent:
    description: >-
      The review agent: a large language model (LLM) with a review prompt. It reads one change
      request and later answers through ReviewAgent.ChangeAssessed. The call is one-way.
    operations:
      AssessChange:
        request:
          approvalCaseId: uuid
          changeType: string
          sourceLabel: string
          requestedChange: string
          rationale: string
          riskLevel: string
  ReviewerDirectory:
    description: >-
      Who holds which reviewer role. Catalog Governance has one reviewer role per risk level
      (low, medium, high, critical); a person may hold several. The directory is outside this
      model; the decision only reads the roles of the person who decides (GOV-012).
    operations:
      ReviewerRoles:
        request:
          person: string
        reply:
          riskLevels: string
  ReviewerNotifier:
    description: Sends a notice to every person who holds the low-risk reviewer role (the only level the agent approves alone). The call is one-way.
    operations:
      SendAgentApprovalNotice:
        request:
          approvalCaseId: uuid
          findings: string

contexts:
  ProductData:
    description: >-
      The Product Lifecycle Service in the Product Data bounded context (drone-web D-037). The only
      writer of product identity, attributes, specifications and lifecycle state.
    publishes:
      ChangeForReview:
        version: 1
        description: A manager asks for a change to a product. Catalog Governance opens an approval case for it.
        from: ProductChangeRequested
        fields:
          productId: uuid
          sku: string
          changeType: string
          requestedChange: string
          reason: string
          riskLevel: string
          requestedBy: string
      ProductRecordChanged:
        version: 1
        description: >-
          The current record of a published product on the product-records stream
          (design/contracts/product-lifecycle.yaml). Drafts are not on it (CJ D5a, galaxitech-website
          D-038). The ordering model reads it as ProductData.ProductRecordChanged.
        from: ProductRecords
        fields:
          productId: uuid
          sku: string
          name: string
          brand: string
          lifecycleState: string
          replacementProductId: uuid

  CatalogGovernance:
    description: Approval cases and publication gates for catalog changes (Catalog Governance API, drone-web D-029).
    publishes:
      ChangeReleased:
        version: 1
        description: >-
          Governance released the publication gate for an approved change, through a reviewer or
          by an agent approval. The owning context may now apply it.
        from: ChangeReleaseAnnounced
        fields:
          approvalCaseId: uuid
          changeType: string
          sourceReferenceId: uuid
          requestedChange: string
      ChangeRejected:
        version: 1
        description: A reviewer rejected a change. The owning context does not apply it.
        from: ApprovalCaseRejected
        fields:
          approvalCaseId: uuid
          changeType: string
          sourceReferenceId: uuid
          requestedChange: string
          rationale: string
      ChangeExpired:
        version: 1
        description: Nobody decided a change within the review period. The owning context does not apply it.
        from: ApprovalCaseExpired
        fields:
          approvalCaseId: uuid
          changeType: string
          sourceReferenceId: uuid
          requestedChange: string

  ReviewAgent:
    foreign: true
    description: >-
      The review agent (an LLM) outside this model. It answers each AssessChange call with a
      verdict and its findings. Its answer is advice: Catalog Governance's decision checks it
      (GOV-008, GOV-011).
    publishes:
      ChangeAssessed:
        version: 1
        description: The review agent's verdict on one approval case.
        fields:
          approvalCaseId: uuid
          verdict: string
          findings: string

events:

  # ------------------------------------------------------------------ Product Data

  ProductDrafted:
    context: ProductData
    description: A manager created a product master record. It starts as a draft and is not sold.
    tags: [productId, sku]
    fields:
      productId: { type: uuid, source: generated, example: 6a1f3c2e-4b5d-4e8f-9a0b-1c2d3e4f5a61 }
      sku: { type: string, source: system, example: TMOTOR-VELOX-V2306-1750KV }
      name: { type: string, source: system, example: T-Motor Velox V2306 1750KV }
      brand: { type: string, source: system, example: T-Motor }
      draftedAt: { type: datetime, source: generated, example: 2026-11-02T09:10:00Z }

  ProductSpecificationsRecorded:
    context: ProductData
    description: A manager recorded the technical specifications that the compatibility rules read.
    tags: [productId]
    fields:
      productId: { type: uuid, source: system }
      minVoltage: { type: decimal, source: system, description: Lowest supply voltage in volts., example: 11.1 }
      maxVoltage: { type: decimal, source: system, description: Highest supply voltage in volts., example: 25.2 }
      maxCurrent: { type: decimal, source: system, description: Highest continuous current in amperes., example: 41.5 }
      mounting: { type: string, source: system, description: Mounting pattern., example: 16x16-m3 }
      weight: { type: decimal, source: system, description: Weight in grams., example: 33.6 }
      approvalCaseId: { type: uuid, source: system, from: ProductChangeCleared.approvalCaseId, optional: true, description: The released case for a change to an active product; null for a draft. }
      recordedAt: { type: datetime, source: generated, example: 2026-11-02T09:25:00Z }

  ProductChangeRequested:
    context: ProductData
    description: A manager asked for a change to a product. The change waits for Governance.
    tags: [productId]
    fields:
      productId: { type: uuid, source: system }
      sku: { type: string, source: system, from: ProductDrafted.sku }
      changeType: { type: string, source: system, description: "lifecycle-change, specification-change or details-change.", example: lifecycle-change }
      targetState: { type: string, source: system, optional: true, description: "For a lifecycle change the state asked for: active or discontinued. Null for the other types.", example: active }
      newMinVoltage: { type: decimal, source: system, optional: true, description: "For a specification change the new lowest supply voltage in volts; null for the other types.", example: 11.1 }
      newMaxVoltage: { type: decimal, source: system, optional: true, description: "For a specification change the new highest supply voltage in volts.", example: 25.2 }
      newMaxCurrent: { type: decimal, source: system, optional: true, description: "For a specification change the new highest continuous current in amperes.", example: 38.0 }
      newMounting: { type: string, source: system, optional: true, description: "For a specification change the new mounting pattern.", example: 16x16-m3 }
      newWeight: { type: decimal, source: system, optional: true, description: "For a specification change the new weight in grams.", example: 33.6 }
      newName: { type: string, source: system, optional: true, description: "For a details change the new name; null for the other types.", example: T-Motor Velox V2306 V2 1750KV }
      newShortDescription: { type: string, source: system, optional: true, description: "For a details change the new short description.", example: 2306 motor for 6S 5-inch freestyle builds }
      requestedChange:
        type: string
        source: generated
        description: >-
          What the reviewer reads, made from the typed values: for a lifecycle change the target
          state; for a specification or details change each value that changes, old to new (PLC-012).
        example: active
      reason: { type: string, source: system, example: Launch with the 5-inch freestyle range }
      riskLevel: { type: string, source: system, description: "The level the manager asks for: low, medium, high or critical. Governance never sets it lower than its policy (GOV-004).", example: medium }
      requestedBy: { type: string, source: system, description: The manager who asked., example: Nora Lund }
      requestedAt: { type: datetime, source: generated, example: 2026-11-02T09:40:00Z }

  ProductChangeCleared:
    context: ProductData
    description: Governance released the requested change. The manager may now apply it.
    tags: [productId]
    fields:
      productId: { type: uuid, source: system }
      changeType: { type: string, source: system }
      requestedChange: { type: string, source: system }
      approvalCaseId: { type: uuid, source: system, example: 03724352-c0cd-4fa7-ac65-bddf8df0474d }

  ProductChangeRefused:
    context: ProductData
    description: Governance rejected the requested change. The product stays as it was.
    tags: [productId]
    fields:
      productId: { type: uuid, source: system }
      changeType: { type: string, source: system }
      requestedChange: { type: string, source: system }
      approvalCaseId: { type: uuid, source: system }
      rationale: { type: string, source: system, example: Datasheet does not state the maximum current }

  ProductChangeExpired:
    context: ProductData
    description: Nobody at Governance decided the requested change in time. The product stays as it was, and the manager may ask again.
    tags: [productId]
    fields:
      productId: { type: uuid, source: system }
      changeType: { type: string, source: system }
      requestedChange: { type: string, source: system }
      approvalCaseId: { type: uuid, source: system }

  ProductPublished:
    context: ProductData
    description: The product became active. The shop and partner feeds may show and sell it.
    tags: [productId]
    fields:
      productId: { type: uuid, source: system }
      sku: { type: string, source: system, from: ProductDrafted.sku }
      brand: { type: string, source: system, from: ProductDrafted.brand }
      name:
        type: string
        source: generated
        description: The name from the draft, or from the latest revision of the details.
        example: T-Motor Velox V2306 1750KV
      approvalCaseId: { type: uuid, source: system, from: ProductChangeCleared.approvalCaseId }
      publishedAt: { type: datetime, source: generated, example: 2026-11-03T08:00:00Z }

  ProductDetailsRevised:
    context: ProductData
    description: A manager changed the name or the short description of a product.
    tags: [productId]
    fields:
      productId: { type: uuid, source: system }
      name: { type: string, source: system }
      shortDescription: { type: string, source: system, example: 2306 motor for 6S 5-inch freestyle builds }
      approvalCaseId: { type: uuid, source: system, from: ProductChangeCleared.approvalCaseId, optional: true, description: The released case for a change to an active product; null for a draft or a discontinued product. }
      revisedAt: { type: datetime, source: generated, example: 2026-12-01T10:00:00Z }

  ProductDiscontinued:
    context: ProductData
    description: The product is no longer sold. It stays in the catalog as discontinued, not deleted.
    tags: [productId]
    fields:
      productId: { type: uuid, source: system }
      reason: { type: string, source: system, from: ProductChangeRequested.reason }
      approvalCaseId: { type: uuid, source: system, from: ProductChangeCleared.approvalCaseId }
      discontinuedAt: { type: datetime, source: generated, example: 2027-06-30T16:00:00Z }

  ReplacementProductLinked:
    context: ProductData
    description: A manager named the product that replaces a discontinued one.
    tags: [productId, replacementProductId]
    fields:
      productId: { type: uuid, source: system }
      replacementProductId: { type: uuid, source: system, example: 9b2e4d6f-1a3c-4e5b-8d7f-2a4c6e8b0d13 }
      reasonCode: { type: string, source: system, example: successor-model }
      linkedAt: { type: datetime, source: generated, example: 2027-06-30T16:05:00Z }

  # ------------------------------------------------------------------ Catalog Governance

  ApprovalCaseSubmitted:
    context: CatalogGovernance
    description: Governance opened an approval case for a change another context asked for. The case is pending.
    tags: [approvalCaseId, sourceReferenceId]
    fields:
      approvalCaseId: { type: uuid, source: generated, example: 03724352-c0cd-4fa7-ac65-bddf8df0474d }
      changeType: { type: string, source: system, example: lifecycle-change }
      sourceReferenceId: { type: uuid, source: system, description: The product the change is about., example: 6a1f3c2e-4b5d-4e8f-9a0b-1c2d3e4f5a61 }
      sourceLabel: { type: string, source: system, description: What a reviewer reads to know the product (its SKU)., example: TMOTOR-VELOX-V2306-1750KV }
      requestedChange: { type: string, source: system, example: active }
      rationale: { type: string, source: system, example: Launch with the 5-inch freestyle range }
      requestedRiskLevel: { type: string, source: system, description: The level the manager asked for., example: medium }
      riskLevel:
        type: string
        source: generated
        description: "The policy level for the change type (GOV-005), or the requested level when that is higher (GOV-004): low, medium, high or critical."
        example: high
      reviewRoute:
        type: string
        source: generated
        description: "Who decides, from the risk level (GOV-008): agent (low), agent-then-person (medium) or person (high, critical)."
        example: person
      requestedBy: { type: string, source: system, example: Nora Lund }
      submittedAt: { type: datetime, source: generated, example: 2026-11-02T09:40:05Z }
      expiresAt: { type: datetime, source: generated, description: submittedAt plus the review period of 14 days (GOV-010)., example: 2026-11-16T09:40:05Z }

  AgentReviewRequested:
    context: CatalogGovernance
    description: Governance sent a low- or medium-risk case to the review agent.
    tags: [approvalCaseId]
    fields:
      approvalCaseId: { type: uuid, source: system }
      sentAt: { type: datetime, source: generated, example: 2026-11-02T09:40:10Z }

  ChangeApprovedByAgent:
    context: CatalogGovernance
    description: >-
      The review agent approved a low-risk change. The case is approved and its publication gate is
      released by this approval: no person decides or releases it (GOV-013). The reviewers are told.
    tags: [approvalCaseId]
    fields:
      approvalCaseId: { type: uuid, source: system }
      verdict: { type: string, source: system, description: The verdict as the agent gave it., example: approve }
      findings: { type: string, source: system, description: What the agent checked and found., example: New description matches the datasheet; no claim about compatibility changed }
      assessedAt: { type: datetime, source: generated, example: 2026-12-01T09:31:00Z }

  ChangeRecommendedByAgent:
    context: CatalogGovernance
    description: The review agent found no problem with a medium-risk change. A person must still confirm it.
    tags: [approvalCaseId]
    fields:
      approvalCaseId: { type: uuid, source: system }
      verdict: { type: string, source: system }
      findings: { type: string, source: system }
      assessedAt: { type: datetime, source: generated }

  ChangeEscalatedByAgent:
    context: CatalogGovernance
    description: The review agent did not approve the change. A person decides it.
    tags: [approvalCaseId]
    fields:
      approvalCaseId: { type: uuid, source: system }
      verdict: { type: string, source: system }
      findings: { type: string, source: system }
      assessedAt: { type: datetime, source: generated }

  ReviewerAssigned:
    context: CatalogGovernance
    description: A reviewer took responsibility for an approval case.
    tags: [approvalCaseId]
    fields:
      approvalCaseId: { type: uuid, source: system }
      reviewer: { type: string, source: system, example: Lena Holm }
      assignedAt: { type: datetime, source: generated, example: 2026-11-02T11:00:00Z }

  ApprovalCaseApproved:
    context: CatalogGovernance
    description: A reviewer approved the change. The decision is an audit record and does not change.
    tags: [approvalCaseId]
    fields:
      approvalCaseId: { type: uuid, source: system }
      rationale: { type: string, source: system, example: Specifications match the supplier datasheet }
      decidedBy: { type: string, source: system, example: Lena Holm }
      deciderRiskLevels: { type: string, source: external, description: "The risk levels whose reviewer role the person held when they decided, from the reviewer directory (GOV-012).", example: "medium, high" }
      decidedAt: { type: datetime, source: generated, example: 2026-11-02T14:30:00Z }

  ApprovalCaseRejected:
    context: CatalogGovernance
    description: A reviewer rejected the change. The decision is an audit record and does not change.
    tags: [approvalCaseId, sourceReferenceId]
    fields:
      approvalCaseId: { type: uuid, source: system }
      rationale: { type: string, source: system }
      decidedBy: { type: string, source: system }
      deciderRiskLevels: { type: string, source: external }
      decidedAt: { type: datetime, source: generated, example: 2026-11-02T14:30:00Z }
      changeType: { type: string, source: system, from: ApprovalCaseSubmitted.changeType }
      sourceReferenceId: { type: uuid, source: system, from: ApprovalCaseSubmitted.sourceReferenceId }
      requestedChange: { type: string, source: system, from: ApprovalCaseSubmitted.requestedChange }

  ApprovalCaseExpired:
    context: CatalogGovernance
    description: Nobody decided the case within the review period. It is closed without a decision.
    tags: [approvalCaseId, sourceReferenceId]
    fields:
      approvalCaseId: { type: uuid, source: system }
      expiredAt: { type: datetime, source: generated, example: 2026-11-16T09:40:05Z }
      changeType: { type: string, source: system, from: ApprovalCaseSubmitted.changeType }
      sourceReferenceId: { type: uuid, source: system, from: ApprovalCaseSubmitted.sourceReferenceId }
      requestedChange: { type: string, source: system, from: ApprovalCaseSubmitted.requestedChange }

  PublicationGateReleased:
    context: CatalogGovernance
    description: A reviewer released the publication gate for an approved change.
    tags: [approvalCaseId, sourceReferenceId]
    fields:
      approvalCaseId: { type: uuid, source: system }
      releasedBy: { type: string, source: system, example: Lena Holm }
      releasedAt: { type: datetime, source: generated, example: 2026-11-02T15:00:00Z }
      changeType: { type: string, source: system, from: ApprovalCaseSubmitted.changeType }
      sourceReferenceId: { type: uuid, source: system, from: ApprovalCaseSubmitted.sourceReferenceId }
      requestedChange: { type: string, source: system, from: ApprovalCaseSubmitted.requestedChange }

  ReviewersToldOfAgentApproval:
    context: CatalogGovernance
    description: >-
      Governance told the reviewers that the review agent approved a change and that its gate is
      released, so a person can still look at it (GOV-013).
    tags: [approvalCaseId]
    fields:
      approvalCaseId: { type: uuid, source: system }
      toldAt: { type: datetime, source: generated, example: 2026-12-01T09:31:30Z }

  ChangeReleaseAnnounced:
    context: CatalogGovernance
    description: >-
      Governance told the owning context that a change is released, after a reviewer released the
      gate or the agent's approval released it.
    tags: [approvalCaseId, sourceReferenceId]
    fields:
      approvalCaseId: { type: uuid, source: system }
      changeType: { type: string, source: system, from: ApprovalCaseSubmitted.changeType }
      sourceReferenceId: { type: uuid, source: system, from: ApprovalCaseSubmitted.sourceReferenceId }
      requestedChange: { type: string, source: system, from: ApprovalCaseSubmitted.requestedChange }
      releasedBy: { type: string, source: system, description: "The reviewer who released the gate, or review agent when the agent's approval released it.", example: Lena Holm }
      announcedAt: { type: datetime, source: generated, example: 2026-11-02T15:00:05Z }

slices:

  # ================================================================== Draft

  DraftProduct:
    pattern: command
    chapter: Draft
    description: >-
      The manager creates a product master record. ADDR: JS1 "Submit new product";
      createProduct() (POST /product-lifecycle/v1/products, 409 for a duplicate SKU).
    screen:
      name: NewProductForm
      actor: ProductLifecycleManager
      fields:
        sku: { type: string, source: user, example: TMOTOR-VELOX-V2306-1750KV }
        name: { type: string, source: user, example: T-Motor Velox V2306 1750KV }
        brand: { type: string, source: user, example: T-Motor }
    command:
      name: DraftProduct
      fields:
        sku: { type: string, source: system, from: screen.sku }
        name: { type: string, source: system, from: screen.name }
        brand: { type: string, source: system, from: screen.brand }
    emits:
      - event: ProductDrafted
    rules:
      PLC-001:
        title: A SKU belongs to one product only
        description: From the Product Lifecycle API design, createProduct() answers 409 for a duplicate SKU.
    errors:
      SkuAlreadyUsed: { description: Another product already has this SKU., rule: PLC-001 }
    tests:
      DraftsTheVeloxMotor:
        rules: [PLC-001]
        when:
          values: { sku: TMOTOR-VELOX-V2306-1750KV, name: T-Motor Velox V2306 1750KV, brand: T-Motor }
        then:
          - event: ProductDrafted
            values: { sku: TMOTOR-VELOX-V2306-1750KV, name: T-Motor Velox V2306 1750KV, brand: T-Motor }
      RejectsASkuThatIsTaken:
        rules: [PLC-001]
        given:
          - event: ProductDrafted
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, name: T-Motor Velox V2306 1750KV, brand: T-Motor }
        when:
          values: { sku: TMOTOR-VELOX-V2306-1750KV, name: T-Motor Velox V2306 1750KV (copy), brand: T-Motor }
        then:
          - error: SkuAlreadyUsed

  RecordSpecifications:
    pattern: command
    chapter: Draft
    description: >-
      The manager records the specifications the compatibility rules read: voltage range, current,
      mounting and weight (the Core spec model of drone-web D-037). On a draft the values apply at
      once. On an active product they apply only after Governance released a specification change
      (CJ D3b), and only with the values of that released request (PLC-012, drone-web D-039). On a
      discontinued product they are frozen (CJ D4a).
      ADDR: JS1 "Add technical specifications"; updateProductSpecifications().
    screen:
      name: SpecificationsForm
      actor: ProductLifecycleManager
      fields:
        productId: { type: uuid, source: user, description: Set by the ProductDetailPage the task starts from; else picked from the products under management., example: 6a1f3c2e-4b5d-4e8f-9a0b-1c2d3e4f5a61 }
        minVoltage: { type: decimal, source: user, example: 11.1 }
        maxVoltage: { type: decimal, source: user, example: 25.2 }
        maxCurrent: { type: decimal, source: user, example: 41.5 }
        mounting: { type: string, source: user, example: 16x16-m3 }
        weight: { type: decimal, source: user, example: 33.6 }
    command:
      name: RecordSpecifications
      fields:
        productId:
          type: uuid
          source: system
          from: screen.productId
          lookup: { view: ProductsUnderManagement, value: productId, label: name }
        minVoltage: { type: decimal, source: system, from: screen.minVoltage }
        maxVoltage: { type: decimal, source: system, from: screen.maxVoltage }
        maxCurrent: { type: decimal, source: system, from: screen.maxCurrent }
        mounting: { type: string, source: system, from: screen.mounting }
        weight: { type: decimal, source: system, from: screen.weight }
    emits:
      - event: ProductSpecificationsRecorded
    rules:
      PLC-002:
        title: The lowest supply voltage is not above the highest
        description: Assumed from the Range type (min, max) of the product-specifications contract.
        status: proposed
      PLC-009:
        title: A change of specifications or details on an active product takes effect only after Governance released it
        description: >-
          CJ D3b (2026-10-29): every change on an active product goes through Governance review.
          One release allows one change of its type. A draft is not sold and changes without
          review; it is reviewed as a whole when it goes live.
      PLC-010:
        title: A discontinued product keeps its specifications; its details may still change
        description: CJ D4a (2026-10-29).
    errors:
      ProductUnknown: { description: No product was drafted under this id. }
      VoltageRangeReversed: { description: The lowest voltage is above the highest., rule: PLC-002 }
      ChangeNotReleased: { description: The product is active and no released specification change waits for it., rule: PLC-009 }
      ValuesDifferFromTheApprovedOnes: { description: "The product is active and the specifications differ from the new values in the released request.", rule: PLC-012 }
      SpecificationsFrozen: { description: The product is discontinued., rule: PLC-010 }
    tests:
      RecordsTheVeloxSpecifications:
        given:
          - event: ProductDrafted
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV }
        when:
          values: { productId: $velox, minVoltage: 11.1, maxVoltage: 25.2, maxCurrent: 41.5, mounting: 16x16-m3, weight: 33.6 }
        then:
          - event: ProductSpecificationsRecorded
            values: { productId: $velox, minVoltage: 11.1, maxVoltage: 25.2, maxCurrent: 41.5, mounting: 16x16-m3, weight: 33.6, approvalCaseId: null }
      CorrectsTheCurrentOfAnActiveProduct:
        rules: [PLC-009, PLC-012]
        given:
          - event: ProductDrafted
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox, minVoltage: 11.1, maxVoltage: 25.2, maxCurrent: 41.5, mounting: 16x16-m3, weight: 33.6 }
          - event: ProductPublished
            values: { productId: $velox }
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: specification-change, newMinVoltage: 11.1, newMaxVoltage: 25.2, newMaxCurrent: 38.0, newMounting: 16x16-m3, newWeight: 33.6, requestedChange: "maxCurrent 41.5 A to 38.0 A" }
          - event: ProductChangeCleared
            values: { productId: $velox, changeType: specification-change, requestedChange: "maxCurrent 41.5 A to 38.0 A", approvalCaseId: $specCase }
        when:
          values: { productId: $velox, minVoltage: 11.1, maxVoltage: 25.2, maxCurrent: 38.0, mounting: 16x16-m3, weight: 33.6 }
        then:
          - event: ProductSpecificationsRecorded
            values: { productId: $velox, maxCurrent: 38.0, approvalCaseId: $specCase }
      RejectsACurrentOtherThanTheApprovedOne:
        rules: [PLC-012]
        given:
          - event: ProductDrafted
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox, minVoltage: 11.1, maxVoltage: 25.2, maxCurrent: 41.5, mounting: 16x16-m3, weight: 33.6 }
          - event: ProductPublished
            values: { productId: $velox }
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: specification-change, newMinVoltage: 11.1, newMaxVoltage: 25.2, newMaxCurrent: 38.0, newMounting: 16x16-m3, newWeight: 33.6, requestedChange: "maxCurrent 41.5 A to 38.0 A" }
          - event: ProductChangeCleared
            values: { productId: $velox, changeType: specification-change, requestedChange: "maxCurrent 41.5 A to 38.0 A", approvalCaseId: $specCase }
        when:
          values: { productId: $velox, minVoltage: 11.1, maxVoltage: 25.2, maxCurrent: <current>, mounting: <mounting>, weight: 33.6 }
        then:
          - error: ValuesDifferFromTheApprovedOnes
        examples:
          - { current: 36.0, mounting: 16x16-m3 }
          - { current: 38.0, mounting: 19x19-m3 }
      RejectsChangingAnActiveProductWithoutARelease:
        rules: [PLC-009]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox, maxCurrent: 41.5 }
          - event: ProductPublished
            values: { productId: $velox }
        when:
          values: { productId: $velox, minVoltage: 11.1, maxVoltage: 25.2, maxCurrent: 38.0, mounting: 16x16-m3, weight: 33.6 }
        then:
          - error: ChangeNotReleased
      RejectsUsingOneReleaseTwice:
        rules: [PLC-009]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductPublished
            values: { productId: $velox }
          - event: ProductChangeCleared
            values: { productId: $velox, changeType: specification-change, approvalCaseId: $specCase }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox, maxCurrent: 38.0, approvalCaseId: $specCase }
        when:
          values: { productId: $velox, minVoltage: 11.1, maxVoltage: 25.2, maxCurrent: 36.0, mounting: 16x16-m3, weight: 33.6 }
        then:
          - error: ChangeNotReleased
      RejectsSpecificationsForADiscontinuedProduct:
        rules: [PLC-010]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductPublished
            values: { productId: $velox }
          - event: ProductDiscontinued
            values: { productId: $velox }
        when:
          values: { productId: $velox, minVoltage: 11.1, maxVoltage: 25.2, maxCurrent: 38.0, mounting: 16x16-m3, weight: 33.6 }
        then:
          - error: SpecificationsFrozen
      RejectsAReversedVoltageRange:
        rules: [PLC-002]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
        when:
          values: { productId: $velox, minVoltage: <min>, maxVoltage: <max> }
        then:
          - error: VoltageRangeReversed
        examples:
          - { min: 25.2, max: 11.1 }
          - { min: 12.0, max: 11.9 }
      RejectsSpecificationsForAnUnknownProduct:
        when:
          values: { productId: $nobody, minVoltage: 11.1, maxVoltage: 25.2 }
        then:
          - error: ProductUnknown

  FindProductsToManage:
    pattern: query
    chapter: Draft
    description: >-
      The manager's product list: SKU, name, brand, lifecycle state, whether the specifications are
      recorded, where the latest change request stands, and the replacement of a discontinued
      product. Drafts are here; they are not on product-records (FeedProductRecords).
      ADDR: JS1 "Search products for management"; searchProductsForManagement().
    screen:
      name: ProductAdminList
      actor: ProductLifecycleManager
    views:
      - list-view:
          name: ProductsUnderManagement
          identity: productId
          reads:
            ProductDrafted: create
            ProductSpecificationsRecorded: update
            ProductChangeRequested: update
            ProductChangeCleared: update
            ProductChangeRefused: update
            ProductChangeExpired: update
            ProductPublished: update
            ProductDetailsRevised: update
            ProductDiscontinued: update
            ReplacementProductLinked: update
          fields:
            productId: { type: uuid, source: system, from: ProductDrafted.productId, example: 6a1f3c2e-4b5d-4e8f-9a0b-1c2d3e4f5a61 }
            sku: { type: string, source: system, from: ProductDrafted.sku }
            brand: { type: string, source: system, from: ProductDrafted.brand }
            name:
              type: string
              source: generated
              description: The name from the draft, or from the latest revision of the details.
              example: T-Motor Velox V2306 1750KV
            lifecycleState:
              type: string
              source: generated
              description: "draft; active after ProductPublished; discontinued after ProductDiscontinued."
              example: draft
            specified:
              type: bool
              source: generated
              description: The specifications are recorded.
              example: true
            review:
              type: string
              source: generated
              description: >-
                Where the latest change request stands: none, in review, cleared, refused or
                expired, with the state asked for (a lifecycle change) or the change type. A cleared
                change goes back to none when the manager applies it.
              example: "in review: active"
            replacementProductId: { type: uuid, source: system, from: ReplacementProductLinked.replacementProductId, optional: true }
    tests:
      ShowsEachProductWithItsStateAndReview:
        given:
          - event: ProductDrafted
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, name: T-Motor Velox V2306 1750KV, brand: T-Motor }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox }
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: active, requestedChange: active }
          - event: ProductDrafted
            values: { productId: $f405, sku: SPEEDYBEE-F405-V4, name: SpeedyBee F405 V4 Flight Controller, brand: SpeedyBee }
        then:
          - view: ProductsUnderManagement
            rows:
              - { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, brand: T-Motor, name: T-Motor Velox V2306 1750KV, lifecycleState: draft, specified: true, review: "in review: active", replacementProductId: null }
              - { productId: $f405, sku: SPEEDYBEE-F405-V4, brand: SpeedyBee, name: SpeedyBee F405 V4 Flight Controller, lifecycleState: draft, specified: false, review: none, replacementProductId: null }
      ShowsARefusedAndAnExpiredRequest:
        given:
          - event: ProductDrafted
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, name: T-Motor Velox V2306 1750KV, brand: T-Motor }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox }
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: active, requestedChange: active }
          - event: ProductChangeRefused
            values: { productId: $velox, changeType: lifecycle-change, requestedChange: active, rationale: Datasheet does not state the maximum current }
          - event: ProductDrafted
            values: { productId: $f405, sku: SPEEDYBEE-F405-V4, name: SpeedyBee F405 V4 Flight Controller, brand: SpeedyBee }
          - event: ProductSpecificationsRecorded
            values: { productId: $f405 }
          - event: ProductChangeRequested
            values: { productId: $f405, changeType: lifecycle-change, targetState: active, requestedChange: active }
          - event: ProductChangeExpired
            values: { productId: $f405, changeType: lifecycle-change, requestedChange: active }
        then:
          - view: ProductsUnderManagement
            rows:
              - { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, brand: T-Motor, name: T-Motor Velox V2306 1750KV, lifecycleState: draft, specified: true, review: "refused: active", replacementProductId: null }
              - { productId: $f405, sku: SPEEDYBEE-F405-V4, brand: SpeedyBee, name: SpeedyBee F405 V4 Flight Controller, lifecycleState: draft, specified: true, review: "expired: active", replacementProductId: null }
      FollowsTheVeloxFromDraftToReplaced:
        given:
          - event: ProductDrafted
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, name: T-Motor Velox V2306 1750KV, brand: T-Motor }
          - event: ProductSpecificationsRecorded
            values: { productId: $velox }
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: active, requestedChange: active }
          - event: ProductChangeCleared
            values: { productId: $velox, changeType: lifecycle-change, requestedChange: active }
          - event: ProductPublished
            values: { productId: $velox }
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: details-change, requestedChange: "Name: add V2" }
          - event: ProductChangeCleared
            values: { productId: $velox, changeType: details-change, requestedChange: "Name: add V2" }
          - event: ProductDetailsRevised
            values: { productId: $velox, name: T-Motor Velox V2306 V2 1750KV }
          - event: ProductDrafted
            values: { productId: $velox3, sku: TMOTOR-VELOX-V2306V3-1950KV, name: T-Motor Velox V2306 V3 1950KV, brand: T-Motor }
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: discontinued, requestedChange: discontinued }
          - event: ProductChangeCleared
            values: { productId: $velox, changeType: lifecycle-change, requestedChange: discontinued }
          - event: ProductDiscontinued
            values: { productId: $velox }
          - event: ReplacementProductLinked
            values: { productId: $velox, replacementProductId: $velox3 }
        then:
          - view: ProductsUnderManagement
            rows:
              - { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, brand: T-Motor, name: T-Motor Velox V2306 V2 1750KV, lifecycleState: discontinued, specified: true, review: none, replacementProductId: $velox3 }
              - { productId: $velox3, sku: TMOTOR-VELOX-V2306V3-1950KV, brand: T-Motor, name: T-Motor Velox V2306 V3 1950KV, lifecycleState: draft, specified: false, review: none, replacementProductId: null }

  ShowProductDetails:
    pattern: query
    chapter: Draft
    description: >-
      The manager picks a product from the ProductAdminList and sees all of it on one page: identity,
      details, specifications, lifecycle state, the latest change request and the replacement.
      The page is the product's task menu. Its tasks are the command screens that change a product:
      SpecificationsForm (RecordSpecifications), ProductChangeForm (RequestProductChange),
      PublishProductForm (PublishProduct), ProductDetailsForm (ReviseProductDetails),
      DiscontinueProductForm (DiscontinueProduct) and ReplacementForm (LinkReplacementProduct).
      Each task starts with the page's productId. No field on the page is edited directly
      (drone-web D-038). ADDR: align/activity-steps.md JS1 ("Search/details projections update", "Product detail replacement section updates"); design/api-design.md has no operation that reads one product (proposed).
    screen:
      name: ProductDetailPage
      actor: ProductLifecycleManager
    views:
      - single-view:
          name: ProductDetails
          keyed-by: ProductsUnderManagement.productId
          identity: productId
          reads:
            ProductDrafted: create
            ProductSpecificationsRecorded: update
            ProductChangeRequested: update
            ProductChangeCleared: update
            ProductChangeRefused: update
            ProductChangeExpired: update
            ProductPublished: update
            ProductDetailsRevised: update
            ProductDiscontinued: update
            ReplacementProductLinked: update
          fields:
            productId: { type: uuid, source: system, from: ProductDrafted.productId, example: 6a1f3c2e-4b5d-4e8f-9a0b-1c2d3e4f5a61 }
            sku: { type: string, source: system, from: ProductDrafted.sku }
            brand: { type: string, source: system, from: ProductDrafted.brand }
            draftedAt: { type: datetime, source: system, from: ProductDrafted.draftedAt }
            name:
              type: string
              source: generated
              description: The name from the draft, or from the latest revision of the details.
              example: T-Motor Velox V2306 1750KV
            shortDescription: { type: string, source: system, from: ProductDetailsRevised.shortDescription, optional: true }
            minVoltage: { type: decimal, source: system, from: ProductSpecificationsRecorded.minVoltage, optional: true }
