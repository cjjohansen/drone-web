  AskAgentForReview:
    pattern: automation
    chapter: Review
    description: >-
      Governance sends each low- and medium-risk case to the review agent, once. A high- or
      critical-risk case stays on the list for a person and is not sent (GOV-008). The agent
      answers later through ReviewAgent.ChangeAssessed (ApproveAsAgent, RecommendAsAgent, EscalateToPerson).
    views:
      - list-view:
          name: CasesForTheAgent
          identity: approvalCaseId
          reads:
            ApprovalCaseSubmitted: create
            AgentReviewRequested: remove
            ApprovalCaseApproved: remove
            ApprovalCaseRejected: remove
            ApprovalCaseExpired: remove
          fields:
            approvalCaseId: { type: uuid, source: system, from: ApprovalCaseSubmitted.approvalCaseId }
            changeType: { type: string, source: system, from: ApprovalCaseSubmitted.changeType }
            sourceLabel: { type: string, source: system, from: ApprovalCaseSubmitted.sourceLabel }
            requestedChange: { type: string, source: system, from: ApprovalCaseSubmitted.requestedChange }
            rationale: { type: string, source: system, from: ApprovalCaseSubmitted.rationale }
            riskLevel: { type: string, source: system, from: ApprovalCaseSubmitted.riskLevel }
    processor:
      name: AgentReviewDispatcher
      lane: AgentReview
      calls: [ChangeReviewAgent.AssessChange]
    command:
      name: RequestAgentReview
      fields:
        approvalCaseId: { type: uuid, source: system, from: CasesForTheAgent.approvalCaseId }
        riskLevel: { type: string, source: system, from: CasesForTheAgent.riskLevel }
    emits:
      - event: AgentReviewRequested
    tests:
      SendsALowRiskDetailsChangeToTheAgent:
        rules: [GOV-008]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $detailsCase, changeType: details-change, riskLevel: low, reviewRoute: agent }
        then:
          - event: AgentReviewRequested
            values: { approvalCaseId: $detailsCase }
      SendsAMediumRiskSpecificationChangeToTheAgent:
        rules: [GOV-008]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $specCase, changeType: specification-change, riskLevel: medium, reviewRoute: agent-then-person }
        then:
          - event: AgentReviewRequested
            values: { approvalCaseId: $specCase }
      LeavesAHighRiskCaseToAPerson:
        rules: [GOV-008]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, changeType: lifecycle-change, riskLevel: high, reviewRoute: person }
        then: []
      SendsEachCaseOnce:
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $detailsCase, changeType: details-change, riskLevel: low, reviewRoute: agent }
          - event: AgentReviewRequested
            values: { approvalCaseId: $detailsCase }
        then: []

  ApproveAsAgent:
    pattern: translation
    chapter: Review
    description: >-
      The LLM decision, outcome one of three. The review agent's answer arrives as a message from
      outside the model; three listeners read it, and each turns the answers it is for into one
      typed command. This one takes an approve verdict on a low-risk case and approves it
      (ChangeApprovedByAgent): no person decides, and the approval releases the publication gate
      by itself (GOV-013); the reviewers are told afterwards. The decision checks the verdict
      against the case's risk level, so the LLM never approves more than the policy allows. CJ D2a
      and D3b (2026-10-29); drone-web D-039.
    message: ReviewAgent.ChangeAssessed
    processor:
      name: AgentApprovalListener
      lane: Integration
    command:
      name: ApproveAsAgent
      fields:
        approvalCaseId: { type: uuid, source: system, from: message.approvalCaseId }
        verdict: { type: string, source: system, from: message.verdict }
        findings: { type: string, source: system, from: message.findings }
    emits:
      - event: ChangeApprovedByAgent
    rules:
      GOV-008:
        title: The agent alone approves only a low-risk change; a person confirms a medium-risk change and decides a high- or critical-risk change
        description: CJ D2a and D3b (2026-10-29).
      GOV-013:
        title: The agent's approval of a low-risk change releases its publication gate, and the reviewers are told
        description: >-
          CJ 2026-10-29, drone-web D-039. No reviewer releases a change the agent approved
          (ReleaseChange refuses it). AnnounceRelease tells Product Data, and
          TellReviewersOfAgentApproval tells the reviewers, so a person can still look at it.
    tests:
      ApprovesALowRiskDetailsChange:
        rules: [GOV-008, GOV-013]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $detailsCase, changeType: details-change, riskLevel: low, reviewRoute: agent }
          - event: AgentReviewRequested
            values: { approvalCaseId: $detailsCase }
        when:
          values: { approvalCaseId: $detailsCase, verdict: approve, findings: New description matches the datasheet; no claim about compatibility changed }
        then:
          - event: ChangeApprovedByAgent
            values: { approvalCaseId: $detailsCase, verdict: approve, findings: New description matches the datasheet; no claim about compatibility changed }
      LeavesAMediumRiskApprovalToARecommendation:
        rules: [GOV-008]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $specCase, changeType: specification-change, riskLevel: medium, reviewRoute: agent-then-person }
          - event: AgentReviewRequested
            values: { approvalCaseId: $specCase }
        when:
          values: { approvalCaseId: $specCase, verdict: approve, findings: 38.0 A matches datasheet rev C }
        then: []
      IgnoresAnApprovalOfAHighRiskCase:
        rules: [GOV-008]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, changeType: lifecycle-change, riskLevel: high, reviewRoute: person }
        when:
          values: { approvalCaseId: $launchCase, verdict: approve, findings: Looks complete }
        then: []
      IgnoresAnEscalation:
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $detailsCase, changeType: details-change, riskLevel: low, reviewRoute: agent }
          - event: AgentReviewRequested
            values: { approvalCaseId: $detailsCase }
        when:
          values: { approvalCaseId: $detailsCase, verdict: escalate, findings: The new name claims 8S support; the specifications say 6S }
        then: []
      IgnoresAnApprovalItAlreadyRecorded:
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $detailsCase, changeType: details-change, riskLevel: low, reviewRoute: agent }
          - event: AgentReviewRequested
            values: { approvalCaseId: $detailsCase }
          - event: ChangeApprovedByAgent
            values: { approvalCaseId: $detailsCase, verdict: approve }
        when:
          values: { approvalCaseId: $detailsCase, verdict: approve, findings: New description matches the datasheet; no claim about compatibility changed }
        then: []
      IgnoresAnAnswerForAnUnknownCase:
        when:
          values: { approvalCaseId: $nocase, verdict: approve, findings: Looks complete }
        then: []

  RecommendAsAgent:
    pattern: translation
    chapter: Review
    description: >-
      The LLM decision, outcome two of three. An approve verdict on a medium-risk case is only a
      recommendation (ChangeRecommendedByAgent): a person must still confirm it (ApproveChange).
      CJ D2a and D3b (2026-10-29).
    message: ReviewAgent.ChangeAssessed
    processor:
      name: AgentRecommendationListener
      lane: Integration
    command:
      name: RecommendAsAgent
      fields:
        approvalCaseId: { type: uuid, source: system, from: message.approvalCaseId }
        verdict: { type: string, source: system, from: message.verdict }
        findings: { type: string, source: system, from: message.findings }
    emits:
      - event: ChangeRecommendedByAgent
    tests:
      RecommendsAMediumRiskSpecificationChange:
        rules: [GOV-008]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $specCase, changeType: specification-change, riskLevel: medium, reviewRoute: agent-then-person }
          - event: AgentReviewRequested
            values: { approvalCaseId: $specCase }
        when:
          values: { approvalCaseId: $specCase, verdict: approve, findings: 38.0 A matches datasheet rev C; no rule in the compatibility set reads a current above 38 A }
        then:
          - event: ChangeRecommendedByAgent
            values: { approvalCaseId: $specCase, verdict: approve, findings: 38.0 A matches datasheet rev C; no rule in the compatibility set reads a current above 38 A }
      LeavesALowRiskApprovalToTheAgent:
        rules: [GOV-008]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $detailsCase, changeType: details-change, riskLevel: low, reviewRoute: agent }
          - event: AgentReviewRequested
            values: { approvalCaseId: $detailsCase }
        when:
          values: { approvalCaseId: $detailsCase, verdict: approve, findings: New description matches the datasheet }
        then: []
      IgnoresAnEscalation:
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $specCase, changeType: specification-change, riskLevel: medium, reviewRoute: agent-then-person }
          - event: AgentReviewRequested
            values: { approvalCaseId: $specCase }
        when:
          values: { approvalCaseId: $specCase, verdict: escalate, findings: Datasheet rev C is not attached }
        then: []
      IgnoresARecommendationItAlreadyRecorded:
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $specCase, changeType: specification-change, riskLevel: medium, reviewRoute: agent-then-person }
          - event: AgentReviewRequested
            values: { approvalCaseId: $specCase }
          - event: ChangeRecommendedByAgent
            values: { approvalCaseId: $specCase, verdict: approve }
        when:
          values: { approvalCaseId: $specCase, verdict: approve, findings: 38.0 A matches datasheet rev C; no rule in the compatibility set reads a current above 38 A }
        then: []
      IgnoresAnAnswerForAnUnknownCase:
        when:
          values: { approvalCaseId: $nocase, verdict: approve, findings: Looks complete }
        then: []

  EscalateToPerson:
    pattern: translation
    chapter: Review
    description: >-
      The LLM decision, outcome three of three. An escalate verdict, or any verdict the listener
      cannot read as approve, sends a low- or medium-risk case to a person
      (ChangeEscalatedByAgent), with the agent's findings. CJ D2a and D3b (2026-10-29); GOV-011.
    message: ReviewAgent.ChangeAssessed
    processor:
      name: AgentEscalationListener
      lane: Integration
    command:
      name: EscalateToPerson
      fields:
        approvalCaseId: { type: uuid, source: system, from: message.approvalCaseId }
        verdict: { type: string, source: system, from: message.verdict }
        findings: { type: string, source: system, from: message.findings }
    emits:
      - event: ChangeEscalatedByAgent
    rules:
      GOV-011:
        title: A verdict other than approve sends the case to a person
        description: Our proposal, so that an unclear or malformed answer from the LLM never approves a change.
        status: proposed
    tests:
      EscalatesADetailsChangeTheAgentDoubts:
        rules: [GOV-011]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $detailsCase, changeType: details-change, riskLevel: low, reviewRoute: agent }
          - event: AgentReviewRequested
            values: { approvalCaseId: $detailsCase }
        when:
          values: { approvalCaseId: $detailsCase, verdict: escalate, findings: The new name claims 8S support; the specifications say 6S }
        then:
          - event: ChangeEscalatedByAgent
            values: { approvalCaseId: $detailsCase, verdict: escalate, findings: The new name claims 8S support; the specifications say 6S }
      SendsAnUnclearVerdictToAPerson:
        rules: [GOV-011]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $detailsCase, changeType: details-change, riskLevel: low, reviewRoute: agent }
          - event: AgentReviewRequested
            values: { approvalCaseId: $detailsCase }
        when:
          values: { approvalCaseId: $detailsCase, verdict: probably fine, findings: Looks right to me }
        then:
          - event: ChangeEscalatedByAgent
            values: { approvalCaseId: $detailsCase, verdict: probably fine }
      IgnoresAnApproval:
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $detailsCase, changeType: details-change, riskLevel: low, reviewRoute: agent }
          - event: AgentReviewRequested
            values: { approvalCaseId: $detailsCase }
        when:
          values: { approvalCaseId: $detailsCase, verdict: approve, findings: New description matches the datasheet }
        then: []
      IgnoresAnEscalationOfAHighRiskCase:
        rules: [GOV-008]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, changeType: lifecycle-change, riskLevel: high, reviewRoute: person }
        when:
          values: { approvalCaseId: $launchCase, verdict: escalate, findings: Not sure }
        then: []
      IgnoresAnEscalationItAlreadyRecorded:
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $detailsCase, changeType: details-change, riskLevel: low, reviewRoute: agent }
          - event: AgentReviewRequested
            values: { approvalCaseId: $detailsCase }
          - event: ChangeEscalatedByAgent
            values: { approvalCaseId: $detailsCase, verdict: escalate }
        when:
          values: { approvalCaseId: $detailsCase, verdict: escalate, findings: The new name claims 8S support; the specifications say 6S }
        then: []
      IgnoresAnAnswerForAnUnknownCase:
        when:
          values: { approvalCaseId: $nocase, verdict: escalate, findings: Not sure }
        then: []

  TellReviewersOfAgentApproval:
    pattern: automation
    chapter: Review
    description: >-
      An agent approval releases the gate without a person (GOV-013), so Governance tells the
      reviewers, once per case: every person who holds the reviewer role for the case's risk level
      gets a notice with the agent's findings (port ReviewerNotifier). A reviewer who disagrees
      asks the manager for a new change; the released change is not taken back. The
      ApprovalCaseDetailPage shows when the reviewers were told. CJ 2026-10-29, drone-web D-039.
    views:
      - list-view:
          name: AgentApprovalsToReport
          identity: approvalCaseId
          reads:
            ChangeApprovedByAgent: create
            ReviewersToldOfAgentApproval: remove
          fields:
            approvalCaseId: { type: uuid, source: system, from: ChangeApprovedByAgent.approvalCaseId }
            findings: { type: string, source: system, from: ChangeApprovedByAgent.findings }
            assessedAt: { type: datetime, source: system, from: ChangeApprovedByAgent.assessedAt }
    processor:
      name: AgentApprovalNotifier
      lane: Announcer
      calls: [ReviewerNotifier.SendAgentApprovalNotice]
    command:
      name: TellReviewersOfAgentApproval
      fields:
        approvalCaseId: { type: uuid, source: system, from: AgentApprovalsToReport.approvalCaseId }
    emits:
      - event: ReviewersToldOfAgentApproval
    tests:
      TellsTheReviewersOfTheVeloxDescription:
        rules: [GOV-013]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $detailsCase, changeType: details-change, riskLevel: low, reviewRoute: agent }
          - event: AgentReviewRequested
            values: { approvalCaseId: $detailsCase }
          - event: ChangeApprovedByAgent
            values: { approvalCaseId: $detailsCase, verdict: approve, findings: New description matches the datasheet; no claim about compatibility changed }
        then:
          - event: ReviewersToldOfAgentApproval
            values: { approvalCaseId: $detailsCase }
      LeavesARecommendationToTheConfirmingPerson:
        rules: [GOV-008]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $specCase, changeType: specification-change, riskLevel: medium, reviewRoute: agent-then-person }
          - event: ChangeRecommendedByAgent
            values: { approvalCaseId: $specCase, verdict: approve }
        then: []
      TellsOnce:
        given:
          - event: ChangeApprovedByAgent
            values: { approvalCaseId: $detailsCase, verdict: approve }
          - event: ReviewersToldOfAgentApproval
            values: { approvalCaseId: $detailsCase }
        then: []

  AssignReviewer:
    pattern: command
    chapter: Review
    description: "A reviewer takes an approval case. The manager who asked for the change cannot take it (four eyes). ADDR: assignApprovalReviewer()."
    screen:
      name: AssignReviewerForm
      actor: GovernanceReviewer
      fields:
        approvalCaseId: { type: uuid, source: user, description: Set by the ApprovalCaseDetailPage the task starts from; else picked from the approval cases., example: 03724352-c0cd-4fa7-ac65-bddf8df0474d }
        reviewer: { type: string, source: user, description: Picked from the governance reviewers; the reviewer directory is outside this model., example: Lena Holm }
    command:
      name: AssignReviewer
      fields:
        approvalCaseId:
          type: uuid
          source: system
          from: screen.approvalCaseId
          lookup: { view: ApprovalCases, value: approvalCaseId, label: sourceLabel }
        reviewer: { type: string, source: system, from: screen.reviewer }
    emits:
      - event: ReviewerAssigned
    errors:
      ApprovalCaseUnknown: { description: No approval case was opened under this id. }
      RequesterCannotReview: { description: The reviewer is the manager who asked for the change., rule: GOV-007 }
    tests:
      AssignsLenaToTheVeloxLaunch:
        rules: [GOV-007]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, sourceLabel: TMOTOR-VELOX-V2306-1750KV, requestedBy: Nora Lund }
        when:
          values: { approvalCaseId: $launchCase, reviewer: Lena Holm }
        then:
          - event: ReviewerAssigned
            values: { approvalCaseId: $launchCase, reviewer: Lena Holm }
      RejectsTheRequesterAsReviewer:
        rules: [GOV-007]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, sourceLabel: TMOTOR-VELOX-V2306-1750KV, requestedBy: Nora Lund }
        when:
          values: { approvalCaseId: $launchCase, reviewer: Nora Lund }
        then:
          - error: RequesterCannotReview
      RejectsAnUnknownCase:
        when:
          values: { approvalCaseId: $nocase, reviewer: Lena Holm }
        then:
          - error: ApprovalCaseUnknown

  ApproveChange:
    pattern: command
    chapter: Review
    description: >-
      A person approves the change with a rationale. The case must have an assigned reviewer, but
      any person who holds the reviewer role for the case's risk level may decide it, never the
      manager who asked (CJ D1a; GOV-012 by role, drone-web D-039). The person's roles come from
      the reviewer directory. For a medium-risk change the person confirms the agent's check; for a
      low-risk change a person decides only after the agent escalated it.
      ADDR: recordApprovalDecision(decision=approve).
    screen:
      name: ApproveForm
      actor: GovernanceReviewer
      fields:
        approvalCaseId: { type: uuid, source: user, description: Set by the ApprovalCaseDetailPage the task starts from; else picked from the approval cases., example: 03724352-c0cd-4fa7-ac65-bddf8df0474d }
        rationale: { type: string, source: user, example: Specifications match the supplier datasheet }
        decidedBy: { type: string, source: user, description: "The signed-in reviewer; the reviewer does not type it.", example: Lena Holm }
    command:
      name: ApproveChange
      fields:
        approvalCaseId:
          type: uuid
          source: system
          from: screen.approvalCaseId
          lookup: { view: ApprovalCases, value: approvalCaseId, label: sourceLabel }
        rationale: { type: string, source: system, from: screen.rationale }
        decidedBy: { type: string, source: system, from: screen.decidedBy }
        deciderRiskLevels: { type: string, source: external, from: ReviewerDirectory.ReviewerRoles.riskLevels }
    emits:
      - event: ApprovalCaseApproved
    rules:
      GOV-001:
        title: An approval case is decided once
        description: define/boundaries.md, Catalog Governance invariant 2 ("approval decisions are immutable audit events").
      GOV-006:
        title: A person decides a case only after a reviewer is assigned to it
        description: CJ D1a (2026-10-29).
      GOV-007:
        title: The manager who asked for a change does not review or approve it
        description: CJ D1a (2026-10-29), four eyes.
      GOV-012:
        title: Any person who holds the reviewer role for the case's risk level may decide it
        description: >-
          CJ 2026-10-29, drone-web D-039: only the assigned reviewer was too rigid. The assigned
          reviewer owns the case; a colleague with the same role may decide it too. The roles
          come from the reviewer directory (port ReviewerDirectory), outside this model, and the
          decision records them (deciderRiskLevels).
    errors:
      ApprovalCaseUnknown: { description: No approval case was opened under this id. }
      CaseAlreadyDecided: { description: The case is already approved or rejected., rule: GOV-001 }
      ReviewerNotAssigned: { description: No reviewer is assigned to the case., rule: GOV-006 }
      RequesterCannotApprove: { description: The person approving is the manager who asked for the change., rule: GOV-007 }
      NoReviewerRoleForTheRisk: { description: "The person does not hold the reviewer role for the case's risk level.", rule: GOV-012 }
      AgentReviewPending: { description: The case is low or medium risk and the agent has not answered yet., rule: GOV-008 }
      CaseExpired: { description: The case expired without a decision., rule: GOV-009 }
    tests:
      ApprovesTheVeloxLaunch:
        rules: [GOV-001, GOV-006, GOV-007, GOV-012]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, sourceReferenceId: $velox, requestedChange: active, riskLevel: high, reviewRoute: person, requestedBy: Nora Lund }
          - event: ReviewerAssigned
            values: { approvalCaseId: $launchCase, reviewer: Lena Holm }
        when:
          values: { approvalCaseId: $launchCase, rationale: Specifications match the supplier datasheet, decidedBy: Lena Holm, deciderRiskLevels: "medium, high" }
        then:
          - event: ApprovalCaseApproved
            values: { approvalCaseId: $launchCase, rationale: Specifications match the supplier datasheet, decidedBy: Lena Holm, deciderRiskLevels: "medium, high" }
      AnotherHighRiskReviewerApprovesTheVeloxLaunch:
        rules: [GOV-012]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, sourceReferenceId: $velox, requestedChange: active, riskLevel: high, reviewRoute: person, requestedBy: Nora Lund }
          - event: ReviewerAssigned
            values: { approvalCaseId: $launchCase, reviewer: Lena Holm }
        when:
          values: { approvalCaseId: $launchCase, rationale: Lena is away; datasheet checked, decidedBy: Omar Vik, deciderRiskLevels: "high, critical" }
        then:
          - event: ApprovalCaseApproved
            values: { approvalCaseId: $launchCase, decidedBy: Omar Vik, deciderRiskLevels: "high, critical" }
      ConfirmsTheAgentsRecommendation:
        rules: [GOV-008]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $specCase, changeType: specification-change, riskLevel: medium, reviewRoute: agent-then-person, requestedBy: Nora Lund }
          - event: ChangeRecommendedByAgent
            values: { approvalCaseId: $specCase, verdict: approve }
          - event: ReviewerAssigned
            values: { approvalCaseId: $specCase, reviewer: Lena Holm }
        when:
          values: { approvalCaseId: $specCase, rationale: Agent check confirmed against datasheet rev C, decidedBy: Lena Holm, deciderRiskLevels: "medium, high" }
        then:
          - event: ApprovalCaseApproved
            values: { approvalCaseId: $specCase, decidedBy: Lena Holm }
      DecidesADetailsChangeTheAgentEscalated:
        rules: [GOV-008]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $detailsCase, changeType: details-change, riskLevel: low, reviewRoute: agent, requestedBy: Nora Lund }
          - event: ChangeEscalatedByAgent
            values: { approvalCaseId: $detailsCase, verdict: escalate }
          - event: ReviewerAssigned
            values: { approvalCaseId: $detailsCase, reviewer: Omar Vik }
        when:
          values: { approvalCaseId: $detailsCase, rationale: 8S claim removed from the name before release, decidedBy: Omar Vik, deciderRiskLevels: "low, high, critical" }
        then:
          - event: ApprovalCaseApproved
            values: { approvalCaseId: $detailsCase, decidedBy: Omar Vik }
      RejectsApprovingWithoutAReviewer:
        rules: [GOV-006]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, riskLevel: high, reviewRoute: person, requestedBy: Nora Lund }
        when:
          values: { approvalCaseId: $launchCase, decidedBy: Lena Holm, deciderRiskLevels: "medium, high" }
        then:
          - error: ReviewerNotAssigned
      RejectsTheRequesterApprovingTheirOwnChange:
        rules: [GOV-007]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, riskLevel: high, reviewRoute: person, requestedBy: Nora Lund }
          - event: ReviewerAssigned
            values: { approvalCaseId: $launchCase, reviewer: Lena Holm }
        when:
          values: { approvalCaseId: $launchCase, decidedBy: Nora Lund, deciderRiskLevels: high }
        then:
          - error: RequesterCannotApprove
      RejectsAPersonWithoutTheRoleForTheRisk:
        rules: [GOV-012]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, riskLevel: high, reviewRoute: person, requestedBy: Nora Lund }
          - event: ReviewerAssigned
            values: { approvalCaseId: $launchCase, reviewer: Lena Holm }
        when:
          values: { approvalCaseId: $launchCase, rationale: Looks fine to me, decidedBy: Ida Berg, deciderRiskLevels: <levels> }
        then:
          - error: NoReviewerRoleForTheRisk
        examples:
          - { levels: "low, medium" }
          - { levels: "" }
      RejectsConfirmingBeforeTheAgentAnswered:
        rules: [GOV-008]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $specCase, changeType: specification-change, riskLevel: medium, reviewRoute: agent-then-person, requestedBy: Nora Lund }
          - event: ReviewerAssigned
            values: { approvalCaseId: $specCase, reviewer: Lena Holm }
        when:
          values: { approvalCaseId: $specCase, decidedBy: Lena Holm, deciderRiskLevels: "medium, high" }
        then:
          - error: AgentReviewPending
      RejectsApprovingARejectedCase:
        rules: [GOV-001]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, riskLevel: high, reviewRoute: person, requestedBy: Nora Lund }
          - event: ReviewerAssigned
            values: { approvalCaseId: $launchCase, reviewer: Lena Holm }
          - event: ApprovalCaseRejected
            values: { approvalCaseId: $launchCase, decidedBy: Lena Holm }
        when:
          values: { approvalCaseId: $launchCase, decidedBy: Lena Holm, deciderRiskLevels: "medium, high" }
        then:
          - error: CaseAlreadyDecided
      RejectsApprovingAnExpiredCase:
        rules: [GOV-009]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, riskLevel: high, reviewRoute: person, requestedBy: Nora Lund }
          - event: ReviewerAssigned
            values: { approvalCaseId: $launchCase, reviewer: Lena Holm }
          - event: ApprovalCaseExpired
            values: { approvalCaseId: $launchCase }
        when:
          values: { approvalCaseId: $launchCase, decidedBy: Lena Holm, deciderRiskLevels: "medium, high" }
        then:
          - error: CaseExpired
      RejectsAnUnknownCase:
        when:
          values: { approvalCaseId: $nocase }
        then:
          - error: ApprovalCaseUnknown

  RejectChange:
    pattern: command
    chapter: Review
    description: >-
      A person who holds the reviewer role for the case's risk level rejects the change with a
      rationale (GOV-012), at any point before a decision, also before the agent answered.
      ADDR: recordApprovalDecision(decision=reject).
    screen:
      name: RejectForm
      actor: GovernanceReviewer
      fields:
        approvalCaseId: { type: uuid, source: user, description: Set by the ApprovalCaseDetailPage the task starts from; else picked from the approval cases., example: 03724352-c0cd-4fa7-ac65-bddf8df0474d }
        rationale: { type: string, source: user, example: Datasheet does not state the maximum current }
        decidedBy: { type: string, source: user, description: "The signed-in reviewer; the reviewer does not type it.", example: Lena Holm }
    command:
      name: RejectChange
      fields:
        approvalCaseId:
          type: uuid
          source: system
          from: screen.approvalCaseId
          lookup: { view: ApprovalCases, value: approvalCaseId, label: sourceLabel }
        rationale: { type: string, source: system, from: screen.rationale }
        decidedBy: { type: string, source: system, from: screen.decidedBy }
        deciderRiskLevels: { type: string, source: external, from: ReviewerDirectory.ReviewerRoles.riskLevels }
    emits:
      - event: ApprovalCaseRejected
    errors:
      ApprovalCaseUnknown: { description: No approval case was opened under this id. }
      CaseAlreadyDecided: { description: The case is already approved or rejected., rule: GOV-001 }
      ReviewerNotAssigned: { description: No reviewer is assigned to the case., rule: GOV-006 }
      NoReviewerRoleForTheRisk: { description: "The person does not hold the reviewer role for the case's risk level.", rule: GOV-012 }
      CaseExpired: { description: The case expired without a decision., rule: GOV-009 }
    tests:
      RejectsTheVeloxLaunchForAMissingCurrent:
        rules: [GOV-001, GOV-006, GOV-012]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, changeType: lifecycle-change, sourceReferenceId: $velox, requestedChange: active, riskLevel: high }
          - event: ReviewerAssigned
            values: { approvalCaseId: $launchCase, reviewer: Lena Holm }
        when:
          values: { approvalCaseId: $launchCase, rationale: Datasheet does not state the maximum current, decidedBy: Lena Holm, deciderRiskLevels: "medium, high" }
        then:
          - event: ApprovalCaseRejected
            values: { approvalCaseId: $launchCase, rationale: Datasheet does not state the maximum current, decidedBy: Lena Holm, deciderRiskLevels: "medium, high", changeType: lifecycle-change, sourceReferenceId: $velox, requestedChange: active }
      RejectsRejectingWithoutAReviewer:
        rules: [GOV-006]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, riskLevel: high }
        when:
          values: { approvalCaseId: $launchCase, rationale: Datasheet does not state the maximum current, decidedBy: Lena Holm, deciderRiskLevels: "medium, high" }
        then:
          - error: ReviewerNotAssigned
      RejectsARejectionByAPersonWithoutTheRole:
        rules: [GOV-012]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, riskLevel: high }
          - event: ReviewerAssigned
            values: { approvalCaseId: $launchCase, reviewer: Lena Holm }
        when:
          values: { approvalCaseId: $launchCase, rationale: Not convinced, decidedBy: Ida Berg, deciderRiskLevels: "low, medium" }
        then:
          - error: NoReviewerRoleForTheRisk
      RejectsRejectingAnApprovedCase:
        rules: [GOV-001]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, riskLevel: high }
          - event: ReviewerAssigned
            values: { approvalCaseId: $launchCase, reviewer: Lena Holm }
          - event: ApprovalCaseApproved
            values: { approvalCaseId: $launchCase }
        when:
          values: { approvalCaseId: $launchCase, rationale: Changed my mind, deciderRiskLevels: "medium, high" }
        then:
          - error: CaseAlreadyDecided
      RejectsRejectingAnExpiredCase:
        rules: [GOV-009]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, riskLevel: high }
          - event: ReviewerAssigned
            values: { approvalCaseId: $launchCase, reviewer: Lena Holm }
          - event: ApprovalCaseExpired
            values: { approvalCaseId: $launchCase }
        when:
          values: { approvalCaseId: $launchCase, rationale: Too late, deciderRiskLevels: "medium, high" }
        then:
          - error: CaseExpired
      RejectsAnUnknownCase:
        when:
          values: { approvalCaseId: $nocase }
        then:
          - error: ApprovalCaseUnknown

  ReleaseChange:
    pattern: command
    chapter: Review
    description: >-
      The reviewer releases the publication gate for a change a person approved. A change the agent
      approved needs no release: the agent's approval released its gate (GOV-013). ADDR:
      releasePublicationGate(); PublicationGate resource (locked, released).
    screen:
      name: ReleaseForm
      actor: GovernanceReviewer
      fields:
        approvalCaseId: { type: uuid, source: user, description: Set by the ApprovalCaseDetailPage the task starts from; else picked from the approval cases., example: 03724352-c0cd-4fa7-ac65-bddf8df0474d }
        releasedBy: { type: string, source: user, description: "The signed-in reviewer; the reviewer does not type it.", example: Lena Holm }
    command:
      name: ReleaseChange
      fields:
        approvalCaseId:
          type: uuid
          source: system
          from: screen.approvalCaseId
          lookup: { view: ApprovalCases, value: approvalCaseId, label: sourceLabel }
        releasedBy: { type: string, source: system, from: screen.releasedBy }
    emits:
      - event: PublicationGateReleased
    rules:
      GOV-002:
        title: A change is released only after it is approved
        description: define/boundaries.md, Catalog Governance invariant 1 ("high-risk changes must be approved before publication").
      GOV-003:
        title: A publication gate is released once
        description: Assumed from the gate states locked and released in define/resources.md.
        status: proposed
    errors:
      ApprovalCaseUnknown: { description: No approval case was opened under this id. }
      CaseNotApproved: { description: "The case is pending, rejected or expired.", rule: GOV-002 }
      GateAlreadyReleased: { description: "The gate for this case is already released, by a reviewer or by the agent's approval.", rule: GOV-003 }
    tests:
      ReleasesTheApprovedVeloxLaunch:
        rules: [GOV-002]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, changeType: lifecycle-change, sourceReferenceId: $velox, requestedChange: active }
          - event: ApprovalCaseApproved
            values: { approvalCaseId: $launchCase }
        when:
          values: { approvalCaseId: $launchCase, releasedBy: Lena Holm }
        then:
          - event: PublicationGateReleased
            values: { approvalCaseId: $launchCase, releasedBy: Lena Holm, changeType: lifecycle-change, sourceReferenceId: $velox, requestedChange: active }
      RejectsReleasingAGateTheAgentReleased:
        rules: [GOV-003, GOV-013]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $detailsCase, changeType: details-change, sourceReferenceId: $velox, requestedChange: "Short description: 6S 5-inch freestyle" }
          - event: ChangeApprovedByAgent
            values: { approvalCaseId: $detailsCase, verdict: approve }
        when:
          values: { approvalCaseId: $detailsCase, releasedBy: Lena Holm }
        then:
          - error: GateAlreadyReleased
      RejectsReleasingAPendingCase:
        rules: [GOV-002]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase }
        when:
          values: { approvalCaseId: $launchCase }
        then:
          - error: CaseNotApproved
      RejectsReleasingARejectedCase:
        rules: [GOV-002]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase }
          - event: ApprovalCaseRejected
            values: { approvalCaseId: $launchCase }
        when:
          values: { approvalCaseId: $launchCase }
        then:
          - error: CaseNotApproved
      RejectsReleasingOnTheAgentsRecommendationAlone:
        rules: [GOV-002, GOV-008]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $specCase, changeType: specification-change, riskLevel: medium }
          - event: ChangeRecommendedByAgent
            values: { approvalCaseId: $specCase, verdict: approve }
        when:
          values: { approvalCaseId: $specCase }
        then:
          - error: CaseNotApproved
      RejectsReleasingTwice:
        rules: [GOV-003]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase }
          - event: ApprovalCaseApproved
            values: { approvalCaseId: $launchCase }
          - event: PublicationGateReleased
            values: { approvalCaseId: $launchCase }
        when:
          values: { approvalCaseId: $launchCase }
        then:
          - error: GateAlreadyReleased
      RejectsAnUnknownCase:
        when:
          values: { approvalCaseId: $nocase }
        then:
          - error: ApprovalCaseUnknown

  AnnounceRelease:
    pattern: automation
    chapter: Review
    description: >-
      Governance tells the owning context of each released change, once: a gate a reviewer
      released (PublicationGateReleased) or a gate the agent's approval released
      (ChangeApprovedByAgent). Catalog Governance publishes ChangeReleased from this one event, so
      Product Data has one release to listen to. A case whose gate is still locked stays on the
      list; a rejection or an expiry removes it. Why a slice of its own: Kairos lets one slice
      record an event (K13) and a message come from one event, so two ways to release meet here
      (drone-web D-039).
    views:
      - list-view:
          name: ReleasesToAnnounce
          identity: approvalCaseId
          reads:
            ApprovalCaseSubmitted: create
            PublicationGateReleased: update
            ChangeApprovedByAgent: update
            ApprovalCaseRejected: remove
            ApprovalCaseExpired: remove
            ChangeReleaseAnnounced: remove
          fields:
            approvalCaseId: { type: uuid, source: system, from: ApprovalCaseSubmitted.approvalCaseId }
            changeType: { type: string, source: system, from: ApprovalCaseSubmitted.changeType }
            sourceReferenceId: { type: uuid, source: system, from: ApprovalCaseSubmitted.sourceReferenceId }
            requestedChange: { type: string, source: system, from: ApprovalCaseSubmitted.requestedChange }
            gate:
              type: string
              source: generated
              description: "locked; released after PublicationGateReleased or ChangeApprovedByAgent."
              example: locked
            releasedBy:
              type: string
              source: generated
              optional: true
              description: "The reviewer who released the gate, or review agent after an agent approval; null while the gate is locked."
              example: Lena Holm
    processor:
      name: ReleaseAnnouncer
      lane: Announcer
    command:
      name: AnnounceRelease
      fields:
        approvalCaseId: { type: uuid, source: system, from: ReleasesToAnnounce.approvalCaseId }
        releasedBy: { type: string, source: system, from: ReleasesToAnnounce.releasedBy }
    emits:
      - event: ChangeReleaseAnnounced
    tests:
      AnnouncesTheVeloxLaunchAReviewerReleased:
        rules: [GOV-002]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, changeType: lifecycle-change, sourceReferenceId: $velox, requestedChange: active }
          - event: ApprovalCaseApproved
            values: { approvalCaseId: $launchCase, decidedBy: Lena Holm }
          - event: PublicationGateReleased
            values: { approvalCaseId: $launchCase, releasedBy: Lena Holm }
        then:
          - event: ChangeReleaseAnnounced
            values: { approvalCaseId: $launchCase, changeType: lifecycle-change, sourceReferenceId: $velox, requestedChange: active, releasedBy: Lena Holm }
      AnnouncesADetailsChangeTheAgentApproved:
        rules: [GOV-013]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $detailsCase, changeType: details-change, sourceReferenceId: $velox, requestedChange: "Short description (none) to 6S 5-inch freestyle" }
          - event: AgentReviewRequested
            values: { approvalCaseId: $detailsCase }
          - event: ChangeApprovedByAgent
            values: { approvalCaseId: $detailsCase, verdict: approve }
        then:
          - event: ChangeReleaseAnnounced
            values: { approvalCaseId: $detailsCase, changeType: details-change, sourceReferenceId: $velox, requestedChange: "Short description (none) to 6S 5-inch freestyle", releasedBy: review agent }
      LeavesALockedGateAlone:
        rules: [GOV-002]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $specCase, changeType: specification-change, riskLevel: medium }
          - event: ChangeRecommendedByAgent
            values: { approvalCaseId: $specCase, verdict: approve }
          - event: ApprovalCaseApproved
            values: { approvalCaseId: $specCase }
        then: []
      AnnouncesOnce:
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase, changeType: lifecycle-change, sourceReferenceId: $velox }
          - event: ApprovalCaseApproved
            values: { approvalCaseId: $launchCase }
          - event: PublicationGateReleased
            values: { approvalCaseId: $launchCase }
          - event: ChangeReleaseAnnounced
            values: { approvalCaseId: $launchCase, sourceReferenceId: $velox }
        then: []

  ExpireUndecidedCase:
    pattern: automation
    chapter: Review
    description: >-
      A case that nobody approves or rejects within the review period expires (CJ D10b). An agent
      recommendation or escalation is not a decision. Catalog Governance publishes ChangeExpired.
      The period is 14 days (proposed, GOV-010).
    views:
      - list-view:
          name: UndecidedCases
          identity: approvalCaseId
          reads:
            ApprovalCaseSubmitted: create
            ChangeApprovedByAgent: remove
            ApprovalCaseApproved: remove
            ApprovalCaseRejected: remove
            ApprovalCaseExpired: remove
          fields:
            approvalCaseId: { type: uuid, source: system, from: ApprovalCaseSubmitted.approvalCaseId }
            submittedAt: { type: datetime, source: system, from: ApprovalCaseSubmitted.submittedAt }
            expiresAt: { type: datetime, source: system, from: ApprovalCaseSubmitted.expiresAt }
    processor:
      name: CaseExpiryClock
      lane: ReviewClock
      trigger: { after: expiresAt }
    command:
      name: ExpireApprovalCase
      fields:
        approvalCaseId: { type: uuid, source: system, from: UndecidedCases.approvalCaseId }
    emits:
      - event: ApprovalCaseExpired
    rules:
      GOV-009:
        title: An approval case that nobody decides within the review period expires
        description: CJ D10b (2026-10-29). define/boundaries.md and define/resources.md list the status expired.
      GOV-010:
        title: The review period is 14 days
        description: Our proposal for N; CJ named no number.
        status: proposed
    tests:
      ExpiresTheUndecidedF405Launch:
        rules: [GOV-009, GOV-010]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $f405Case, changeType: lifecycle-change, sourceReferenceId: $f405, requestedChange: active, submittedAt: 2026-11-02T10:05:00Z }
        then:
          - event: ApprovalCaseExpired
            values: { approvalCaseId: $f405Case, changeType: lifecycle-change, sourceReferenceId: $f405, requestedChange: active }
      ExpiresACaseTheAgentOnlyRecommended:
        rules: [GOV-009]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $specCase, changeType: specification-change, riskLevel: medium }
          - event: ChangeRecommendedByAgent
            values: { approvalCaseId: $specCase, verdict: approve }
        then:
          - event: ApprovalCaseExpired
            values: { approvalCaseId: $specCase }
      LeavesADecidedCaseAlone:
        rules: [GOV-009]
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $launchCase }
          - event: ApprovalCaseApproved
            values: { approvalCaseId: $launchCase }
        then: []
      ExpiresOnce:
        given:
          - event: ApprovalCaseSubmitted
            values: { approvalCaseId: $f405Case }
          - event: ApprovalCaseExpired
            values: { approvalCaseId: $f405Case }
        then: []

  # ================================================================== Publish

  ClearProductChange:
    pattern: translation
    chapter: Publish
    description: >-
      Product Data learns that Governance released a change to one of its products: a lifecycle,
      specification or details change. Releases of other change types (pricing, rules, imports)
      are not for Product Data.
    message: CatalogGovernance.ChangeReleased
    processor:
      name: ReleaseListener
      lane: Integration
    command:
      name: ClearProductChange
      fields:
        approvalCaseId: { type: uuid, source: system, from: message.approvalCaseId }
        changeType: { type: string, source: system, from: message.changeType }
        productId: { type: uuid, source: system, from: message.sourceReferenceId }
        requestedChange: { type: string, source: system, from: message.requestedChange }
    emits:
      - event: ProductChangeCleared
    tests:
      ClearsTheVeloxLaunch:
        given:
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: active, requestedChange: active }
        when:
          values: { approvalCaseId: $launchCase, changeType: lifecycle-change, sourceReferenceId: $velox, requestedChange: active }
        then:
          - event: ProductChangeCleared
            values: { productId: $velox, changeType: lifecycle-change, requestedChange: active, approvalCaseId: $launchCase }
      ClearsASpecificationChange:
        given:
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: specification-change, requestedChange: "maxCurrent 41.5 A to 38.0 A (datasheet rev C)" }
        when:
          values: { approvalCaseId: $specCase, changeType: specification-change, sourceReferenceId: $velox, requestedChange: "maxCurrent 41.5 A to 38.0 A (datasheet rev C)" }
        then:
          - event: ProductChangeCleared
            values: { productId: $velox, changeType: specification-change, approvalCaseId: $specCase }
      IgnoresAReleaseOfAnotherChangeType:
        given:
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: active, requestedChange: active }
        when:
          values: { approvalCaseId: $priceCase, changeType: pricing-change, sourceReferenceId: $velox, requestedChange: active }
        then: []
      IgnoresAReleaseItAlreadyRecorded:
        given:
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: active, requestedChange: active }
          - event: ProductChangeCleared
            values: { productId: $velox, changeType: lifecycle-change, requestedChange: active, approvalCaseId: $launchCase }
        when:
          values: { approvalCaseId: $launchCase, changeType: lifecycle-change, sourceReferenceId: $velox, requestedChange: active }
        then: []
      IgnoresAReleaseForAProductNobodyAskedAbout:
        when:
          values: { approvalCaseId: $launchCase, changeType: lifecycle-change, sourceReferenceId: $nobody, requestedChange: active }
        then: []

  RecordRefusedProductChange:
    pattern: translation
    chapter: Publish
    description: >-
      Product Data learns that Governance rejected a change. The product keeps its state and the
      manager may ask again (proposed: ADDR does not say what a rejection does to the product).
    message: CatalogGovernance.ChangeRejected
    processor:
      name: RejectionListener
      lane: Integration
    command:
      name: RecordRefusedProductChange
      fields:
        approvalCaseId: { type: uuid, source: system, from: message.approvalCaseId }
        changeType: { type: string, source: system, from: message.changeType }
        productId: { type: uuid, source: system, from: message.sourceReferenceId }
        requestedChange: { type: string, source: system, from: message.requestedChange }
        rationale: { type: string, source: system, from: message.rationale }
    emits:
      - event: ProductChangeRefused
    tests:
      RecordsThatTheVeloxLaunchWasRefused:
        given:
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: active, requestedChange: active }
        when:
          values: { approvalCaseId: $launchCase, changeType: lifecycle-change, sourceReferenceId: $velox, requestedChange: active, rationale: Datasheet does not state the maximum current }
        then:
          - event: ProductChangeRefused
            values: { productId: $velox, changeType: lifecycle-change, requestedChange: active, approvalCaseId: $launchCase, rationale: Datasheet does not state the maximum current }
      IgnoresARejectionOfAnotherChangeType:
        given:
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: active, requestedChange: active }
        when:
          values: { approvalCaseId: $priceCase, changeType: pricing-change, sourceReferenceId: $velox, requestedChange: active, rationale: Margin too low }
        then: []
      IgnoresARejectionItAlreadyRecorded:
        given:
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: active, requestedChange: active }
          - event: ProductChangeRefused
            values: { productId: $velox, changeType: lifecycle-change, requestedChange: active, approvalCaseId: $launchCase }
        when:
          values: { approvalCaseId: $launchCase, changeType: lifecycle-change, sourceReferenceId: $velox, requestedChange: active, rationale: Datasheet does not state the maximum current }
        then: []
      IgnoresARejectionForAProductNobodyAskedAbout:
        when:
          values: { approvalCaseId: $launchCase, changeType: lifecycle-change, sourceReferenceId: $nobody, requestedChange: active, rationale: Datasheet does not state the maximum current }
        then: []

  RecordExpiredProductChange:
    pattern: translation
    chapter: Publish
    description: >-
      Product Data learns that Governance let a change expire. The product keeps its state, the
      request is closed, and the manager may ask again (CJ D10b).
    message: CatalogGovernance.ChangeExpired
    processor:
      name: ExpiryListener
      lane: Integration
    command:
      name: RecordExpiredProductChange
      fields:
        approvalCaseId: { type: uuid, source: system, from: message.approvalCaseId }
        changeType: { type: string, source: system, from: message.changeType }
        productId: { type: uuid, source: system, from: message.sourceReferenceId }
        requestedChange: { type: string, source: system, from: message.requestedChange }
    emits:
      - event: ProductChangeExpired
    tests:
      RecordsThatTheF405LaunchExpired:
        given:
          - event: ProductChangeRequested
            values: { productId: $f405, changeType: lifecycle-change, targetState: active, requestedChange: active }
        when:
          values: { approvalCaseId: $f405Case, changeType: lifecycle-change, sourceReferenceId: $f405, requestedChange: active }
        then:
          - event: ProductChangeExpired
            values: { productId: $f405, changeType: lifecycle-change, requestedChange: active, approvalCaseId: $f405Case }
      IgnoresAnExpiryOfAnotherChangeType:
        given:
          - event: ProductChangeRequested
            values: { productId: $f405, changeType: lifecycle-change, targetState: active, requestedChange: active }
        when:
          values: { approvalCaseId: $priceCase, changeType: pricing-change, sourceReferenceId: $f405, requestedChange: active }
        then: []
      IgnoresAnExpiryItAlreadyRecorded:
        given:
          - event: ProductChangeRequested
            values: { productId: $f405, changeType: lifecycle-change, targetState: active, requestedChange: active }
          - event: ProductChangeExpired
            values: { productId: $f405, changeType: lifecycle-change, requestedChange: active, approvalCaseId: $f405Case }
        when:
          values: { approvalCaseId: $f405Case, changeType: lifecycle-change, sourceReferenceId: $f405, requestedChange: active }
        then: []
      IgnoresAnExpiryForAProductNobodyAskedAbout:
        when:
          values: { approvalCaseId: $f405Case, changeType: lifecycle-change, sourceReferenceId: $nobody, requestedChange: active }
        then: []

  PublishProduct:
    pattern: command
    chapter: Publish
    description: >-
      After the release, the manager makes the product active (CJ D6a); the product-records stream
      then carries it to the shop. ADDR: sequence diagram JS1, the effect of
      setProductLifecycleState(targetState=active) after releasePublicationGate().
    screen:
      name: PublishProductForm
      actor: ProductLifecycleManager
      fields:
        productId: { type: uuid, source: user, description: Set by the ProductDetailPage the task starts from; else picked from the products under management., example: 6a1f3c2e-4b5d-4e8f-9a0b-1c2d3e4f5a61 }
    command:
      name: PublishProduct
      fields:
        productId:
          type: uuid
          source: system
          from: screen.productId
          lookup: { view: ProductsUnderManagement, value: productId, label: name }
    emits:
      - event: ProductPublished
    rules:
      PLC-007:
        title: A lifecycle change takes effect only after Governance released it
        description: >-
          define/boundaries.md, Catalog Governance invariant 1 and pitfall "approval bypass";
          drone-web D-037 and galaxitech-website D-038 ("approval happens before the owner
          publishes"). One release allows one change.
    errors:
      ProductUnknown: { description: No product was drafted under this id. }
      NotClearedForRelease: { description: No released approval waits for this product to go active., rule: PLC-007 }
    tests:
      PublishesTheVeloxAfterTheRelease:
        rules: [PLC-007]
        given:
          - event: ProductDrafted
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, name: T-Motor Velox V2306 1750KV, brand: T-Motor }
          - event: ProductChangeCleared
            values: { productId: $velox, changeType: lifecycle-change, requestedChange: active, approvalCaseId: $launchCase }
        when:
          values: { productId: $velox }
        then:
          - event: ProductPublished
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, name: T-Motor Velox V2306 1750KV, brand: T-Motor, approvalCaseId: $launchCase }
      RejectsPublishingBeforeTheRelease:
        rules: [PLC-007]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: active, requestedChange: active }
        when:
          values: { productId: $velox }
        then:
          - error: NotClearedForRelease
      RejectsPublishingOnASpecificationRelease:
        rules: [PLC-007]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductChangeCleared
            values: { productId: $velox, changeType: specification-change, requestedChange: "maxCurrent 41.5 A to 38.0 A", approvalCaseId: $specCase }
        when:
          values: { productId: $velox }
        then:
          - error: NotClearedForRelease
      RejectsPublishingTwiceOnOneRelease:
        rules: [PLC-007]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductChangeCleared
            values: { productId: $velox, changeType: lifecycle-change, requestedChange: active, approvalCaseId: $launchCase }
          - event: ProductPublished
            values: { productId: $velox, approvalCaseId: $launchCase }
        when:
          values: { productId: $velox }
        then:
          - error: NotClearedForRelease
      RejectsPublishingAnUnknownProduct:
        when:
          values: { productId: $nobody }
        then:
          - error: ProductUnknown

  FeedProductRecords:
    pattern: query
    chapter: Publish
    description: >-
      The record of each published product, as the product-records stream carries it
      (ProductRecordChanged). A row appears when the product goes live, so drafts never reach the
      stream (CJ D5a; galaxitech-website D-038: consumers never see unapproved facts). No person
      reads this view; the ordering model does, through the stream.
    views:
      - list-view:
          name: ProductRecords
          identity: productId
          reads:
            ProductPublished: create
            ProductDetailsRevised: update
            ProductDiscontinued: update
            ReplacementProductLinked: update
          fields:
            productId: { type: uuid, source: system, from: ProductPublished.productId, example: 6a1f3c2e-4b5d-4e8f-9a0b-1c2d3e4f5a61 }
            sku: { type: string, source: system, from: ProductPublished.sku }
            brand: { type: string, source: system, from: ProductPublished.brand }
            name:
              type: string
              source: generated
              description: The name at publication, or from the latest revision of the details.
              example: T-Motor Velox V2306 1750KV
            lifecycleState:
              type: string
              source: generated
              description: "active; discontinued after ProductDiscontinued. Never draft."
              example: active
            replacementProductId: { type: uuid, source: system, from: ReplacementProductLinked.replacementProductId, optional: true }
    tests:
      CarriesOnlyPublishedProducts:
        given:
          - event: ProductPublished
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, name: T-Motor Velox V2306 1750KV, brand: T-Motor }
          - event: ProductDetailsRevised
            values: { productId: $f405, name: SpeedyBee F405 V4 FC, shortDescription: 30x30 flight controller for 5-inch builds }
        then:
          - view: ProductRecords
            rows:
              - { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, brand: T-Motor, name: T-Motor Velox V2306 1750KV, lifecycleState: active, replacementProductId: null }
      FollowsTheVeloxToItsSuccessor:
        given:
          - event: ProductPublished
            values: { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, name: T-Motor Velox V2306 1750KV, brand: T-Motor }
          - event: ProductDetailsRevised
            values: { productId: $velox, name: T-Motor Velox V2306 V2 1750KV }
          - event: ProductDiscontinued
            values: { productId: $velox }
          - event: ReplacementProductLinked
            values: { productId: $velox, replacementProductId: $velox3 }
        then:
          - view: ProductRecords
            rows:
              - { productId: $velox, sku: TMOTOR-VELOX-V2306-1750KV, brand: T-Motor, name: T-Motor Velox V2306 V2 1750KV, lifecycleState: discontinued, replacementProductId: $velox3 }

  # ================================================================== Change

  ReviseProductDetails:
    pattern: command
    chapter: Change
    description: >-
      The manager changes the name or the short description of a product. On a draft or a
      discontinued product (CJ D4a) the change applies at once. On an active product it applies only
      after Governance released a details change (CJ D3b), and only with the name and short
      description of that released request (PLC-012, drone-web D-039). Specifications change
      through RecordSpecifications. ADDR: JS1 "Update product core attributes"; updateProductAttributes().
    screen:
      name: ProductDetailsForm
      actor: ProductLifecycleManager
      fields:
        productId: { type: uuid, source: user, description: Set by the ProductDetailPage the task starts from; else picked from the products under management., example: 6a1f3c2e-4b5d-4e8f-9a0b-1c2d3e4f5a61 }
        name: { type: string, source: user, example: T-Motor Velox V2306 V2 1750KV }
        shortDescription: { type: string, source: user, example: 2306 motor for 6S 5-inch freestyle builds }
    command:
      name: ReviseProductDetails
      fields:
        productId:
          type: uuid
          source: system
          from: screen.productId
          lookup: { view: ProductsUnderManagement, value: productId, label: name }
        name: { type: string, source: system, from: screen.name }
        shortDescription: { type: string, source: system, from: screen.shortDescription }
    emits:
      - event: ProductDetailsRevised
    errors:
      ProductUnknown: { description: No product was drafted under this id. }
      ChangeNotReleased: { description: The product is active and no released details change waits for it., rule: PLC-009 }
      ValuesDifferFromTheApprovedOnes: { description: "The product is active and the details differ from the new values in the released request.", rule: PLC-012 }
    tests:
      RenamesTheVeloxDraft:
        given:
          - event: ProductDrafted
            values: { productId: $velox, name: T-Motor Velox V2306 1750KV }
        when:
          values: { productId: $velox, name: T-Motor Velox V2306 1750KV Freestyle, shortDescription: 2306 motor for 6S 5-inch freestyle builds }
        then:
          - event: ProductDetailsRevised
            values: { productId: $velox, name: T-Motor Velox V2306 1750KV Freestyle, approvalCaseId: null }
      RenamesTheActiveVeloxAfterTheRelease:
        rules: [PLC-009, PLC-012]
        given:
          - event: ProductDrafted
            values: { productId: $velox, name: T-Motor Velox V2306 1750KV }
          - event: ProductPublished
            values: { productId: $velox }
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: details-change, newName: T-Motor Velox V2306 V2 1750KV, newShortDescription: 2306 motor for 6S 5-inch freestyle builds, requestedChange: "Name T-Motor Velox V2306 1750KV to T-Motor Velox V2306 V2 1750KV; short description (none) to 2306 motor for 6S 5-inch freestyle builds" }
          - event: ProductChangeCleared
            values: { productId: $velox, changeType: details-change, requestedChange: "Name T-Motor Velox V2306 1750KV to T-Motor Velox V2306 V2 1750KV; short description (none) to 2306 motor for 6S 5-inch freestyle builds", approvalCaseId: $detailsCase }
        when:
          values: { productId: $velox, name: T-Motor Velox V2306 V2 1750KV, shortDescription: 2306 motor for 6S 5-inch freestyle builds }
        then:
          - event: ProductDetailsRevised
            values: { productId: $velox, name: T-Motor Velox V2306 V2 1750KV, shortDescription: 2306 motor for 6S 5-inch freestyle builds, approvalCaseId: $detailsCase }
      RejectsANameOtherThanTheApprovedOne:
        rules: [PLC-012]
        given:
          - event: ProductDrafted
            values: { productId: $velox, name: T-Motor Velox V2306 1750KV }
          - event: ProductPublished
            values: { productId: $velox }
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: details-change, newName: T-Motor Velox V2306 V2 1750KV, newShortDescription: 2306 motor for 6S 5-inch freestyle builds }
          - event: ProductChangeCleared
            values: { productId: $velox, changeType: details-change, approvalCaseId: $detailsCase }
        when:
          values: { productId: $velox, name: T-Motor Velox V2306 V2 1750KV 8S, shortDescription: 2306 motor for 6S 5-inch freestyle builds }
        then:
          - error: ValuesDifferFromTheApprovedOnes
      RejectsRenamingAnActiveProductWithoutARelease:
        rules: [PLC-009]
        given:
          - event: ProductDrafted
            values: { productId: $velox, name: T-Motor Velox V2306 1750KV }
          - event: ProductPublished
            values: { productId: $velox }
        when:
          values: { productId: $velox, name: T-Motor Velox V2306 V2 1750KV }
        then:
          - error: ChangeNotReleased
      CorrectsTheDescriptionOfADiscontinuedProduct:
        rules: [PLC-010]
        given:
          - event: ProductDrafted
            values: { productId: $velox, name: T-Motor Velox V2306 V2 1750KV }
          - event: ProductPublished
            values: { productId: $velox }
          - event: ProductDiscontinued
            values: { productId: $velox }
        when:
          values: { productId: $velox, name: T-Motor Velox V2306 V2 1750KV, shortDescription: Discontinued; see the V3 1950KV }
        then:
          - event: ProductDetailsRevised
            values: { productId: $velox, shortDescription: Discontinued; see the V3 1950KV, approvalCaseId: null }
      RejectsRevisingAnUnknownProduct:
        when:
          values: { productId: $nobody, name: Ghost motor }
        then:
          - error: ProductUnknown

  # ================================================================== Retire

  DiscontinueProduct:
    pattern: command
    chapter: Retire
    description: >-
      After Governance released the discontinuation, the manager discontinues the product. It
      stays in the catalog as discontinued. ADDR: JS1 "Mark product as discontinued";
      discontinueProduct(), the effect after the release (CJ D7a); the request was
      setProductLifecycleState(targetState=discontinued).
    screen:
      name: DiscontinueProductForm
      actor: ProductLifecycleManager
      fields:
        productId: { type: uuid, source: user, description: Set by the ProductDetailPage the task starts from; else picked from the products under management., example: 6a1f3c2e-4b5d-4e8f-9a0b-1c2d3e4f5a61 }
    command:
      name: DiscontinueProduct
      fields:
        productId:
          type: uuid
          source: system
          from: screen.productId
          lookup: { view: ProductsUnderManagement, value: productId, label: name }
    emits:
      - event: ProductDiscontinued
    errors:
      ProductUnknown: { description: No product was drafted under this id. }
      NotClearedForRelease: { description: No released approval waits for this product to be discontinued., rule: PLC-007 }
    tests:
      DiscontinuesTheVeloxAfterTheRelease:
        rules: [PLC-007]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductPublished
            values: { productId: $velox }
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: discontinued, requestedChange: discontinued, reason: Replaced by the V3 1950KV }
          - event: ProductChangeCleared
            values: { productId: $velox, changeType: lifecycle-change, requestedChange: discontinued, approvalCaseId: $retireCase }
        when:
          values: { productId: $velox }
        then:
          - event: ProductDiscontinued
            values: { productId: $velox, reason: Replaced by the V3 1950KV, approvalCaseId: $retireCase }
      RejectsDiscontinuingBeforeTheRelease:
        rules: [PLC-007]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductPublished
            values: { productId: $velox }
          - event: ProductChangeRequested
            values: { productId: $velox, changeType: lifecycle-change, targetState: discontinued, requestedChange: discontinued }
        when:
          values: { productId: $velox }
        then:
          - error: NotClearedForRelease
      RejectsDiscontinuingOnAReleaseToGoActive:
        rules: [PLC-007]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductChangeCleared
            values: { productId: $velox, changeType: lifecycle-change, requestedChange: active, approvalCaseId: $launchCase }
        when:
          values: { productId: $velox }
        then:
          - error: NotClearedForRelease
      RejectsDiscontinuingAnUnknownProduct:
        when:
          values: { productId: $nobody }
        then:
          - error: ProductUnknown

  LinkReplacementProduct:
    pattern: command
    chapter: Retire
    description: >-
      The manager names the product that replaces a discontinued one, so the shop can point
      buyers to it. ADDR: JS1 "Link replacement product"; linkReplacementProduct().
    screen:
      name: ReplacementForm
      actor: ProductLifecycleManager
      fields:
        productId: { type: uuid, source: user, description: "The discontinued product, set by the ProductDetailPage the task starts from; else picked from the products under management.", example: 6a1f3c2e-4b5d-4e8f-9a0b-1c2d3e4f5a61 }
        replacementProductId: { type: uuid, source: user, description: "The successor, picked from the products under management.", example: 9b2e4d6f-1a3c-4e5b-8d7f-2a4c6e8b0d13 }
        reasonCode: { type: string, source: user, example: successor-model }
    command:
      name: LinkReplacementProduct
      fields:
        productId:
          type: uuid
          source: system
          from: screen.productId
          lookup: { view: ProductsUnderManagement, value: productId, label: name }
        replacementProductId:
          type: uuid
          source: system
          from: screen.replacementProductId
          lookup: { view: ProductsUnderManagement, value: productId, label: name }
        reasonCode: { type: string, source: system, from: screen.reasonCode }
    emits:
      - event: ReplacementProductLinked
    rules:
      PLC-008:
        title: Only a discontinued product gets a replacement
        description: define/api-profiles.md, linkReplacementProduct() "for discontinued item".
      PLC-011:
        title: The replacement product exists and is active
        description: >-
          CJ D8a (2026-10-29). Not checked yet: the decision would have to load the replacement
          product under the field name replacementProductId, which Kairos check K27 does not allow.
          The test LinksTheV3AsTheVeloxSuccessor names the rule but
          cannot show the replacement's state.
        status: proposed
    errors:
      ProductUnknown: { description: No product was drafted under this id. }
      ProductNotDiscontinued: { description: The product is still draft or active., rule: PLC-008 }
    tests:
      LinksTheV3AsTheVeloxSuccessor:
        rules: [PLC-008, PLC-011]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductDiscontinued
            values: { productId: $velox }
        when:
          values: { productId: $velox, replacementProductId: $velox3, reasonCode: successor-model }
        then:
          - event: ReplacementProductLinked
            values: { productId: $velox, replacementProductId: $velox3, reasonCode: successor-model }
      RejectsAReplacementForAnActiveProduct:
        rules: [PLC-008]
        given:
          - event: ProductDrafted
            values: { productId: $velox }
          - event: ProductPublished
            values: { productId: $velox }
        when:
          values: { productId: $velox, replacementProductId: $velox3 }
        then:
          - error: ProductNotDiscontinued
      RejectsAReplacementForAnUnknownProduct:
        when:
          values: { productId: $nobody, replacementProductId: $velox3 }
        then:
          - error: ProductUnknown
