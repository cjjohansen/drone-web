# DRAFT: NO ADDR YET. No ADDR run covers ordering: the storefront ADDR covers the read flows and
# stops at "[to cart/checkout]". This model came before its ADDR work. Keep it as a draft until an
# ADDR run for ordering exists; the showcase model is a catalog-management-v2 flow
# (galaxitech-website-498).
#
# Drone Web: a customer orders a drone on a phone and follows the delivery.
# Written with the kairos-author skill of event-model-factory (bead galaxitech-website-5yv).
# CJ's answers to the open questions applied 2026-10-28 (bead galaxitech-website-ocj).
#
# The flow in words (chosen by CJ, 2026-10-28):
#
#   A customer opens the Drone Web app on a phone, picks a drone from the list of drones for sale,
#   and places an order for it with a quantity and a delivery address. The customer then pays for
#   the order. The payment provider tells Drone Web whether the payment went through or was
#   declined. The customer follows the order in a list of their orders and on a status screen.
#   The warehouse ships a paid order and tells Drone Web which carrier has it and under which
#   tracking number; the carrier later tells Drone Web that the parcel was delivered. When the
#   order ships and when it is delivered, the customer gets a push notification on the phone.
#
# CJ's answers (2026-10-28):
#
#   - The amount to pay comes from the order's own events (OrderPlaced), not from a view.
#   - When the provider captures an amount different from the order total, Ordering records the
#     payment and flags the difference for a person to check. It does not refuse the payment.
#     Realistic causes: split shipments, currency rounding, bugs or tampering.
#   - A price that arrives before the product record is kept and matched to the drone when the
#     record arrives.
#   - When the provider declines a payment, the customer gets a push notification.
#   - Ordering refuses a shipment for an order that is not paid. Since 2026-10-29 (C2c) this
#     means not released to the warehouse, so a held, underpaid order is refused as well.
#   - Rule ORD-003 (one to five drones per app order) is dropped; its id is not reused. Realistic
#     order rules are researched in galaxitech-website-9x0.
#
# CJ's answers (2026-10-29):
#
#   - A mismatched payment goes to the warehouse only when the captured amount is at least the
#     order total. An underpaid order is held; an overpaid order ships. How the surplus is
#     refunded is an open question. Rule ORD-007 on RecordCapturedPayment, proposed.
#   - Whether a row ever leaves the staff list PaymentMismatches stays open until ordering has ADDR.
#   - PayForOrder stays as it is. Its 3 F6 warnings stay until galaxitech-website-nzd is done
#     (reminder bead galaxitech-website-8za).
#   - PaymentStarted mints Drone Web's own paymentId (uuid). The provider's id is the ordinary
#     field providerPaymentId, never a tag (K29). StartPayment sends paymentId as metadata, so the
#     webhooks name the payment by Drone Web's id (galaxitech-website-bqq, 2026-10-30).
#
# Where the pieces come from in drone-web:
#
#   - Ordering is a new bounded context. No ADDR run covers it yet (strategy P4 asks for one),
#     so this model is a draft.
#   - Product names and lifecycle states arrive on the published stream `product-records`
#     (ProductRecordChanged), prices on `effective-prices` (EffectivePriceChanged); see
#     design/contracts/ and decision D-037. Ordering keeps its own copy (strategy P3: no
#     synchronous calls between boundaries). `product-records` carries no drafts (CJ D5a,
#     2026-10-29, galaxitech-website-498): a product appears on it only when it goes live, so
#     Ordering sees only active and discontinued products.
#   - Payment is bought, and card data never reaches Drone Web (strategy P1, "Payment and
#     checkout"). The provider is reached through a port and answers through webhooks.
#   - Drone Web builds no warehouse system (strategy P1, Inventory). The warehouse and the
#     carrier are outside systems; Ordering only hears what they publish.
#
# Mobile-friendly by design: one command per screen with at most three fields, list, status and
# detail views instead of tables, and two events (OrderShipped, OrderDelivered) that automations
# turn into push notifications.
#
# Not expressible in Kairos v0 yet, filed as gaps in event-model-factory and noted where they
# apply: commands made offline and sent later, and the signed-in customer as the source of a
# value and as the filter of "my" rows.
#
# Views per entity (CJ's rule, 2026-10-29: every entity the events are about gets a list view and
# a detail view unless a reason is recorded). The entities follow from the event tags:
#
#   - Drone (productId): list DronesForSale (BrowseDrones), detail DroneDetails (ViewDrone).
#   - Order (orderId): list MyOrders (ListMyOrders), detail OrderStatus (TrackOrder).
#   - Payment (paymentId): list Payments (ListPayments), detail PaymentDetails (ViewPayment). For
#     the order desk only; the customer sees a payment as the status of the order.
#   - Payment mismatch (paymentId): list PaymentMismatches (CheckPaymentMismatches); its detail is
#     PaymentDetails, because a mismatch is a fact about one payment.
#   - Shipment (trackingNumber): no own views. One order has one parcel here, and the order views
#     show the carrier, the tracking number and the dates. See the README.
#
# ORD-001, ORD-002, ORD-004 and ORD-005 are confirmed by CJ (2026-10-28). ORD-006 is confirmed
# in its wider form, which also refuses a held order (2026-10-29). ORD-007 is
# `status: proposed`: CJ gave it on 2026-10-29, and ordering has no ADDR yet.

kairos: "0"
model: OrderAndTrack
description: "Draft: no ADDR yet. A customer orders a drone on a phone, pays for it, and follows it until it is delivered, with a push notification when the payment is declined, when it ships and when it arrives."

automations:
  Integration:
    description: Takes in what other systems publish.
  Notifications:
    description: Sends push notifications to the customer's phone.

actors:
  Customer:
    description: A person who buys a drone on the Drone Web app, such as a Professional Integrator or a Casual Browser.
  OrderDesk:
    description: A Drone Web staff member who checks payments that do not match their order.

contexts:
  Ordering:
    description: Orders of drones, from placing the order until the drone is delivered.
    publishes:
      PaidOrder:
        version: 1
        description: An order is paid in full, or more, and the warehouse can ship it.
        from: OrderReleasedToWarehouse
        fields:
          orderId: uuid
          productId: uuid
          quantity: int
          deliveryAddress: string

  ProductData:
    foreign: true
    description: Product Lifecycle Management. Publishes product records on the product-records stream (design/contracts/product-lifecycle.yaml).
    publishes:
      ProductRecordChanged:
        version: 1
        description: The current record of a product. productId is the record key of the stream.
        fields:
          productId: uuid
          sku: string
          name: string
          lifecycleState: string

  Pricing:
    foreign: true
    description: Pricing and Promotions Management. Publishes effective prices on the effective-prices stream (design/contracts/pricing.yaml).
    publishes:
      EffectivePriceChanged:
        version: 1
        description: The price a product sells at now, after the active promotion. productId is the record key of the stream.
        fields:
          productId: uuid
          unitPrice: decimal
          currency: string

  PaymentProvider:
    foreign: true
    description: The bought payment service. It takes the card on its own payment sheet and tells Drone Web the outcome by webhook. Each webhook gives back the orderId and Drone Web's own paymentId, which StartPayment sent as payment metadata. The provider's own payment id is ordinary data, never Ordering's key (K29).
    publishes:
      PaymentCaptured:
        version: 1
        description: The provider took the money for an order.
        fields:
          paymentId: uuid
          orderId: uuid
          amount: decimal
          capturedAt: datetime
      PaymentDeclined:
        version: 1
        description: The provider could not take the money for an order.
        fields:
          paymentId: uuid
          orderId: uuid
          declineReason: string

  Warehouse:
    foreign: true
    description: The warehouse side, run from the ERP. It receives PaidOrder and ships the parcel.
    publishes:
      ParcelDispatched:
        version: 1
        description: The warehouse handed the parcel for an order to a carrier.
        fields:
          orderId: uuid
          carrier: string
          trackingNumber: string
          dispatchedAt: datetime

  Carrier:
    foreign: true
    description: The carrier that delivers the parcel. It knows the parcel by its tracking number only.
    publishes:
      ParcelDelivered:
        version: 1
        description: The carrier delivered a parcel.
        fields:
          trackingNumber: string
          deliveredAt: datetime

ports:
  PaymentApi:
    description: The payment provider's API. Drone Web asks it to start a payment for an order's total and gets the provider's payment id back. The total and currency come from the order's own OrderPlaced event, never from a view. Drone Web sends its own paymentId as payment metadata, so the webhooks name the payment by Drone Web's id.
    operations:
      StartPayment:
        request:
          orderId: uuid
          paymentId: uuid
          total: decimal
          currency: string
        reply:
          providerPaymentId: string
  PushNotifications:
    description: The bought push service. It knows which phones belong to a customer and delivers the message to them.
    operations:
      SendPaymentDeclinedPush:
        request:
          customerId: uuid
          orderId: uuid
          productName: string
          declineReason: string
      SendOrderShippedPush:
        request:
          customerId: uuid
          orderId: uuid
          productName: string
          carrier: string
          trackingNumber: string
      SendOrderDeliveredPush:
        request:
          customerId: uuid
          orderId: uuid
          productName: string

events:
  ProductDescribed:
    context: Ordering
    description: Ordering learned a product's name, SKU and lifecycle state from product data.
    tags: [productId]
    fields:
      productId: { type: uuid, source: system, example: 3f6b2c1e-8a4d-4f0e-9b7a-1c2d3e4f5a60 }
      sku: { type: string, source: system, example: IFL-NAZ5V3-6S-BNF }
      name: { type: string, source: system, example: iFlight Nazgul5 V3 6S BNF }
      lifecycleState: { type: string, source: system, description: "active or discontinued, as Product Data publishes it. product-records carries no drafts (CJ D5a).", example: active }

  ProductPriced:
    context: Ordering
    description: Ordering learned the price a product sells at now.
    tags: [productId]
    fields:
      productId: { type: uuid, source: system }
      unitPrice: { type: decimal, source: system, example: 329.99 }
      currency: { type: string, source: system, example: EUR }

  OrderPlaced:
    context: Ordering
    description: A customer ordered a drone at the price it sold at that moment.
    tags: [orderId, productId]
    fields:
      orderId: { type: uuid, source: generated, example: 7c9e6679-7425-40de-944b-e07fc1f90ae7 }
      customerId: { type: uuid, source: system, example: 0b7e9d22-4c1a-4e8b-9f3d-6a5b4c3d2e10 }
      productId: { type: uuid, source: system, example: 3f6b2c1e-8a4d-4f0e-9b7a-1c2d3e4f5a60 }
      productName: { type: string, source: system, from: ProductDescribed.name, example: iFlight Nazgul5 V3 6S BNF }
      quantity: { type: int, source: system, example: 1 }
      unitPrice: { type: decimal, source: system, from: ProductPriced.unitPrice, example: 329.99 }
      currency: { type: string, source: system, from: ProductPriced.currency, example: EUR }
      total: { type: decimal, source: generated, description: unitPrice times quantity., example: 329.99 }
      deliveryAddress: { type: string, source: system, example: "Kaiserstrasse 12, 60311 Frankfurt am Main, Germany" }
      placedAt: { type: datetime, source: generated, example: 2026-11-02T18:42:00Z }

  PaymentStarted:
    context: Ordering
    description: The customer started paying for an order, and the payment provider opened a payment for it.
    tags: [orderId, paymentId]
    fields:
      orderId: { type: uuid, source: system }
      paymentId: { type: uuid, source: generated, description: "Drone Web mints its own payment id (K29). The provider's id is the ordinary field providerPaymentId.", example: 5d2a8f41-93c7-4b6e-a1f0-2e8c7d9b3a64 }
      providerPaymentId: { type: string, source: external, description: "The payment provider's own id for the payment. Ordinary data, not a tag. Staff use it to find the payment in the provider's dashboard.", example: pi_3QDrn8F2eZvKYlo2 }
      amount: { type: decimal, source: system, from: OrderPlaced.total, example: 329.99 }
      currency: { type: string, source: system, from: OrderPlaced.currency, example: EUR }
      startedAt: { type: datetime, source: generated, example: 2026-11-02T18:43:10Z }

  OrderPaid:
    context: Ordering
    description: The payment provider took the money for an order.
    tags: [orderId, paymentId]
    fields:
      orderId: { type: uuid, source: system }
      paymentId: { type: uuid, source: system }
      amount: { type: decimal, source: system, example: 329.99 }
      paidAt: { type: datetime, source: system, example: 2026-11-02T18:43:55Z }
      productId: { type: uuid, source: system, from: OrderPlaced.productId }
      quantity: { type: int, source: system, from: OrderPlaced.quantity }
      deliveryAddress: { type: string, source: system, from: OrderPlaced.deliveryAddress }

  OrderReleasedToWarehouse:
    context: Ordering
    description: The captured amount covers the order total, so the order goes to the warehouse as PaidOrder. An order whose captured amount is less than its total is held and gets no such event (ORD-007).
    tags: [orderId]
    fields:
      orderId: { type: uuid, source: system }
      productId: { type: uuid, source: system, from: OrderPlaced.productId }
      quantity: { type: int, source: system, from: OrderPlaced.quantity }
      deliveryAddress: { type: string, source: system, from: OrderPlaced.deliveryAddress }
      releasedAt: { type: datetime, source: generated, example: 2026-11-02T18:43:56Z }

  PaymentAmountMismatched:
    context: Ordering
    description: The payment provider took an amount different from the order total. Ordering kept the payment; a person must check the difference.
    tags: [orderId, paymentId]
    fields:
      orderId: { type: uuid, source: system }
      paymentId: { type: uuid, source: system }
      orderTotal: { type: decimal, source: system, from: OrderPlaced.total, example: 659.98 }
      capturedAmount: { type: decimal, source: system, example: 329.99 }
      currency: { type: string, source: system, from: OrderPlaced.currency, example: EUR }
      difference: { type: decimal, source: generated, description: capturedAmount minus orderTotal; negative when the provider took too little., example: -329.99 }
      capturedAt: { type: datetime, source: system, example: 2026-11-02T18:43:55Z }

  OrderPaymentDeclined:
    context: Ordering
    description: The payment provider could not take the money for an order; the order waits for a new payment.
    tags: [orderId, paymentId]
    fields:
      orderId: { type: uuid, source: system }
      paymentId: { type: uuid, source: system }
      declineReason: { type: string, source: system, example: Insufficient funds }
      customerId: { type: uuid, source: system, from: OrderPlaced.customerId }
      productName: { type: string, source: system, from: OrderPlaced.productName }

  CustomerToldPaymentDeclined:
    context: Ordering
    description: The customer got a push notification that the payment was declined and the order can be paid again.
    tags: [orderId, paymentId]
    fields:
      orderId: { type: uuid, source: system }
      paymentId: { type: uuid, source: system }
      toldAt: { type: datetime, source: generated, example: 2026-11-02T18:44:20Z }

  OrderShipped:
    context: Ordering
    description: The warehouse handed the parcel for an order to a carrier.
    tags: [orderId, trackingNumber]
    fields:
      orderId: { type: uuid, source: system }
      carrier: { type: string, source: system, example: UPS }
      trackingNumber: { type: string, source: system, example: 1Z999AA10123456784 }
      shippedAt: { type: datetime, source: system, example: 2026-11-04T09:15:00Z }
      customerId: { type: uuid, source: system, from: OrderPlaced.customerId }
      productName: { type: string, source: system, from: OrderPlaced.productName }

  CustomerToldOrderShipped:
    context: Ordering
    description: The customer got a push notification that the order is on its way.
    tags: [orderId]
    fields:
      orderId: { type: uuid, source: system }
      toldAt: { type: datetime, source: generated, example: 2026-11-04T09:15:30Z }

  OrderDelivered:
    context: Ordering
    description: The carrier delivered the parcel for an order.
    tags: [orderId, trackingNumber]
    fields:
      trackingNumber: { type: string, source: system }
      deliveredAt: { type: datetime, source: system, example: 2026-11-06T14:05:00Z }
      orderId: { type: uuid, source: system, from: OrderShipped.orderId }
      customerId: { type: uuid, source: system, from: OrderShipped.customerId }
      productName: { type: string, source: system, from: OrderShipped.productName }

  CustomerToldOrderDelivered:
    context: Ordering
    description: The customer got a push notification that the drone has arrived.
    tags: [orderId]
    fields:
      orderId: { type: uuid, source: system }
      toldAt: { type: datetime, source: generated, example: 2026-11-06T14:05:30Z }

slices:

  # ---------------------------------------------------------------- Know what we sell

  DescribeProduct:
    pattern: translation
    chapter: Know what we sell
    description: Ordering keeps its own copy of each product's name and lifecycle state from the product-records stream.
    message: ProductData.ProductRecordChanged
    processor:
      name: ProductRecordListener
      lane: Integration
    command:
      name: DescribeProduct
      fields:
        productId: { type: uuid, source: system, from: message.productId }
        sku: { type: string, source: system, from: message.sku }
        name: { type: string, source: system, from: message.name }
        lifecycleState: { type: string, source: system, from: message.lifecycleState }
    emits:
      - event: ProductDescribed
    tests:
      LearnsAboutTheNazgul:
        when:
          values: { productId: $nazgul, sku: IFL-NAZ5V3-6S-BNF, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: active }
        then:
          - event: ProductDescribed
            values: { productId: $nazgul, sku: IFL-NAZ5V3-6S-BNF, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: active }
      LearnsThatTheNazgulIsDiscontinued:
        given:
          - event: ProductDescribed
            values: { productId: $nazgul, sku: IFL-NAZ5V3-6S-BNF, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: active }
        when:
          values: { productId: $nazgul, sku: IFL-NAZ5V3-6S-BNF, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: discontinued }
        then:
          - event: ProductDescribed
            values: { productId: $nazgul, lifecycleState: discontinued }
      IgnoresARecordItAlreadyHas:
        given:
          - event: ProductDescribed
            values: { productId: $nazgul, sku: IFL-NAZ5V3-6S-BNF, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: active }
        when:
          values: { productId: $nazgul, sku: IFL-NAZ5V3-6S-BNF, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: active }
        then: []

  PriceProduct:
    pattern: translation
    chapter: Know what we sell
    description: Ordering keeps its own copy of each product's current price from the effective-prices stream.
    message: Pricing.EffectivePriceChanged
    processor:
      name: PriceListener
      lane: Integration
    command:
      name: PriceProduct
      fields:
        productId: { type: uuid, source: system, from: message.productId }
        unitPrice: { type: decimal, source: system, from: message.unitPrice }
        currency: { type: string, source: system, from: message.currency }
    emits:
      - event: ProductPriced
    tests:
      LearnsTheNazgulPrice:
        when:
          values: { productId: $nazgul, unitPrice: 329.99, currency: EUR }
        then:
          - event: ProductPriced
            values: { productId: $nazgul, unitPrice: 329.99, currency: EUR }
      KeepsAPriceThatArrivesBeforeTheProductRecord:
        when:
          values: { productId: $x500, unitPrice: 359.00, currency: EUR }
        then:
          - event: ProductPriced
            values: { productId: $x500, unitPrice: 359.00, currency: EUR }
      LearnsAPromotionPrice:
        given:
          - event: ProductPriced
            values: { productId: $nazgul, unitPrice: 329.99, currency: EUR }
        when:
          values: { productId: $nazgul, unitPrice: 299.99, currency: EUR }
        then:
          - event: ProductPriced
            values: { productId: $nazgul, unitPrice: 299.99, currency: EUR }
      IgnoresAPriceItAlreadyHas:
        given:
          - event: ProductPriced
            values: { productId: $nazgul, unitPrice: 329.99, currency: EUR }
        when:
          values: { productId: $nazgul, unitPrice: 329.99, currency: EUR }
        then: []

  BrowseDrones:
    pattern: query
    chapter: Know what we sell
    description: >-
      Phone screen: a scrolling list of drones with name and price; a drone that cannot be ordered
      is greyed out. The two streams do not arrive in a fixed order. A price that arrives before
      the product record is kept and matched to the drone when the record arrives (CJ,
      2026-10-28). Kairos v0 ignores an update for a row the view does not have yet
      (emf-m9a.67), so it cannot say this in the reads yet; KeepsAPriceThatArrivedBeforeTheDrone
      states the wanted outcome.
    screen:
      name: DroneList
      actor: Customer
    views:
      - list-view:
          name: DronesForSale
          identity: productId
          reads:
            ProductDescribed: create
            ProductPriced: update
          fields:
            productId: { type: uuid, source: system, from: ProductDescribed.productId, example: 3f6b2c1e-8a4d-4f0e-9b7a-1c2d3e4f5a60 }
            name: { type: string, source: system, from: ProductDescribed.name }
            unitPrice: { type: decimal, source: system, from: ProductPriced.unitPrice, optional: true }
            currency: { type: string, source: system, from: ProductPriced.currency, optional: true }
            orderable:
              type: bool
              source: generated
              description: The product is active and has a price.
              example: true
    tests:
      ListsEachDroneWithItsPrice:
        given:
          - event: ProductDescribed
            values: { productId: $nazgul, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: active }
          - event: ProductPriced
            values: { productId: $nazgul, unitPrice: 329.99, currency: EUR }
          - event: ProductDescribed
            values: { productId: $x500, name: Holybro X500 V2 ARF Kit, lifecycleState: active }
          - event: ProductPriced
            values: { productId: $x500, unitPrice: 359.00, currency: EUR }
        then:
          - view: DronesForSale
            rows:
              - { productId: $nazgul, name: iFlight Nazgul5 V3 6S BNF, unitPrice: 329.99, currency: EUR, orderable: true }
              - { productId: $x500, name: Holybro X500 V2 ARF Kit, unitPrice: 359.00, currency: EUR, orderable: true }
      GreysOutADroneWithoutAPrice:
        given:
          - event: ProductDescribed
            values: { productId: $x500, name: Holybro X500 V2 ARF Kit, lifecycleState: active }
        then:
          - view: DronesForSale
            rows:
              - { productId: $x500, name: Holybro X500 V2 ARF Kit, unitPrice: null, currency: null, orderable: false }
      KeepsAPriceThatArrivedBeforeTheDrone:
        given:
          - event: ProductPriced
            values: { productId: $x500, unitPrice: 359.00, currency: EUR }
          - event: ProductDescribed
            values: { productId: $x500, name: Holybro X500 V2 ARF Kit, lifecycleState: active }
        then:
          - view: DronesForSale
            rows:
              - { productId: $x500, name: Holybro X500 V2 ARF Kit, unitPrice: 359.00, currency: EUR, orderable: true }
      GreysOutADiscontinuedDrone:
        given:
          - event: ProductDescribed
            values: { productId: $nazgul, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: active }
          - event: ProductPriced
            values: { productId: $nazgul, unitPrice: 329.99, currency: EUR }
          - event: ProductDescribed
            values: { productId: $nazgul, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: discontinued }
        then:
          - view: DronesForSale
            rows:
              - { productId: $nazgul, name: iFlight Nazgul5 V3 6S BNF, unitPrice: 329.99, currency: EUR, orderable: false }

  ViewDrone:
    pattern: query
    chapter: Know what we sell
    description: >-
      Phone screen: one drone, opened by a tap in the list of drones for sale. It shows the name,
      the SKU, the price and whether the drone can be ordered; an "Order" button opens the order
      form for this drone. It is the detail view of the drone (CJ's rule of 2026-10-29: every
      entity gets a list view and a detail view). Like DronesForSale, it should keep a price that
      arrives before the product record (emf-m9a.67).
    screen:
      name: DroneDetailsScreen
      actor: Customer
    views:
      - single-view:
          name: DroneDetails
          keyed-by: DronesForSale.productId
          identity: productId
          reads:
            ProductDescribed: create
            ProductPriced: update
          fields:
            productId: { type: uuid, source: system, from: ProductDescribed.productId, example: 3f6b2c1e-8a4d-4f0e-9b7a-1c2d3e4f5a60 }
            sku: { type: string, source: system, from: ProductDescribed.sku }
            name: { type: string, source: system, from: ProductDescribed.name }
            lifecycleState: { type: string, source: system, from: ProductDescribed.lifecycleState }
            unitPrice: { type: decimal, source: system, from: ProductPriced.unitPrice, optional: true }
            currency: { type: string, source: system, from: ProductPriced.currency, optional: true }
            orderable:
              type: bool
              source: generated
              description: The product is active and has a price; the "Order" button is shown only then.
              example: true
    tests:
      ShowsTheNazgulReadyToOrder:
        given:
          - event: ProductDescribed
            values: { productId: $nazgul, sku: IFL-NAZ5V3-6S-BNF, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: active }
          - event: ProductPriced
            values: { productId: $nazgul, unitPrice: 329.99, currency: EUR }
          - event: ProductDescribed
            values: { productId: $x500, sku: HB-X500V2-ARF, name: Holybro X500 V2 ARF Kit, lifecycleState: active }
        then:
          - view: DroneDetails
            keyed: { productId: $nazgul }
            rows:
              - { productId: $nazgul, sku: IFL-NAZ5V3-6S-BNF, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: active, unitPrice: 329.99, currency: EUR, orderable: true }
      ShowsTheLatestPromotionPrice:
        given:
          - event: ProductDescribed
            values: { productId: $nazgul, sku: IFL-NAZ5V3-6S-BNF, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: active }
          - event: ProductPriced
            values: { productId: $nazgul, unitPrice: 329.99, currency: EUR }
          - event: ProductPriced
            values: { productId: $nazgul, unitPrice: 299.99, currency: EUR }
        then:
          - view: DroneDetails
            keyed: { productId: $nazgul }
            rows:
              - { productId: $nazgul, sku: IFL-NAZ5V3-6S-BNF, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: active, unitPrice: 299.99, currency: EUR, orderable: true }
      ShowsADiscontinuedDroneThatCannotBeOrdered:
        given:
          - event: ProductDescribed
            values: { productId: $nazgul, sku: IFL-NAZ5V3-6S-BNF, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: active }
          - event: ProductPriced
            values: { productId: $nazgul, unitPrice: 329.99, currency: EUR }
          - event: ProductDescribed
            values: { productId: $nazgul, sku: IFL-NAZ5V3-6S-BNF, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: discontinued }
        then:
          - view: DroneDetails
            keyed: { productId: $nazgul }
            rows:
              - { productId: $nazgul, sku: IFL-NAZ5V3-6S-BNF, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: discontinued, unitPrice: 329.99, currency: EUR, orderable: false }
      ShowsADroneWithoutAPriceYet:
        given:
          - event: ProductDescribed
            values: { productId: $x500, sku: HB-X500V2-ARF, name: Holybro X500 V2 ARF Kit, lifecycleState: active }
        then:
          - view: DroneDetails
            keyed: { productId: $x500 }
            rows:
              - { productId: $x500, sku: HB-X500V2-ARF, name: Holybro X500 V2 ARF Kit, lifecycleState: active, unitPrice: null, currency: null, orderable: false }

  # ---------------------------------------------------------------- Order and pay

  PlaceOrder:
    pattern: command
    chapter: Order and pay
    description: >-
      Phone screen with three fields: the drone (picked from the list), how many, and where to
      deliver. Offline: if the phone has no signal, the app should keep the order and send it when
      it is back online, and sending it twice must not make two orders. Kairos v0 cannot say this
      yet (gap filed in event-model-factory).
    screen:
      name: OrderForm
      actor: Customer
      fields:
        customerId: { type: uuid, source: user, description: "Comes from the customer's sign-in in the app; the customer never types it.", example: 0b7e9d22-4c1a-4e8b-9f3d-6a5b4c3d2e10 }
        productId: { type: uuid, source: user, description: Picked from the list of drones for sale., example: 3f6b2c1e-8a4d-4f0e-9b7a-1c2d3e4f5a60 }
        quantity: { type: int, source: user, example: 1 }
        deliveryAddress: { type: string, source: user, description: "One of the customer's saved addresses, or a new one.", example: "Kaiserstrasse 12, 60311 Frankfurt am Main, Germany" }
    command:
      name: PlaceOrder
      fields:
        customerId: { type: uuid, source: system, from: screen.customerId }
        productId:
          type: uuid
          source: system
          from: screen.productId
          lookup: { view: DronesForSale, value: productId, label: name }
        quantity: { type: int, source: system, from: screen.quantity }
        deliveryAddress: { type: string, source: system, from: screen.deliveryAddress }
    emits:
      - event: OrderPlaced
    rules:
      ORD-001:
        title: A customer can order only a drone that is active
        description: >-
          Discontinued products cannot be ordered. ORD-001 has no draft case: product-records
          carries no drafts (CJ D5a), so Ordering never hears of a draft and refuses it with
          DroneUnknown.
      ORD-002:
        title: A customer can order only a drone that has a price
      # ORD-003 (one to five drones per app order) was dropped by CJ on 2026-10-28. The id is not
      # reused. Realistic order rules: galaxitech-website-9x0.
    errors:
      DroneUnknown: { description: Ordering has never heard of this product. A draft is unknown here because product-records carries no drafts. }
      DroneNotForSale: { description: The drone is discontinued., rule: ORD-001 }
      NoPriceYet: { description: The drone has no price yet., rule: ORD-002 }
    tests:
      PlacesAnOrderForOneNazgul:
        rules: [ORD-001, ORD-002]
        given:
          - event: ProductDescribed
            values: { productId: $nazgul, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: active }
          - event: ProductPriced
            values: { productId: $nazgul, unitPrice: 329.99, currency: EUR }
        when:
          values: { customerId: $mia, productId: $nazgul, quantity: 1, deliveryAddress: "Kaiserstrasse 12, 60311 Frankfurt am Main, Germany" }
        then:
          - event: OrderPlaced
            values: { customerId: $mia, productId: $nazgul, productName: iFlight Nazgul5 V3 6S BNF, quantity: 1, unitPrice: 329.99, currency: EUR, total: 329.99, deliveryAddress: "Kaiserstrasse 12, 60311 Frankfurt am Main, Germany" }
      TotalsThePriceForEachDrone:
        given:
          - event: ProductDescribed
            values: { productId: $nazgul, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: active }
          - event: ProductPriced
            values: { productId: $nazgul, unitPrice: 329.99, currency: EUR }
        when:
          values: { customerId: $mia, productId: $nazgul, quantity: <quantity> }
        then:
          - event: OrderPlaced
            values: { productId: $nazgul, quantity: <quantity>, unitPrice: 329.99, total: <total> }
        examples:
          - { quantity: 2, total: 659.98 }
          - { quantity: 5, total: 1649.95 }
      ChargesThePromotionPrice:
        given:
          - event: ProductDescribed
            values: { productId: $nazgul, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: active }
          - event: ProductPriced
            values: { productId: $nazgul, unitPrice: 329.99, currency: EUR }
          - event: ProductPriced
            values: { productId: $nazgul, unitPrice: 299.99, currency: EUR }
        when:
          values: { customerId: $mia, productId: $nazgul, quantity: 1 }
        then:
          - event: OrderPlaced
            values: { productId: $nazgul, unitPrice: 299.99, total: 299.99 }
      RejectsADiscontinuedDrone:
        rules: [ORD-001]
        given:
          - event: ProductDescribed
            values: { productId: $nazgul, name: iFlight Nazgul5 V3 6S BNF, lifecycleState: discontinued }
          - event: ProductPriced
            values: { productId: $nazgul, unitPrice: 329.99, currency: EUR }
        when:
          values: { customerId: $mia, productId: $nazgul, quantity: 1 }
        then:
          - error: DroneNotForSale
      RejectsADroneWithoutAPrice:
        rules: [ORD-002]
        given:
          - event: ProductDescribed
            values: { productId: $x500, name: Holybro X500 V2 ARF Kit, lifecycleState: active }
        when:
          values: { customerId: $mia, productId: $x500, quantity: 1 }
        then:
          - error: NoPriceYet
      RejectsADroneOrderingNeverHeardOf:
        when:
          values: { customerId: $mia, productId: $unknownDrone, quantity: 1 }
        then:
          - error: DroneUnknown

  PayForOrder:
    pattern: command
    chapter: Order and pay
    description: >-
      Phone screen with one button: "Pay 329.99 EUR". The provider's own payment sheet takes the
      card, so card data never reaches Drone Web. The outcome arrives later by webhook. The
      amount and currency come from the order's own OrderPlaced event, which the decision loads
      by orderId; the MyOrders view only helps the customer pick the order. PaymentStarted mints
      Drone Web's own paymentId, which StartPayment sends to the provider as metadata; the
      provider's reply, providerPaymentId, is ordinary data (K29). The prototype factory fills a
      port request from command fields only, so it warns (F6) that StartPayment's paymentId,
      total and currency are not on the command. That is a factory limit, not a modelling choice.
    screen:
      name: PaymentScreen
      actor: Customer
      fields:
        orderId: { type: uuid, source: user, description: "The order the customer just placed, or one picked from My orders.", example: 7c9e6679-7425-40de-944b-e07fc1f90ae7 }
    command:
      name: PayForOrder
      fields:
        orderId:
          type: uuid
          source: system
          from: screen.orderId
          lookup: { view: MyOrders, value: orderId, label: productName }
        providerPaymentId: { type: string, source: external, from: PaymentApi.StartPayment.providerPaymentId }
    emits:
      - event: PaymentStarted
    rules:
      ORD-004:
        title: An order is paid once
        description: After a declined payment the customer may try again; after a captured payment, not.
    errors:
      OrderUnknown: { description: No order was placed under this id. }
      OrderAlreadyPaid: { description: The payment provider already took the money for this order., rule: ORD-004 }
    tests:
      StartsPayingForMiasNazgul:
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, customerId: $mia, total: 329.99, currency: EUR }
        when:
          values: { orderId: $miasOrder, providerPaymentId: pi_3QDrn8F2eZvKYlo2 }
        then:
          - event: PaymentStarted
            values: { orderId: $miasOrder, providerPaymentId: pi_3QDrn8F2eZvKYlo2, amount: 329.99, currency: EUR }
      ChargesTheTotalTheOrderWasPlacedAt:
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, customerId: $mia, productId: $nazgul, quantity: 2, unitPrice: 329.99, total: 659.98, currency: EUR }
        when:
          values: { orderId: $miasOrder, providerPaymentId: pi_3QDrn8F2eZvKYlo2 }
        then:
          - event: PaymentStarted
            values: { orderId: $miasOrder, providerPaymentId: pi_3QDrn8F2eZvKYlo2, amount: 659.98, currency: EUR }
      TriesAgainAfterADeclinedCard:
        rules: [ORD-004]
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, total: 329.99, currency: EUR }
          - event: OrderPaymentDeclined
            values: { orderId: $miasOrder, paymentId: $miasPayment, declineReason: Insufficient funds }
        when:
          values: { orderId: $miasOrder, providerPaymentId: pi_3QDrp1K7aQwBx9M4 }
        then:
          - event: PaymentStarted
            values: { orderId: $miasOrder, providerPaymentId: pi_3QDrp1K7aQwBx9M4, amount: 329.99 }
      RejectsPayingAPaidOrder:
        rules: [ORD-004]
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, total: 329.99 }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99 }
        when:
          values: { orderId: $miasOrder, providerPaymentId: pi_3QDrp1K7aQwBx9M4 }
        then:
          - error: OrderAlreadyPaid
      RejectsPayingAnOrderNobodyPlaced:
        when:
          values: { orderId: $noOrder, providerPaymentId: pi_3QDrn8F2eZvKYlo2 }
        then:
          - error: OrderUnknown

  RecordCapturedPayment:
    pattern: translation
    chapter: Order and pay
    description: >-
      The payment provider's webhook says the money is taken. Ordering records the amount the
      provider captured and never refuses it, even when it differs from the order total;
      FlagPaymentAmountMismatch flags that case. ReleasePaidOrder decides whether the order goes
      to the warehouse (ORD-007).
    message: PaymentProvider.PaymentCaptured
    processor:
      name: PaymentWebhookListener
      lane: Integration
    command:
      name: RecordCapturedPayment
      fields:
        orderId: { type: uuid, source: system, from: message.orderId }
        paymentId: { type: uuid, source: system, from: message.paymentId }
        amount: { type: decimal, source: system, from: message.amount }
        paidAt: { type: datetime, source: system, from: message.capturedAt }
    emits:
      - event: OrderPaid
    tests:
      RecordsThatMiaPaid:
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, productId: $nazgul, quantity: 1, total: 329.99, deliveryAddress: "Kaiserstrasse 12, 60311 Frankfurt am Main, Germany" }
        when:
          values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99, capturedAt: 2026-11-02T18:43:55Z }
        then:
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99, paidAt: 2026-11-02T18:43:55Z, productId: $nazgul, quantity: 1, deliveryAddress: "Kaiserstrasse 12, 60311 Frankfurt am Main, Germany" }
      RecordsTheAmountTheProviderTookEvenWhenItDiffers:
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, productId: $nazgul, quantity: 2, total: 659.98, deliveryAddress: "Kaiserstrasse 12, 60311 Frankfurt am Main, Germany" }
        when:
          values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99, capturedAt: 2026-11-02T18:43:55Z }
        then:
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99, paidAt: 2026-11-02T18:43:55Z, productId: $nazgul, quantity: 2 }
      IgnoresAPaymentItAlreadyRecorded:
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, productId: $nazgul, quantity: 1, total: 329.99 }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99 }
        when:
          values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99, capturedAt: 2026-11-02T18:43:55Z }
        then: []
      IgnoresAPaymentForAnOrderNobodyPlaced:
        when:
          values: { orderId: $noOrder, paymentId: $strayPayment, amount: 329.99, capturedAt: 2026-11-02T18:43:55Z }
        then: []

  FlagPaymentAmountMismatch:
    pattern: translation
    chapter: Order and pay
    description: >-
      The same webhook, checked against the order. When the captured amount differs from the order
      total, Ordering records the difference for a person to check. It does not refuse the payment
      (CJ, 2026-10-28). Realistic causes: split shipments, currency rounding, bugs or tampering.
    message: PaymentProvider.PaymentCaptured
    processor:
      name: PaymentAmountChecker
      lane: Integration
    command:
      name: CheckCapturedAmount
      fields:
        orderId: { type: uuid, source: system, from: message.orderId }
        paymentId: { type: uuid, source: system, from: message.paymentId }
        capturedAmount: { type: decimal, source: system, from: message.amount }
        capturedAt: { type: datetime, source: system, from: message.capturedAt }
    emits:
      - event: PaymentAmountMismatched
    rules:
      ORD-005:
        title: A captured amount that differs from the order total is kept and flagged for a person to check
        description: The payment is recorded as it was captured, and Ordering never refuses it.
    tests:
      FlagsAnAmountThatDiffersFromTheTotal:
        rules: [ORD-005]
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, productId: $nazgul, quantity: <quantity>, total: <total>, currency: EUR }
        when:
          values: { orderId: $miasOrder, paymentId: $miasPayment, amount: <captured>, capturedAt: 2026-11-02T18:43:55Z }
        then:
          - event: PaymentAmountMismatched
            values: { orderId: $miasOrder, paymentId: $miasPayment, orderTotal: <total>, capturedAmount: <captured>, currency: EUR, difference: <difference>, capturedAt: 2026-11-02T18:43:55Z }
        examples:
          - { quantity: 2, total: 659.98, captured: 329.99, difference: -329.99 }
          - { quantity: 1, total: 329.99, captured: 330.00, difference: 0.01 }
      StaysQuietWhenTheAmountMatches:
        rules: [ORD-005]
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, productId: $nazgul, quantity: 1, total: 329.99, currency: EUR }
        when:
          values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99, capturedAt: 2026-11-02T18:43:55Z }
        then: []
      IgnoresAMismatchItAlreadyFlagged:
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, quantity: 2, total: 659.98, currency: EUR }
          - event: PaymentAmountMismatched
            values: { orderId: $miasOrder, paymentId: $miasPayment, orderTotal: 659.98, capturedAmount: 329.99 }
        when:
          values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99, capturedAt: 2026-11-02T18:43:55Z }
        then: []
      IgnoresAPaymentForAnOrderNobodyPlaced:
        when:
          values: { orderId: $noOrder, paymentId: $strayPayment, amount: 329.99, capturedAt: 2026-11-02T18:43:55Z }
        then: []

  CheckPaymentMismatches:
    pattern: query
    chapter: Order and pay
    description: "Staff screen: payments whose captured amount differs from the order total, with both amounts and the difference, for a person to check."
    screen:
      name: PaymentMismatchesScreen
      actor: OrderDesk
    views:
      - list-view:
          name: PaymentMismatches
          identity: paymentId
          reads:
            PaymentAmountMismatched: create
          fields:
            paymentId: { type: uuid, source: system, from: PaymentAmountMismatched.paymentId, example: 5d2a8f41-93c7-4b6e-a1f0-2e8c7d9b3a64 }
            orderId: { type: uuid, source: system, from: PaymentAmountMismatched.orderId, example: 7c9e6679-7425-40de-944b-e07fc1f90ae7 }
            orderTotal: { type: decimal, source: system, from: PaymentAmountMismatched.orderTotal }
            capturedAmount: { type: decimal, source: system, from: PaymentAmountMismatched.capturedAmount }
            currency: { type: string, source: system, from: PaymentAmountMismatched.currency }
            difference: { type: decimal, source: system, from: PaymentAmountMismatched.difference }
            capturedAt: { type: datetime, source: system, from: PaymentAmountMismatched.capturedAt }
    tests:
      ListsEachPaymentToCheck:
        given:
          - event: PaymentAmountMismatched
            values: { orderId: $miasOrder, paymentId: $miasPayment, orderTotal: 659.98, capturedAmount: 329.99, currency: EUR, difference: -329.99, capturedAt: 2026-11-02T18:43:55Z }
          - event: PaymentAmountMismatched
            values: { orderId: $leosOrder, paymentId: $leosPayment, orderTotal: 329.99, capturedAmount: 330.00, currency: EUR, difference: 0.01, capturedAt: 2026-11-03T08:11:30Z }
        then:
          - view: PaymentMismatches
            rows:
              - { paymentId: $miasPayment, orderId: $miasOrder, orderTotal: 659.98, capturedAmount: 329.99, currency: EUR, difference: -329.99, capturedAt: 2026-11-02T18:43:55Z }
              - { paymentId: $leosPayment, orderId: $leosOrder, orderTotal: 329.99, capturedAmount: 330.00, currency: EUR, difference: 0.01, capturedAt: 2026-11-03T08:11:30Z }

  RecordDeclinedPayment:
    pattern: translation
    chapter: Order and pay
    description: The payment provider's webhook says the card was declined. The order stays open so the customer can pay again.
    message: PaymentProvider.PaymentDeclined
    processor:
      name: DeclineWebhookListener
      lane: Integration
    command:
      name: RecordDeclinedPayment
      fields:
        orderId: { type: uuid, source: system, from: message.orderId }
        paymentId: { type: uuid, source: system, from: message.paymentId }
        declineReason: { type: string, source: system, from: message.declineReason }
    emits:
      - event: OrderPaymentDeclined
    tests:
      RecordsThatMiasCardWasDeclined:
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, customerId: $mia, productName: iFlight Nazgul5 V3 6S BNF, total: 329.99 }
        when:
          values: { orderId: $miasOrder, paymentId: $miasPayment, declineReason: Insufficient funds }
        then:
          - event: OrderPaymentDeclined
            values: { orderId: $miasOrder, paymentId: $miasPayment, declineReason: Insufficient funds, customerId: $mia, productName: iFlight Nazgul5 V3 6S BNF }
      IgnoresADeclineItAlreadyRecorded:
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, total: 329.99 }
          - event: OrderPaymentDeclined
            values: { orderId: $miasOrder, paymentId: $miasPayment, declineReason: Insufficient funds }
        when:
          values: { orderId: $miasOrder, paymentId: $miasPayment, declineReason: Insufficient funds }
        then: []
      IgnoresADeclineForAnOrderNobodyPlaced:
        when:
          values: { orderId: $noOrder, paymentId: $strayPayment, declineReason: Insufficient funds }
        then: []

  NotifyPaymentDeclined:
    pattern: automation
    chapter: Order and pay
    description: 'Push notification: "Your payment for the iFlight Nazgul5 V3 6S BNF was declined: Insufficient funds. Tap to pay again." Tapping it opens the payment screen for the order.'
    views:
      - list-view:
          name: DeclinesToAnnounce
          identity: paymentId
          reads:
            OrderPaymentDeclined: create
            CustomerToldPaymentDeclined: remove
          fields:
            paymentId: { type: uuid, source: system, from: OrderPaymentDeclined.paymentId }
            orderId: { type: uuid, source: system, from: OrderPaymentDeclined.orderId }
            customerId: { type: uuid, source: system, from: OrderPaymentDeclined.customerId }
            productName: { type: string, source: system, from: OrderPaymentDeclined.productName }
            declineReason: { type: string, source: system, from: OrderPaymentDeclined.declineReason }
    processor:
      name: DeclinedPushSender
      lane: Notifications
      calls: [PushNotifications.SendPaymentDeclinedPush]
    command:
      name: RecordDeclinedPush
      fields:
        orderId: { type: uuid, source: system, from: DeclinesToAnnounce.orderId }
        paymentId: { type: uuid, source: system, from: DeclinesToAnnounce.paymentId }
    emits:
      - event: CustomerToldPaymentDeclined
    tests:
      TellsMiaHerCardWasDeclined:
        given:
          - event: OrderPaymentDeclined
            values: { orderId: $miasOrder, paymentId: $miasPayment, declineReason: Insufficient funds, customerId: $mia, productName: iFlight Nazgul5 V3 6S BNF }
        then:
          - event: CustomerToldPaymentDeclined
            values: { orderId: $miasOrder, paymentId: $miasPayment }
      TellsMiaOnlyOncePerDecline:
        given:
          - event: OrderPaymentDeclined
            values: { orderId: $miasOrder, paymentId: $miasPayment, declineReason: Insufficient funds, customerId: $mia, productName: iFlight Nazgul5 V3 6S BNF }
          - event: CustomerToldPaymentDeclined
            values: { orderId: $miasOrder, paymentId: $miasPayment }
        then: []

  ListPayments:
    pattern: query
    chapter: Order and pay
    description: >-
      Staff screen: every payment attempt, newest first, with its order, the amount Drone Web
      asked for and a status badge (started, captured or declined). A badge marks a payment whose
      captured amount differs from the order total. One order can have several attempts: a
      declined card and then a captured one. The customer never sees this list; the customer sees
      the payment only as the status of the order (MyOrders, OrderStatus). It is the list view of
      the payment (CJ's rule of 2026-10-29).
    screen:
      name: PaymentsScreen
      actor: OrderDesk
    views:
      - list-view:
          name: Payments
          identity: paymentId
          reads:
            PaymentStarted: create
            OrderPaid: update
            OrderPaymentDeclined: update
            PaymentAmountMismatched: update
          fields:
            paymentId: { type: uuid, source: system, from: PaymentStarted.paymentId, example: 5d2a8f41-93c7-4b6e-a1f0-2e8c7d9b3a64 }
            providerPaymentId: { type: string, source: system, from: PaymentStarted.providerPaymentId, example: pi_3QDrn8F2eZvKYlo2 }
            orderId: { type: uuid, source: system, from: PaymentStarted.orderId, example: 7c9e6679-7425-40de-944b-e07fc1f90ae7 }
            amount: { type: decimal, source: system, from: PaymentStarted.amount }
            currency: { type: string, source: system, from: PaymentStarted.currency }
            startedAt: { type: datetime, source: system, from: PaymentStarted.startedAt }
            status:
              type: string
              source: generated
              description: "The badge: started (the provider has not answered yet), captured or declined."
              example: captured
            amountMismatch:
              type: bool
              source: generated
              description: The provider captured an amount different from the order total.
              example: false
    tests:
      ShowsEachAttemptWithItsOutcome:
        given:
          - event: PaymentStarted
            values: { orderId: $miasOrder, paymentId: $miasPayment, providerPaymentId: pi_3QDrn8F2eZvKYlo2, amount: 329.99, currency: EUR, startedAt: 2026-11-02T18:43:10Z }
          - event: OrderPaymentDeclined
            values: { orderId: $miasOrder, paymentId: $miasPayment, declineReason: Insufficient funds }
          - event: PaymentStarted
            values: { orderId: $miasOrder, paymentId: $miasRetry, providerPaymentId: pi_3QDrp1K7aQwBx9M4, amount: 329.99, currency: EUR, startedAt: 2026-11-02T18:50:02Z }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: $miasRetry, amount: 329.99, paidAt: 2026-11-02T18:50:40Z }
          - event: PaymentStarted
            values: { orderId: $leosOrder, paymentId: $leosPayment, providerPaymentId: pi_3QE1aa9Xc2RtYu7P, amount: 329.99, currency: EUR, startedAt: 2026-11-03T08:11:05Z }
        then:
          - view: Payments
            rows:
              - { paymentId: $miasPayment, orderId: $miasOrder, providerPaymentId: pi_3QDrn8F2eZvKYlo2, amount: 329.99, currency: EUR, startedAt: 2026-11-02T18:43:10Z, status: declined, amountMismatch: false }
              - { paymentId: $miasRetry, orderId: $miasOrder, providerPaymentId: pi_3QDrp1K7aQwBx9M4, amount: 329.99, currency: EUR, startedAt: 2026-11-02T18:50:02Z, status: captured, amountMismatch: false }
              - { paymentId: $leosPayment, orderId: $leosOrder, providerPaymentId: pi_3QE1aa9Xc2RtYu7P, amount: 329.99, currency: EUR, startedAt: 2026-11-03T08:11:05Z, status: started, amountMismatch: false }
      MarksAPaymentWhoseAmountDiffers:
        given:
          - event: PaymentStarted
            values: { orderId: $miasOrder, paymentId: $miasPayment, providerPaymentId: pi_3QDrn8F2eZvKYlo2, amount: 659.98, currency: EUR, startedAt: 2026-11-02T18:43:10Z }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99, paidAt: 2026-11-02T18:43:55Z }
          - event: PaymentAmountMismatched
            values: { orderId: $miasOrder, paymentId: $miasPayment, orderTotal: 659.98, capturedAmount: 329.99, currency: EUR, difference: -329.99, capturedAt: 2026-11-02T18:43:55Z }
        then:
          - view: Payments
            rows:
              - { paymentId: $miasPayment, orderId: $miasOrder, providerPaymentId: pi_3QDrn8F2eZvKYlo2, amount: 659.98, currency: EUR, startedAt: 2026-11-02T18:43:10Z, status: captured, amountMismatch: true }

  ViewPayment:
    pattern: query
    chapter: Order and pay
    description: >-
      Staff screen: one payment attempt, opened from the list of payments or from a row of
      PaymentMismatches. It shows the amount Drone Web asked for, the amount the provider
      captured, the decline reason and, for a mismatch, the difference. It is the detail view of
      the payment and also of the payment mismatch: a mismatch is a fact about one payment and
      has the same identity, paymentId. Kairos v0 lets keyed-by name one list only, so the board
      draws the link from Payments only.
    screen:
      name: PaymentDetailsScreen
      actor: OrderDesk
    views:
      - single-view:
          name: PaymentDetails
          keyed-by: Payments.paymentId
          identity: paymentId
          reads:
            PaymentStarted: create
            OrderPaid: update
            OrderPaymentDeclined: update
            PaymentAmountMismatched: update
          fields:
            paymentId: { type: uuid, source: system, from: PaymentStarted.paymentId, example: 5d2a8f41-93c7-4b6e-a1f0-2e8c7d9b3a64 }
            providerPaymentId: { type: string, source: system, from: PaymentStarted.providerPaymentId, example: pi_3QDrn8F2eZvKYlo2 }
            orderId: { type: uuid, source: system, from: PaymentStarted.orderId, example: 7c9e6679-7425-40de-944b-e07fc1f90ae7 }
            amount: { type: decimal, source: system, from: PaymentStarted.amount }
            currency: { type: string, source: system, from: PaymentStarted.currency }
            startedAt: { type: datetime, source: system, from: PaymentStarted.startedAt }
            status:
              type: string
              source: generated
              description: "started, captured or declined."
              example: captured
            capturedAmount: { type: decimal, source: system, from: OrderPaid.amount, optional: true }
            paidAt: { type: datetime, source: system, from: OrderPaid.paidAt, optional: true }
            declineReason: { type: string, source: system, from: OrderPaymentDeclined.declineReason, optional: true }
            difference: { type: decimal, source: system, from: PaymentAmountMismatched.difference, optional: true }
    tests:
      ShowsAPaymentThatWentThrough:
        given:
          - event: PaymentStarted
            values: { orderId: $miasOrder, paymentId: $miasRetry, providerPaymentId: pi_3QDrp1K7aQwBx9M4, amount: 329.99, currency: EUR, startedAt: 2026-11-02T18:50:02Z }
