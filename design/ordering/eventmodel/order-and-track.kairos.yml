          - view: PaymentDetails
            keyed: { paymentId: $miasRetry }
            rows:
              - { paymentId: $miasRetry, orderId: $miasOrder, providerPaymentId: pi_3QDrp1K7aQwBx9M4, amount: 329.99, currency: EUR, startedAt: 2026-11-02T18:50:02Z, status: captured, capturedAmount: 329.99, paidAt: 2026-11-02T18:50:40Z, declineReason: null, difference: null }
      ShowsWhyACardWasDeclined:
        given:
          - event: PaymentStarted
            values: { orderId: $miasOrder, paymentId: $miasPayment, providerPaymentId: pi_3QDrn8F2eZvKYlo2, amount: 329.99, currency: EUR, startedAt: 2026-11-02T18:43:10Z }
          - event: OrderPaymentDeclined
            values: { orderId: $miasOrder, paymentId: $miasPayment, declineReason: Insufficient funds }
        then:
          - view: PaymentDetails
            keyed: { paymentId: $miasPayment }
            rows:
              - { paymentId: $miasPayment, orderId: $miasOrder, providerPaymentId: pi_3QDrn8F2eZvKYlo2, amount: 329.99, currency: EUR, startedAt: 2026-11-02T18:43:10Z, status: declined, capturedAmount: null, paidAt: null, declineReason: Insufficient funds, difference: null }
      ShowsTheDifferenceToCheck:
        given:
          - event: PaymentStarted
            values: { orderId: $miasOrder, paymentId: $miasPayment, providerPaymentId: pi_3QDrn8F2eZvKYlo2, amount: 659.98, currency: EUR, startedAt: 2026-11-02T18:43:10Z }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99, paidAt: 2026-11-02T18:43:55Z }
          - event: PaymentAmountMismatched
            values: { orderId: $miasOrder, paymentId: $miasPayment, orderTotal: 659.98, capturedAmount: 329.99, currency: EUR, difference: -329.99, capturedAt: 2026-11-02T18:43:55Z }
        then:
          - view: PaymentDetails
            keyed: { paymentId: $miasPayment }
            rows:
              - { paymentId: $miasPayment, orderId: $miasOrder, providerPaymentId: pi_3QDrn8F2eZvKYlo2, amount: 659.98, currency: EUR, startedAt: 2026-11-02T18:43:10Z, status: captured, capturedAmount: 329.99, paidAt: 2026-11-02T18:43:55Z, declineReason: null, difference: -329.99 }

