  TrackOrder:
    pattern: query
    chapter: Ship and deliver
    description: "Phone screen: one order with a status timeline (placed, paid, shipped, delivered), the carrier and the tracking number."
    screen:
      name: OrderStatusScreen
      actor: Customer
    views:
      - single-view:
          name: OrderStatus
          keyed-by: MyOrders.orderId
          identity: orderId
          reads:
            OrderPlaced: create
            OrderPaid: update
            OrderPaymentDeclined: update
            OrderShipped: update
            OrderDelivered: update
          fields:
            orderId: { type: uuid, source: system, from: OrderPlaced.orderId, example: 7c9e6679-7425-40de-944b-e07fc1f90ae7 }
            productName: { type: string, source: system, from: OrderPlaced.productName }
            total: { type: decimal, source: system, from: OrderPlaced.total }
            currency: { type: string, source: system, from: OrderPlaced.currency }
            status:
              type: string
              source: generated
              description: "awaiting payment, payment declined, paid, shipped or delivered."
              example: shipped
            paidAt: { type: datetime, source: system, from: OrderPaid.paidAt, optional: true }
            carrier: { type: string, source: system, from: OrderShipped.carrier, optional: true }
            trackingNumber: { type: string, source: system, from: OrderShipped.trackingNumber, optional: true }
            shippedAt: { type: datetime, source: system, from: OrderShipped.shippedAt, optional: true }
            deliveredAt: { type: datetime, source: system, from: OrderDelivered.deliveredAt, optional: true }
    tests:
      ShowsAPaidOrderWaitingForTheWarehouse:
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, productName: iFlight Nazgul5 V3 6S BNF, total: 329.99, currency: USD }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: pi_3QDrn8F2eZvKYlo2, amount: 329.99, paidAt: 2026-11-02T18:43:55Z }
        then:
          - view: OrderStatus
            keyed: { orderId: $miasOrder }
            rows:
              - { orderId: $miasOrder, productName: iFlight Nazgul5 V3 6S BNF, total: 329.99, currency: USD, status: paid, paidAt: 2026-11-02T18:43:55Z, carrier: null, trackingNumber: null, shippedAt: null, deliveredAt: null }
      ShowsTheParcelOnItsWay:
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, productName: iFlight Nazgul5 V3 6S BNF, total: 329.99, currency: USD }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: pi_3QDrn8F2eZvKYlo2, amount: 329.99, paidAt: 2026-11-02T18:43:55Z }
          - event: OrderShipped
            values: { orderId: $miasOrder, carrier: UPS, trackingNumber: 1Z999AA10123456784, shippedAt: 2026-11-04T09:15:00Z }
        then:
          - view: OrderStatus
            keyed: { orderId: $miasOrder }
            rows:
              - { orderId: $miasOrder, productName: iFlight Nazgul5 V3 6S BNF, total: 329.99, currency: USD, status: shipped, paidAt: 2026-11-02T18:43:55Z, carrier: UPS, trackingNumber: 1Z999AA10123456784, shippedAt: 2026-11-04T09:15:00Z, deliveredAt: null }
      ShowsWhenTheDroneArrived:
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, productName: iFlight Nazgul5 V3 6S BNF, total: 329.99, currency: USD }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: pi_3QDrn8F2eZvKYlo2, amount: 329.99, paidAt: 2026-11-02T18:43:55Z }
          - event: OrderShipped
            values: { orderId: $miasOrder, carrier: UPS, trackingNumber: 1Z999AA10123456784, shippedAt: 2026-11-04T09:15:00Z }
          - event: OrderDelivered
            values: { orderId: $miasOrder, trackingNumber: 1Z999AA10123456784, deliveredAt: 2026-11-06T14:05:00Z }
        then:
          - view: OrderStatus
            keyed: { orderId: $miasOrder }
            rows:
              - { orderId: $miasOrder, productName: iFlight Nazgul5 V3 6S BNF, total: 329.99, currency: USD, status: delivered, paidAt: 2026-11-02T18:43:55Z, carrier: UPS, trackingNumber: 1Z999AA10123456784, shippedAt: 2026-11-04T09:15:00Z, deliveredAt: 2026-11-06T14:05:00Z }
