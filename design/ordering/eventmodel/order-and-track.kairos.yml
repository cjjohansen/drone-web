  # ---------------------------------------------------------------- Ship and deliver

  ReleasePaidOrder:
    pattern: automation
    chapter: Ship and deliver
    description: >-
      Sends a paid order to the warehouse. OrderReleasedToWarehouse is published as PaidOrder,
      which the warehouse ships. The decision compares the captured amount with the order total
      from the order's own events (ORD-007). An underpaid order is held: it stays on the to-do
      list and is not sent. An overpaid order ships; how the surplus is refunded is an open
      question (see the README).
    views:
      - list-view:
          name: PaidOrdersToRelease
          identity: orderId
          reads:
            OrderPaid: create
            OrderReleasedToWarehouse: remove
          fields:
            orderId: { type: uuid, source: system, from: OrderPaid.orderId }
            amount: { type: decimal, source: system, from: OrderPaid.amount }
            paidAt: { type: datetime, source: system, from: OrderPaid.paidAt }
    processor:
      name: PaidOrderReleaser
      lane: Integration
    command:
      name: ReleaseOrderToWarehouse
      fields:
        orderId: { type: uuid, source: system, from: PaidOrdersToRelease.orderId }
        capturedAmount: { type: decimal, source: system, from: PaidOrdersToRelease.amount }
    emits:
      - event: OrderReleasedToWarehouse
    rules:
      ORD-007:
        title: An order goes to the warehouse only when the captured amount covers the order total
        description: >-
          When the captured amount is less than the order total, the order is held: Ordering
          keeps the payment but does not send the order to the warehouse. When the captured amount
          is equal to or more than the total, the order goes to the warehouse. The refund of an
          overpayment is an open question. Given by CJ on 2026-10-29; proposed until ordering has
          ADDR.
        status: proposed
    tests:
      ReleasesAnOrderPaidInFull:
        rules: [ORD-007]
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, productId: $nazgul, quantity: 1, total: 329.99, currency: EUR, deliveryAddress: "Kaiserstrasse 12, 60311 Frankfurt am Main, Germany" }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99, paidAt: 2026-11-02T18:43:55Z }
        then:
          - event: OrderReleasedToWarehouse
            values: { orderId: $miasOrder, productId: $nazgul, quantity: 1, deliveryAddress: "Kaiserstrasse 12, 60311 Frankfurt am Main, Germany" }
      HoldsAnUnderpaidOrder:
        rules: [ORD-007]
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, productId: $nazgul, quantity: 2, total: 659.98, currency: EUR, deliveryAddress: "Kaiserstrasse 12, 60311 Frankfurt am Main, Germany" }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99, paidAt: 2026-11-02T18:43:55Z }
        then: []
      ShipsAnOverpaidOrder:
        rules: [ORD-007]
        given:
          - event: OrderPlaced
            values: { orderId: $leosOrder, productId: $nazgul, quantity: 1, total: 329.99, currency: EUR, deliveryAddress: "Keizersgracht 123, 1015 CJ Amsterdam, Netherlands" }
          - event: OrderPaid
            values: { orderId: $leosOrder, paymentId: $leosPayment, amount: 330.00, paidAt: 2026-11-03T08:11:30Z }
        then:
          - event: OrderReleasedToWarehouse
            values: { orderId: $leosOrder, productId: $nazgul, quantity: 1, deliveryAddress: "Keizersgracht 123, 1015 CJ Amsterdam, Netherlands" }
      ReleasesAnOrderOnlyOnce:
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, productId: $nazgul, quantity: 1, total: 329.99, currency: EUR }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99 }
          - event: OrderReleasedToWarehouse
            values: { orderId: $miasOrder, productId: $nazgul, quantity: 1 }
        then: []

  RecordShipment:
    pattern: translation
    chapter: Ship and deliver
    description: >-
      The warehouse tells Ordering which carrier has the parcel and under which tracking number.
      Ordering records a shipment only for an order that ReleasePaidOrder sent to the warehouse
      (ORD-006), so an unpaid order and a held, underpaid order (ORD-007) never show as shipped.
    message: Warehouse.ParcelDispatched
    processor:
      name: WarehouseListener
      lane: Integration
    command:
      name: RecordShipment
      fields:
        orderId: { type: uuid, source: system, from: message.orderId }
        carrier: { type: string, source: system, from: message.carrier }
        trackingNumber: { type: string, source: system, from: message.trackingNumber }
        shippedAt: { type: datetime, source: system, from: message.dispatchedAt }
    emits:
      - event: OrderShipped
    rules:
      ORD-006:
        title: Ordering records a shipment only for an order released to the warehouse
        description: >-
          A parcel the warehouse reports for an order without OrderReleasedToWarehouse is refused.
          That covers an order that is not paid and an order held because the captured amount is
          less than the order total (ORD-007), so neither shows as shipped. CJ confirmed the
          unpaid case on 2026-10-28 and the wider form, which also refuses a held order, on 2026-10-29.
    errors:
      OrderNotPaid: { description: The payment provider has not taken the money for this order., rule: ORD-006 }
      OrderHeld: { description: "The captured amount is less than the order total, so the order was not sent to the warehouse.", rule: ORD-006 }
    tests:
      RecordsThatMiasNazgulIsOnItsWay:
        rules: [ORD-006]
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, customerId: $mia, productName: iFlight Nazgul5 V3 6S BNF }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99 }
          - event: OrderReleasedToWarehouse
            values: { orderId: $miasOrder, productId: $nazgul, quantity: 1 }
        when:
          values: { orderId: $miasOrder, carrier: UPS, trackingNumber: 1Z999AA10123456784, dispatchedAt: 2026-11-04T09:15:00Z }
        then:
          - event: OrderShipped
            values: { orderId: $miasOrder, carrier: UPS, trackingNumber: 1Z999AA10123456784, shippedAt: 2026-11-04T09:15:00Z, customerId: $mia, productName: iFlight Nazgul5 V3 6S BNF }
      RefusesAShipmentForAnUnpaidOrder:
        rules: [ORD-006]
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, customerId: $mia, productName: iFlight Nazgul5 V3 6S BNF }
        when:
          values: { orderId: $miasOrder, carrier: UPS, trackingNumber: 1Z999AA10123456784, dispatchedAt: 2026-11-04T09:15:00Z }
        then:
          - error: OrderNotPaid
      RefusesAShipmentAfterADeclinedPayment:
        rules: [ORD-006]
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, customerId: $mia, productName: iFlight Nazgul5 V3 6S BNF }
          - event: OrderPaymentDeclined
            values: { orderId: $miasOrder, paymentId: $miasPayment, declineReason: Insufficient funds }
        when:
          values: { orderId: $miasOrder, carrier: UPS, trackingNumber: 1Z999AA10123456784, dispatchedAt: 2026-11-04T09:15:00Z }
        then:
          - error: OrderNotPaid
      RefusesAShipmentForAHeldOrder:
        rules: [ORD-006, ORD-007]
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, customerId: $mia, productName: iFlight Nazgul5 V3 6S BNF, quantity: 2, total: 659.98, currency: EUR }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99 }
        when:
          values: { orderId: $miasOrder, carrier: UPS, trackingNumber: 1Z999AA10123456784, dispatchedAt: 2026-11-04T09:15:00Z }
        then:
          - error: OrderHeld
      IgnoresAShipmentItAlreadyRecorded:
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, customerId: $mia }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99 }
          - event: OrderReleasedToWarehouse
            values: { orderId: $miasOrder, productId: $nazgul, quantity: 1 }
          - event: OrderShipped
            values: { orderId: $miasOrder, carrier: UPS, trackingNumber: 1Z999AA10123456784 }
        when:
          values: { orderId: $miasOrder, carrier: UPS, trackingNumber: 1Z999AA10123456784, dispatchedAt: 2026-11-04T09:15:00Z }
        then: []
      IgnoresAParcelForAnOrderNobodyPlaced:
        when:
          values: { orderId: $noOrder, carrier: UPS, trackingNumber: 1Z999AA10123456806, dispatchedAt: 2026-11-04T09:20:00Z }
        then: []

  NotifyOrderShipped:
    pattern: automation
    chapter: Ship and deliver
    description: 'Push notification: "Your iFlight Nazgul5 V3 6S BNF is on its way with UPS, tracking 1Z999AA10123456784." Tapping it opens the order status.'
    views:
      - list-view:
          name: ShipmentsToAnnounce
          identity: orderId
          reads:
            OrderShipped: create
            CustomerToldOrderShipped: remove
          fields:
            orderId: { type: uuid, source: system, from: OrderShipped.orderId }
            customerId: { type: uuid, source: system, from: OrderShipped.customerId }
            productName: { type: string, source: system, from: OrderShipped.productName }
            carrier: { type: string, source: system, from: OrderShipped.carrier }
            trackingNumber: { type: string, source: system, from: OrderShipped.trackingNumber }
    processor:
      name: ShippedPushSender
      lane: Notifications
      calls: [PushNotifications.SendOrderShippedPush]
    command:
      name: RecordShippedPush
      fields:
        orderId: { type: uuid, source: system, from: ShipmentsToAnnounce.orderId }
    emits:
      - event: CustomerToldOrderShipped
    tests:
      TellsMiaHerNazgulIsOnItsWay:
        given:
          - event: OrderShipped
            values: { orderId: $miasOrder, customerId: $mia, productName: iFlight Nazgul5 V3 6S BNF, carrier: UPS, trackingNumber: 1Z999AA10123456784 }
        then:
          - event: CustomerToldOrderShipped
            values: { orderId: $miasOrder }
      TellsMiaOnlyOnce:
        given:
          - event: OrderShipped
            values: { orderId: $miasOrder, customerId: $mia, productName: iFlight Nazgul5 V3 6S BNF, carrier: UPS, trackingNumber: 1Z999AA10123456784 }
          - event: CustomerToldOrderShipped
            values: { orderId: $miasOrder }
        then: []

  RecordDelivery:
    pattern: translation
    chapter: Ship and deliver
    description: The carrier knows the parcel only by its tracking number; Ordering finds the order through the tracking number it recorded at shipment.
    message: Carrier.ParcelDelivered
    processor:
      name: CarrierListener
      lane: Integration
    command:
      name: RecordDelivery
      fields:
        trackingNumber: { type: string, source: system, from: message.trackingNumber }
        deliveredAt: { type: datetime, source: system, from: message.deliveredAt }
    emits:
      - event: OrderDelivered
    tests:
      RecordsThatMiasNazgulArrived:
        given:
          - event: OrderShipped
            values: { orderId: $miasOrder, customerId: $mia, productName: iFlight Nazgul5 V3 6S BNF, carrier: UPS, trackingNumber: 1Z999AA10123456784 }
        when:
          values: { trackingNumber: 1Z999AA10123456784, deliveredAt: 2026-11-06T14:05:00Z }
        then:
          - event: OrderDelivered
            values: { trackingNumber: 1Z999AA10123456784, deliveredAt: 2026-11-06T14:05:00Z, orderId: $miasOrder, customerId: $mia, productName: iFlight Nazgul5 V3 6S BNF }
      IgnoresADeliveryItAlreadyRecorded:
        given:
          - event: OrderShipped
            values: { orderId: $miasOrder, trackingNumber: 1Z999AA10123456784 }
          - event: OrderDelivered
            values: { orderId: $miasOrder, trackingNumber: 1Z999AA10123456784 }
        when:
          values: { trackingNumber: 1Z999AA10123456784, deliveredAt: 2026-11-06T14:05:00Z }
        then: []
      IgnoresAParcelDroneWebDidNotShip:
        when:
          values: { trackingNumber: 1Z999AA19999999999, deliveredAt: 2026-11-06T14:05:00Z }
        then: []

  NotifyOrderDelivered:
    pattern: automation
    chapter: Ship and deliver
    description: 'Push notification: "Your iFlight Nazgul5 V3 6S BNF has been delivered." Tapping it opens the order status.'
    views:
      - list-view:
          name: DeliveriesToAnnounce
          identity: orderId
          reads:
            OrderDelivered: create
            CustomerToldOrderDelivered: remove
          fields:
            orderId: { type: uuid, source: system, from: OrderDelivered.orderId }
            customerId: { type: uuid, source: system, from: OrderDelivered.customerId }
            productName: { type: string, source: system, from: OrderDelivered.productName }
    processor:
      name: DeliveredPushSender
      lane: Notifications
      calls: [PushNotifications.SendOrderDeliveredPush]
    command:
      name: RecordDeliveredPush
      fields:
        orderId: { type: uuid, source: system, from: DeliveriesToAnnounce.orderId }
    emits:
      - event: CustomerToldOrderDelivered
    tests:
      TellsMiaHerNazgulHasArrived:
        given:
          - event: OrderDelivered
            values: { orderId: $miasOrder, customerId: $mia, productName: iFlight Nazgul5 V3 6S BNF, trackingNumber: 1Z999AA10123456784 }
        then:
          - event: CustomerToldOrderDelivered
            values: { orderId: $miasOrder }
      TellsMiaOnlyOnce:
        given:
          - event: OrderDelivered
            values: { orderId: $miasOrder, customerId: $mia, productName: iFlight Nazgul5 V3 6S BNF, trackingNumber: 1Z999AA10123456784 }
          - event: CustomerToldOrderDelivered
            values: { orderId: $miasOrder }
        then: []

  TrackOrder:
    pattern: query
    chapter: Ship and deliver
    description: "Phone screen: one order with a status timeline (placed, paid, shipped, delivered), the carrier and the tracking number. It is the detail view of the order and of its shipment."
    screen:
      name: OrderStatusScreen
      actor: Customer
    views:
      - single-view:
          name: OrderStatus
          keyed-by: MyOrders.orderId
          identity: orderId
          reads:
            OrderPlaced: create
            OrderPaid: update
            OrderPaymentDeclined: update
            OrderShipped: update
            OrderDelivered: update
          fields:
            orderId: { type: uuid, source: system, from: OrderPlaced.orderId, example: 7c9e6679-7425-40de-944b-e07fc1f90ae7 }
            productName: { type: string, source: system, from: OrderPlaced.productName }
            total: { type: decimal, source: system, from: OrderPlaced.total }
            currency: { type: string, source: system, from: OrderPlaced.currency }
            status:
              type: string
              source: generated
              description: "awaiting payment, payment declined, paid, shipped or delivered."
              example: shipped
            paidAt: { type: datetime, source: system, from: OrderPaid.paidAt, optional: true }
            carrier: { type: string, source: system, from: OrderShipped.carrier, optional: true }
            trackingNumber: { type: string, source: system, from: OrderShipped.trackingNumber, optional: true }
            shippedAt: { type: datetime, source: system, from: OrderShipped.shippedAt, optional: true }
            deliveredAt: { type: datetime, source: system, from: OrderDelivered.deliveredAt, optional: true }
    tests:
      ShowsAPaidOrderWaitingForTheWarehouse:
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, productName: iFlight Nazgul5 V3 6S BNF, total: 329.99, currency: EUR }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99, paidAt: 2026-11-02T18:43:55Z }
        then:
          - view: OrderStatus
            keyed: { orderId: $miasOrder }
            rows:
              - { orderId: $miasOrder, productName: iFlight Nazgul5 V3 6S BNF, total: 329.99, currency: EUR, status: paid, paidAt: 2026-11-02T18:43:55Z, carrier: null, trackingNumber: null, shippedAt: null, deliveredAt: null }
      ShowsTheParcelOnItsWay:
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, productName: iFlight Nazgul5 V3 6S BNF, total: 329.99, currency: EUR }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99, paidAt: 2026-11-02T18:43:55Z }
          - event: OrderShipped
            values: { orderId: $miasOrder, carrier: UPS, trackingNumber: 1Z999AA10123456784, shippedAt: 2026-11-04T09:15:00Z }
        then:
          - view: OrderStatus
            keyed: { orderId: $miasOrder }
            rows:
              - { orderId: $miasOrder, productName: iFlight Nazgul5 V3 6S BNF, total: 329.99, currency: EUR, status: shipped, paidAt: 2026-11-02T18:43:55Z, carrier: UPS, trackingNumber: 1Z999AA10123456784, shippedAt: 2026-11-04T09:15:00Z, deliveredAt: null }
      ShowsWhenTheDroneArrived:
        given:
          - event: OrderPlaced
            values: { orderId: $miasOrder, productName: iFlight Nazgul5 V3 6S BNF, total: 329.99, currency: EUR }
          - event: OrderPaid
            values: { orderId: $miasOrder, paymentId: $miasPayment, amount: 329.99, paidAt: 2026-11-02T18:43:55Z }
          - event: OrderShipped
            values: { orderId: $miasOrder, carrier: UPS, trackingNumber: 1Z999AA10123456784, shippedAt: 2026-11-04T09:15:00Z }
          - event: OrderDelivered
            values: { orderId: $miasOrder, trackingNumber: 1Z999AA10123456784, deliveredAt: 2026-11-06T14:05:00Z }
        then:
          - view: OrderStatus
            keyed: { orderId: $miasOrder }
            rows:
              - { orderId: $miasOrder, productName: iFlight Nazgul5 V3 6S BNF, total: 329.99, currency: EUR, status: delivered, paidAt: 2026-11-02T18:43:55Z, carrier: UPS, trackingNumber: 1Z999AA10123456784, shippedAt: 2026-11-04T09:15:00Z, deliveredAt: 2026-11-06T14:05:00Z }
