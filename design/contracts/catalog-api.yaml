# Catalog API Events: published integration events that the Catalog API consumes. Conventions: README.md.
asyncapi: 3.0.0
info:
  title: Catalog API Events
  version: 1.0.0
  description: |
    What the Catalog API consumes to build its own product view. Consumer only: it publishes nothing.
    The view and its cross-domain rules (for example, when a product counts as sellable) are its own.

    Everything in this file is a published integration event: an external contract between bounded
    contexts. The domain events in each context's own event store are private to that context and are
    not described here; a publisher in the owning context translates them into these messages.

    Transport: Kafka is the binding used here (servers and channel bindings). Channels, messages and
    the CloudEvents attributes are meant to work on other transports too (AMQP, HTTP webhooks) through
    their CloudEvents bindings. Messages are JSON (application/json), UTF-8 encoded. The CloudEvents
    attributes come from the shared envelope (shared/envelope.yaml). Rules and conventions: README.md.
  tags:
  - name: domain:Catalog
    description: The Catalog domain of drone-web.
  - name: subdomain:ProductDiscovery
    description: Search, browse, evaluate and compare on the storefront.
  - name: service:CatalogApiService
    description: The Catalog API (read side). Its product view is internal and has no published channel.
  - name: channel:ProductRecords
    description: The product-records channel (product records).
  - name: channel:ProductSpecifications
    description: The product-specifications channel (product specifications).
  - name: channel:ProductCategoryAssignments
    description: The product-category-assignments channel (product category assignments).
  - name: channel:ProductDocuments
    description: The product-documents channel (product documents).
  - name: channel:EffectivePrices
    description: The effective-prices channel (effective prices).
  - name: channel:ProductAvailabilities
    description: The product-availabilities channel (product availabilities).
defaultContentType: application/json
servers:
  production:
    $ref: shared/kafka-servers.yaml#/components/servers/production
channels:
  productRecords:
    address: product-records
    title: Product records
    description: |
      Consumed from the Product Lifecycle Service (Product Data team). Defined here, not referenced, so this
      file states what the Catalog API relies on. Producer contract: product-lifecycle.yaml.
    messages:
      ProductRecordChanged:
        $ref: '#/components/messages/ProductRecordChanged'
        x-eventcatalog-role: client
    tags:
    - name: domain:Catalog
      description: The Catalog domain of drone-web.
    - name: subdomain:ProductDiscovery
      description: Search, browse, evaluate and compare on the storefront.
    - name: service:CatalogApiService
      description: The Catalog API (read side). Its product view is internal and has no published channel.
    - name: channel:ProductRecords
      description: The product-records channel (product records).
    bindings:
      kafka:
        topic: product-records
        topicConfiguration:
          cleanup.policy:
          - compact
        bindingVersion: 0.5.0
