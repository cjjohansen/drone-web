        Published integration event, consumed. Model: domain-specific, owned by Product Lifecycle. Headers and payload are the producer's.
      contentType: application/json
      x-model: domain-specific
      headers:
        $ref: product-lifecycle.yaml#/components/messages/ProductRecordChanged/headers
      payload:
        $ref: product-lifecycle.yaml#/components/schemas/ProductRecord
