# Product Lifecycle Events: published events of the Product Lifecycle Service. Conventions: README.md.
asyncapi: 3.0.0
info:
  title: Product Lifecycle Events
  version: 1.0.0
  description: |
    What the Product Lifecycle Service publishes: product records and product specifications.
    Product Lifecycle is the only writer of product identity, attributes, specs and lifecycle state.

    Everything in this file is a published event on a published stream: a contract between bounded
    contexts and a data product. Each context's internal events (on internal streams, in its own event
    store) are private to that context and are not described here; a publisher in the owning context
    translates them into these published events.

    Transport: Kafka is the binding used here (servers and channel bindings). Channels, messages and
    the CloudEvents attributes are meant to work on other transports too (AMQP, HTTP webhooks) through
    their CloudEvents bindings. Messages are JSON (application/json), UTF-8 encoded. The CloudEvents
    attributes come from the shared envelope (shared/envelope.yaml). Rules and conventions: README.md.
  tags:
  - name: domain:Catalog
    description: The Catalog domain of drone-web.
  - name: subdomain:ProductLifecycle
    description: Product identity, master data and lifecycle state. Supporting, with a Core spec model.
  - name: service:ProductLifecycleService
    description: Product Lifecycle Service, in the Product Data bounded context.
  - name: channel:ProductRecords
    description: The product-records channel (product records).
  - name: channel:ProductSpecifications
    description: The product-specifications channel (product specifications).
defaultContentType: application/json
servers:
  production:
    $ref: shared/kafka-servers.yaml#/components/servers/production
channels:
  productRecords:
    address: product-records
    title: Product records
    description: |
      Product Lifecycle (Product Data team). Identity, attributes and lifecycle state. Sent on create,
      attribute change and lifecycle transition. Discontinued is a state, not a tombstone.
      Consumed by the Catalog API, Partner Catalog and the Compatibility Check; see their AsyncAPI files.
    messages:
      ProductRecordChanged:
        $ref: '#/components/messages/ProductRecordChanged'
    tags:
    - name: domain:Catalog
      description: The Catalog domain of drone-web.
    - name: subdomain:ProductLifecycle
      description: Product identity, master data and lifecycle state. Supporting, with a Core spec model.
    - name: service:ProductLifecycleService
      description: Product Lifecycle Service, in the Product Data bounded context.
    - name: channel:ProductRecords
      description: The product-records channel (product records).
    bindings:
      kafka:
        topic: product-records
        topicConfiguration:
          cleanup.policy:
          - compact
        bindingVersion: 0.5.0
    x-data-product:
      owner: Product Data
      context: Product Lifecycle
      kind: source-aligned
      type: supporting
  productSpecifications:
    address: product-specifications
    title: Product specifications
    description: |
      Product Lifecycle (Product Data team). The spec model the compatibility rules read. Core
      contract: typed fields with units and an explicit specSchemaVersion; breaking changes get a
      new major version and a parallel channel.
      Consumed by the Compatibility Check and the Catalog API; see their AsyncAPI files.
    messages:
      ProductSpecificationChanged:
        $ref: '#/components/messages/ProductSpecificationChanged'
    tags:
    - name: domain:Catalog
      description: The Catalog domain of drone-web.
    - name: subdomain:ProductLifecycle
      description: Product identity, master data and lifecycle state. Supporting, with a Core spec model.
    - name: service:ProductLifecycleService
      description: Product Lifecycle Service, in the Product Data bounded context.
    - name: channel:ProductSpecifications
      description: The product-specifications channel (product specifications).
    bindings:
      kafka:
        topic: product-specifications
        topicConfiguration:
          cleanup.policy:
          - compact
        bindingVersion: 0.5.0
    x-data-product:
      owner: Product Data
      context: Product Lifecycle
      kind: source-aligned
      type: core
operations:
  sendProductRecordChanged:
    action: send
    channel:
      $ref: '#/channels/productRecords'
    messages:
    - $ref: '#/channels/productRecords/messages/ProductRecordChanged'
  sendProductSpecificationChanged:
    action: send
    channel:
      $ref: '#/channels/productSpecifications'
    messages:
    - $ref: '#/channels/productSpecifications/messages/ProductSpecificationChanged'
components:
  messages:
    ProductRecordChanged:
      name: ProductRecordChanged
      title: ProductRecordChanged
      summary: Current product records state for one product, keyed by productId.
      description: |
        Published event. Model: domain-specific, owned by Product Lifecycle. Headers use the canonical shared envelope and origin uses the canonical shared Origin schema.
      contentType: application/json
      x-model: domain-specific
      traits:
      - $ref: shared/envelope.yaml#/components/messageTraits/DroneWebEvent
      headers:
        allOf:
        - $ref: shared/envelope.yaml#/components/schemas/CloudEventHeaders
        - type: object
          properties:
            ce_type:
              const: tech.drone-web.catalog.product-lifecycle.v1.ProductRecordChanged
            ce_dataschema:
              const: https://schemas.drone-web.tech/catalog/product-lifecycle/v1/ProductRecordChanged.json
      payload:
        $ref: '#/components/schemas/ProductRecord'
    ProductSpecificationChanged:
      name: ProductSpecificationChanged
      title: ProductSpecificationChanged
      summary: Current product specifications state for one product, keyed by productId.
      description: |
        Published event. Model: domain-specific, owned by Product Lifecycle. Headers use the canonical shared envelope and origin uses the canonical shared Origin schema.
      contentType: application/json
      x-model: domain-specific
      traits:
      - $ref: shared/envelope.yaml#/components/messageTraits/DroneWebEvent
      headers:
        allOf:
        - $ref: shared/envelope.yaml#/components/schemas/CloudEventHeaders
        - type: object
          properties:
            ce_type:
              const: tech.drone-web.catalog.product-lifecycle.v1.ProductSpecificationChanged
            ce_dataschema:
              const: https://schemas.drone-web.tech/catalog/product-lifecycle/v1/ProductSpecificationChanged.json
      payload:
        $ref: '#/components/schemas/ProductSpecification'
  schemas:
    ProductRecord:
      type: object
      required:
      - sku
      - name
      - brand
      - lifecycleState
      properties:
        sku:
          type: string
        name:
          type: string
        brand:
          type: string
        attributes:
          type: object
          additionalProperties: true
        lifecycleState:
          type: string
          description: Drafts are not published on product-records; a product appears when it goes live.
          enum:
          - active
          - discontinued
        replacementProductId:
          type: string
          format: uuid
        origin:
          $ref: shared/common-schemas.yaml#/components/schemas/Origin
    ProductSpecification:
      type: object
      required:
      - specSchemaVersion
      - specifications
      properties:
        specSchemaVersion:
          type: string
          description: Version of the spec model, e.g. 1.2.
        specifications:
          type: object
          properties:
            voltage:
              $ref: '#/components/schemas/Range'
            maxCurrent:
              $ref: '#/components/schemas/Quantity'
            mounting:
              type: string
              description: Mounting pattern, e.g. 30.5x30.5-m3.
            protocols:
              type: array
              items:
                type: string
            weight:
              $ref: '#/components/schemas/Quantity'
          additionalProperties: false
        origin:
          $ref: shared/common-schemas.yaml#/components/schemas/Origin
    Quantity:
      type: object
      required:
      - value
      - unit
      properties:
        value:
          type: number
        unit:
          type: string
          description: SI unit, e.g. A, g.
    Range:
      type: object
      required:
      - min
      - max
      - unit
      properties:
        min:
          type: number
        max:
          type: number
        unit:
          type: string
