# Partner Catalog Events: published integration events of the Partner Catalog Service. Conventions: README.md.
asyncapi: 3.0.0
info:
  title: Partner Catalog Events
  version: 1.0.0
  description: |
    What the Partner Catalog Service consumes (product records, effective prices, availability) and
    the join it publishes for partners. The join and its inclusion rule are the Commercial team's own.

    Everything in this file is a published integration event: an external contract between bounded
    contexts. The domain events in each context's own event store are private to that context and are
    not described here; a publisher in the owning context translates them into these messages.

    Transport: Kafka is the binding used here (servers and channel bindings). Channels, messages and
    the CloudEvents attributes are meant to work on other transports too (AMQP, HTTP webhooks) through
    their CloudEvents bindings. Messages are JSON (application/json), UTF-8 encoded. The CloudEvents
    attributes come from the shared envelope (shared/envelope.yaml). Rules and conventions: README.md.
  tags:
  - name: domain:Catalog
    description: The Catalog domain of drone-web.
  - name: subdomain:PartnerCatalog
    description: The simplified catalog that partner systems receive.
  - name: service:PartnerCatalogService
    description: Partner Catalog Service, owned by the Commercial team.
  - name: channel:PartnerCatalogEntries
    description: The partner-catalog-entries channel (partner catalog entries).
  - name: channel:ProductRecords
    description: The product-records channel (product records).
  - name: channel:EffectivePrices
    description: The effective-prices channel (effective prices).
  - name: channel:ProductAvailabilities
    description: The product-availabilities channel (product availabilities).
defaultContentType: application/json
servers:
  production:
    $ref: shared/kafka-servers.yaml#/components/servers/production
channels:
  partnerCatalogEntries:
    address: partner-catalog-entries
    title: Partner catalog entries
    description: |
      Partner Catalog (Commercial team). The join the Commercial team owns for partners: simplified
      product, batch price and availability. Uses the derived envelope, so ce_derivedfrom is required.
      Consumed by partner systems outside drone-web, through the Partner Catalog API.
    messages:
      PartnerCatalogEntryChanged:
        $ref: '#/components/messages/PartnerCatalogEntryChanged'
    tags:
    - name: domain:Catalog
      description: The Catalog domain of drone-web.
    - name: subdomain:PartnerCatalog
      description: The simplified catalog that partner systems receive.
    - name: service:PartnerCatalogService
      description: Partner Catalog Service, owned by the Commercial team.
    - name: channel:PartnerCatalogEntries
      description: The partner-catalog-entries channel (partner catalog entries).
    bindings:
      kafka:
        topic: partner-catalog-entries
        topicConfiguration:
          cleanup.policy:
          - compact
        bindingVersion: 0.5.0
    x-data-product:
      owner: Commercial
      context: Partner Catalog
      kind: consumer-aligned
  productRecords:
    address: product-records
    title: Product records
    description: |
      Consumed from the Product Lifecycle Service (Product Data team). Defined here, not referenced, so this
      file states what the Partner Catalog Service relies on. Producer contract: product-lifecycle.yaml.
    messages:
      ProductRecordChanged:
        $ref: '#/components/messages/ProductRecordChanged'
        x-eventcatalog-role: client
    tags:
    - name: domain:Catalog
      description: The Catalog domain of drone-web.
    - name: subdomain:PartnerCatalog
      description: The simplified catalog that partner systems receive.
    - name: service:PartnerCatalogService
      description: Partner Catalog Service, owned by the Commercial team.
    - name: channel:ProductRecords
      description: The product-records channel (product records).
    bindings:
      kafka:
        topic: product-records
        topicConfiguration:
          cleanup.policy:
          - compact
        bindingVersion: 0.5.0
  effectivePrices:
    address: effective-prices
    title: Effective prices
    description: |
      Consumed from the Pricing Service (Commercial team). Defined here, not referenced, so this
      file states what the Partner Catalog Service relies on. Producer contract: pricing.yaml.
    messages:
      EffectivePriceChanged:
        $ref: '#/components/messages/EffectivePriceChanged'
        x-eventcatalog-role: client
    tags:
    - name: domain:Catalog
      description: The Catalog domain of drone-web.
    - name: subdomain:PartnerCatalog
      description: The simplified catalog that partner systems receive.
    - name: service:PartnerCatalogService
      description: Partner Catalog Service, owned by the Commercial team.
    - name: channel:EffectivePrices
      description: The effective-prices channel (effective prices).
    bindings:
      kafka:
        topic: effective-prices
        topicConfiguration:
          cleanup.policy:
          - compact
        bindingVersion: 0.5.0
  productAvailabilities:
    address: product-availabilities
    title: Product availabilities
    description: |
      Consumed from the Inventory Service (Commercial team). Defined here, not referenced, so this
      file states what the Partner Catalog Service relies on. Producer contract: inventory.yaml.
    messages:
      ProductAvailabilityChanged:
        $ref: '#/components/messages/ProductAvailabilityChanged'
        x-eventcatalog-role: client
    tags:
    - name: domain:Catalog
      description: The Catalog domain of drone-web.
    - name: subdomain:PartnerCatalog
      description: The simplified catalog that partner systems receive.
    - name: service:PartnerCatalogService
      description: Partner Catalog Service, owned by the Commercial team.
    - name: channel:ProductAvailabilities
      description: The product-availabilities channel (product availabilities).
    bindings:
      kafka:
        topic: product-availabilities
        topicConfiguration:
          cleanup.policy:
          - compact
        bindingVersion: 0.5.0
operations:
  sendPartnerCatalogEntryChanged:
    action: send
    channel:
      $ref: '#/channels/partnerCatalogEntries'
    messages:
    - $ref: '#/channels/partnerCatalogEntries/messages/PartnerCatalogEntryChanged'
  receiveProductRecordChanged:
    action: receive
    channel:
      $ref: '#/channels/productRecords'
    messages:
    - $ref: '#/channels/productRecords/messages/ProductRecordChanged'
  receiveEffectivePriceChanged:
    action: receive
    channel:
      $ref: '#/channels/effectivePrices'
    messages:
    - $ref: '#/channels/effectivePrices/messages/EffectivePriceChanged'
  receiveProductAvailabilityChanged:
    action: receive
    channel:
      $ref: '#/channels/productAvailabilities'
    messages:
    - $ref: '#/channels/productAvailabilities/messages/ProductAvailabilityChanged'
components:
  messages:
    PartnerCatalogEntryChanged:
      name: PartnerCatalogEntryChanged
      title: PartnerCatalogEntryChanged
      summary: Current partner catalog entries state for one product, keyed by productId.
      description: |
        Published integration event. Model: domain-specific, owned by Partner Catalog. Headers use the canonical shared envelope.
      contentType: application/json
      x-model: domain-specific
      traits:
      - $ref: shared/envelope.yaml#/components/messageTraits/DroneWebEvent
      headers:
        allOf:
        - $ref: shared/envelope.yaml#/components/schemas/DerivedCloudEventHeaders
        - type: object
          properties:
            ce_type:
              const: tech.drone-web.catalog.partner-catalog.v1.PartnerCatalogEntryChanged
            ce_dataschema:
              const: https://schemas.drone-web.tech/catalog/partner-catalog/v1/PartnerCatalogEntryChanged.json
      payload:
        $ref: '#/components/schemas/CatalogFeedEntry'
    ProductRecordChanged:
      name: ProductRecordChanged
      title: ProductRecordChanged
      summary: ProductRecordChanged as consumed here; the producer's contract is product-lifecycle.yaml.
      description: |
        Published integration event, consumed. Model: domain-specific, owned by Product Lifecycle. Headers and payload are the producer's.
      contentType: application/json
      x-model: domain-specific
      headers:
        $ref: product-lifecycle.yaml#/components/messages/ProductRecordChanged/headers
      payload:
        $ref: product-lifecycle.yaml#/components/schemas/ProductRecord
    EffectivePriceChanged:
      name: EffectivePriceChanged
      title: EffectivePriceChanged
      summary: EffectivePriceChanged as consumed here; the producer's contract is pricing.yaml.
      description: |
        Published integration event, consumed. Model: domain-specific, owned by Pricing and Promotions. Headers and payload are the producer's.
      contentType: application/json
      x-model: domain-specific
      headers:
        $ref: pricing.yaml#/components/messages/EffectivePriceChanged/headers
      payload:
        $ref: pricing.yaml#/components/schemas/EffectivePrice
    ProductAvailabilityChanged:
      name: ProductAvailabilityChanged
      title: ProductAvailabilityChanged
      summary: ProductAvailabilityChanged as consumed here; the producer's contract is inventory.yaml.
      description: |
        Published integration event, consumed. Model: domain-specific, owned by Inventory and Availability. Headers and payload are the producer's.
      contentType: application/json
      x-model: domain-specific
      headers:
        $ref: inventory.yaml#/components/messages/ProductAvailabilityChanged/headers
      payload:
        $ref: inventory.yaml#/components/schemas/Availability
  schemas:
    CatalogFeedEntry:
      type: object
      required:
      - included
      properties:
        included:
          type: boolean
          description: Commercial's own rule for whether partners see the product.
        sku:
          type: string
        name:
          type: string
        brand:
          type: string
        currency:
          type: string
        unitPrice:
          type: number
        availability:
          type: string
          enum:
          - in-stock
          - low-stock
          - backorder
          - suspended
